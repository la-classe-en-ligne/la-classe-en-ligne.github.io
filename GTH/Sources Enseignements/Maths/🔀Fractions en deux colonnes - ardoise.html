<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fractions en deux colonnes</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='3' y='8' width='27' height='48' rx='6' fill='%23fde3cf'/%3E%3Crect x='34' y='8' width='27' height='48' rx='6' fill='%23d6e6fb'/%3E%3Ctext x='16.5' y='30' text-anchor='middle' font-family='Arial' font-weight='900' font-size='17' fill='%23e8792a'%3E3%3C/text%3E%3Crect x='9' y='33' width='15' height='3' fill='%231c2b3a'/%3E%3Ctext x='16.5' y='52' text-anchor='middle' font-family='Arial' font-weight='900' font-size='17' fill='%231f5fbf'%3E4%3C/text%3E%3Ctext x='47.5' y='30' text-anchor='middle' font-family='Arial' font-weight='900' font-size='17' fill='%23e8792a'%3E7%3C/text%3E%3Crect x='40' y='33' width='15' height='3' fill='%231c2b3a'/%3E%3Ctext x='47.5' y='52' text-anchor='middle' font-family='Arial' font-weight='900' font-size='15' fill='%231f5fbf'%3E10%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Quicksand:wght@600;700&display=swap">
<style>
  /* Écran de questions à l'ardoise, deux niveaux côte à côte : la fiche NUM 6 de la banque (exercices différenciés P1, p. 6),
     même exercice, même item, nombres CM1 à gauche et CM2 à droite. Une seule consigne pour tous. */
  :root{ --encre:#1c2b3a; --gris:#6b7785; --bord:#d5dde6; --num:#e8792a; --den:#1f5fbf; --bien:#1a8f5c;
    --g:#c2571a; --g-bg:#fff4ea; --d:#1f5fbf; --d-bg:#eef4fd; }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0; color:var(--encre); font-family:"Quicksand",system-ui,sans-serif; overflow:hidden; height:100vh; display:flex; flex-direction:column; background:#f3f6f9;
    user-select:none; -webkit-user-select:none;}

  .barre{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:16px; padding:10px 26px; background:#fff; border-bottom:3px solid var(--bord);}
  .titre{display:flex; align-items:center; gap:12px;}
  .titre svg{width:46px; height:46px;}
  .titre h1{font-family:"Baloo 2",cursive; font-weight:800; font-size:1.8rem; margin:0;}
  .onglets{display:flex; gap:8px; background:#e8eef5; padding:6px; border-radius:16px;}
  .onglets button{font:inherit; font-family:"Baloo 2",cursive; font-weight:700; font-size:1.35rem; padding:4px 22px; border-radius:12px; border:none; cursor:pointer; background:transparent; color:var(--gris);}
  .onglets button.actif{background:#fff; color:var(--encre); box-shadow:0 3px 10px rgba(28,43,58,.15);}
  .items{justify-self:end; display:flex; gap:6px;}
  .items button{font:inherit; font-family:"Baloo 2",cursive; font-weight:700; font-size:1.25rem; min-width:48px; height:44px; border-radius:12px; cursor:pointer; background:#fff; border:2px solid var(--bord); color:var(--gris);}
  .items button.actif{background:var(--encre); color:#fff; border-color:var(--encre);}

  .consigne{display:flex; flex-direction:column; align-items:center; gap:6px; padding:12px 20px 0;}
  .consigne p{margin:0; font-family:"Baloo 2",cursive; font-weight:700; font-size:2.3rem; background:#fff; padding:2px 26px; border-radius:16px; border:2px solid var(--bord);}
  .exemple{font-family:"Baloo 2",cursive; font-weight:700; font-size:1.5rem; background:#fff8dc; border-radius:12px; padding:2px 18px; display:flex; align-items:center; gap:10px;}
  .exemple:empty{display:none;}
  .exemple .dessin.bandes svg{height:40px;}

  .colonnes{flex:1; min-height:0; display:grid; grid-template-columns:1fr 1fr; gap:26px; padding:12px 30px;}
  .col{border-radius:24px; padding:14px 26px; display:flex; flex-direction:column; min-height:0; position:relative;}
  .col.g{background:var(--g-bg); border:4px solid var(--g);} .col.d{background:var(--d-bg); border:4px solid var(--d);}
  .col h2{margin:0; font-family:"Baloo 2",cursive; font-weight:800; font-size:2.2rem; text-align:center;}
  .col.g h2{color:var(--g);} .col.d h2{color:var(--d);}
  .lettre{position:absolute; left:22px; top:12px; font-family:"Baloo 2",cursive; font-weight:800; font-size:2.4rem; color:var(--gris);}
  .q{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:26px; text-align:center; min-height:0;}
  .q .texte{font-family:"Baloo 2",cursive; font-weight:700; font-size:4rem; line-height:1.1; display:flex; align-items:center; justify-content:center;}
  .rep{font-family:"Baloo 2",cursive; font-weight:800; font-size:3rem; color:var(--bien); background:#fff; border:3px solid var(--bien); border-radius:16px; padding:4px 22px;
    display:flex; align-items:center; gap:12px; flex-wrap:wrap; justify-content:center; max-width:100%;}
  .rep.long{font-size:1.9rem; gap:6px;}
  body:not(.correction) .rep{visibility:hidden;}

  .fr{display:inline-flex; flex-direction:column; align-items:center; font-family:"Baloo 2",cursive; font-weight:800; line-height:.95; vertical-align:middle; font-size:1.25em;}
  .fr b{color:var(--num);} .fr i{font-style:normal; color:var(--den); border-top:5px solid var(--encre); padding:0 8px;}
  .rep.long .fr i{border-top-width:3px; padding:0 3px;}
  .dessin{display:flex; gap:22px; align-items:center; justify-content:center; flex-wrap:wrap;}
  .dessin svg{height:190px; width:auto;}
  .dessin.moyen svg{height:150px;}
  .dessin svg.grand{height:280px; max-width:none;}
  .dessin.bandes{gap:14px;}
  .dessin.bandes svg{height:64px;}
  .rep .dessin.bandes svg{height:56px;}

  .bas{display:flex; justify-content:center; align-items:center; gap:16px; padding:6px 0 16px;}
  .bas button{font:inherit; font-weight:700; font-size:1.3rem; padding:8px 22px; border-radius:999px; cursor:pointer; background:#fff; border:2px solid var(--bord); color:var(--encre);}
  .bas button.corr{background:#eaf7f1; border-color:var(--bien); color:var(--bien);}
  body.correction .bas button.corr{background:var(--bien); color:#fff;}
</style>
</head>
<body>
<div class="barre">
  <div class="titre">
    <svg viewBox="0 0 64 64" aria-hidden="true"><rect x="3" y="8" width="27" height="48" rx="6" fill="#fde3cf"/><rect x="34" y="8" width="27" height="48" rx="6" fill="#d6e6fb"/><text x="16.5" y="30" text-anchor="middle" font-family="Arial" font-weight="900" font-size="17" fill="#e8792a">3</text><rect x="9" y="33" width="15" height="3" fill="#1c2b3a"/><text x="16.5" y="52" text-anchor="middle" font-family="Arial" font-weight="900" font-size="17" fill="#1f5fbf">4</text><text x="47.5" y="30" text-anchor="middle" font-family="Arial" font-weight="900" font-size="17" fill="#e8792a">7</text><rect x="40" y="33" width="15" height="3" fill="#1c2b3a"/><text x="47.5" y="52" text-anchor="middle" font-family="Arial" font-weight="900" font-size="15" fill="#1f5fbf">10</text></svg>
    <h1>Fractions en deux colonnes</h1>
  </div>
  <div class="onglets" id="onglets"></div>
  <div class="items" id="items"></div>
</div>
<div class="consigne"><p id="consigne"></p><div class="exemple" id="exemple"></div></div>
<div class="colonnes" id="colonnes">
  <div class="col g"><span class="lettre" id="lg"></span><h2>CM1</h2><div class="q" id="qg"></div></div>
  <div class="col d"><span class="lettre" id="ld"></span><h2>CM2</h2><div class="q" id="qd"></div></div>
</div>
<div class="bas">
  <button type="button" id="prec">◀</button>
  <button type="button" class="corr" id="btnCorr">👁 Correction</button>
  <button type="button" id="suiv">▶</button>
</div>
<script>
(function () {
  // ---------- Écritures et dessins ----------
  function F(n, d) { return '<span class="fr"><b>' + n + '</b><i>' + d + '</i></span>'; }
  var TRAIT = 'stroke="#1c2b3a" stroke-width="2.5"';
  function svg(w, h, contenu) { return '<svg viewBox="0 0 ' + w + ' ' + h + '">' + contenu + '</svg>'; }
  function pt(cx, cy, r, deg) { var a = (deg - 90) * Math.PI / 180; return (cx + r * Math.cos(a)).toFixed(1) + ' ' + (cy + r * Math.sin(a)).toFixed(1); }
  // disque partagé en n parts, k coloriées (en partant du haut, dans le sens des aiguilles)
  function disque(n, k, coul) {
    var s = '', c = 52;
    for (var i = 0; i < n; i++) s += '<path d="M' + c + ' ' + c + ' L' + pt(c, c, 48, i * 360 / n) + ' A48 48 0 0 1 ' + pt(c, c, 48, (i + 1) * 360 / n) + ' Z" fill="' + (i < k ? coul : '#fff') + '" ' + TRAIT + '/>';
    return svg(104, 104, s);
  }
  // fleur de n pétales, k colorié(s) dans le sens des aiguilles depuis le haut : les blancs restent à gauche, comme sur la fiche
  function fleur(n, k, coul) {
    var s = '', c = 60;
    for (var i = 0; i < n; i++) {
      // un pétale = une goutte : pointe au centre, tête arrondie
      var a = i * 360 / n + 15, g = pt(c, c, 40, a - 12), d = pt(c, c, 40, a + 12);
      s += '<path d="M' + c + ' ' + c + ' L' + g + ' A9.5 9.5 0 1 1 ' + d + ' Z" fill="' + (i < k ? coul : '#fff') + '" ' + TRAIT + ' stroke-linejoin="round"/>';
    }
    return svg(120, 120, s).replace("<svg ", "<svg class=\"grand\" ");
  }
  // rectangle de col × lig cases, k coloriées colonne par colonne
  function grille(col, lig, k, coul) {
    var s = '', t = 30;
    for (var x = 0; x < col; x++) for (var y = 0; y < lig; y++)
      s += '<rect x="' + (3 + x * t) + '" y="' + (3 + y * t) + '" width="' + t + '" height="' + t + '" fill="' + (x * lig + y < k ? coul : '#fff') + '" ' + TRAIT + '/>';
    s += '<rect x="3" y="3" width="' + col * t + '" height="' + lig * t + '" fill="none" stroke="#1c2b3a" stroke-width="4"/>';
    return svg(col * t + 6, lig * t + 6, s);
  }
  // étoile en 5 parts, k coloriées (en partant de la branche du haut)
  function etoile(k, coul) {
    var s = '', c = 50;
    for (var i = 0; i < 5; i++) s += '<path d="M' + c + ' ' + c + ' L' + pt(c, c, 20, i * 72 - 36) + ' L' + pt(c, c, 46, i * 72) + ' L' + pt(c, c, 20, i * 72 + 36) + ' Z" fill="' + (i < k ? coul : '#fff') + '" ' + TRAIT + ' stroke-linejoin="round"/>';
    return svg(100, 100, s);
  }
  // bande-unité de n parts, k coloriées, contour de l'unité épais
  function bande(n, k) {
    var s = '', t = 40;
    for (var p = 0; p < n; p++) s += '<rect x="' + (3 + p * t) + '" y="3" width="' + t + '" height="40" fill="' + (p < k ? '#ff9a1f' : '#fff') + '" stroke="#3a2b10" stroke-width="2.5"/>';
    s += '<rect x="3" y="3" width="' + n * t + '" height="40" fill="none" stroke="#1c2b3a" stroke-width="5"/>';
    return svg(n * t + 6, 46, s);
  }
  function D(h, cls) { return '<div class="dessin' + (cls ? ' ' + cls : '') + '">' + h + '</div>'; }
  // plusieurs unités : k parts coloriées en tout, unité après unité
  function bandes(unites, parts, k) { var h = ''; for (var u = 0; u < unites; u++) h += bande(parts, Math.max(0, Math.min(parts, k - u * parts))); return D(h, "bandes"); }
  // décomposition comme dans l'exemple de la fiche : n/d = 1/d + 1/d + … = n × 1/d
  function decompose(n, d) {
    var t = []; for (var i = 0; i < n; i++) t.push(F(1, d));
    return F(n, d) + " = " + t.join(" + ") + " = " + n + " × " + F(1, d);
  }

  var ROSE = "#f23d6c", VERT = "#37b34a", ORANGE = "#ff9a1f", BLEU = "#38b6ff", JAUNE = "#ffd84d";
  // NUM 6 « Je sais lire, écrire et représenter les fractions » — banque, exercices différenciés P1, page 6.
  // Les dessins de l'exercice 1 reproduisent ceux de la fiche (mêmes partages, mêmes parts coloriées).
  var EXOS = [
    { nom: "Exercice 1", consigne: "Écris la fraction en lettres et en chiffres", items: [
      { l: "a", g: { q: D(disque(8, 6, ROSE)), r: F(6, 8) + " six huitièmes" },
                d: { q: D(disque(8, 8, ROSE) + disque(8, 7, ROSE)), r: F(15, 8) + " quinze huitièmes" } },
      { l: "b", g: { q: D(fleur(12, 9, VERT)), r: F(9, 12) + " neuf douzièmes" },
                d: { q: D(disque(4, 4, JAUNE) + disque(4, 4, JAUNE) + disque(4, 3, JAUNE)), r: F(11, 4) + " onze quarts" } },
      { l: "c", g: { q: D(grille(2, 2, 4, ORANGE)), r: F(4, 4) + " quatre quarts" },
                d: { q: D(etoile(5, VERT) + etoile(5, VERT) + etoile(2, VERT)), r: F(12, 5) + " douze cinquièmes" } },
      { l: "d", g: { q: D(grille(3, 2, 6, BLEU)), r: F(6, 6) + " six sixièmes" },
                d: { q: D(grille(5, 2, 6, BLEU) + grille(5, 2, 4, BLEU), "moyen"), r: F(10, 10) + " dix dixièmes" } },
      { l: "⭐e", g: { q: bandes(2, 7, 9), r: F(9, 7) + " neuf septièmes" },
                  d: { q: bandes(4, 7, 23), r: F(23, 7) + " vingt-trois septièmes" } }
    ] },
    { nom: "Exercice 2", consigne: "Représente la fraction : trace le contour de l'unité", exemple: "ex : " + F(5, 3) + bandes(2, 3, 5), items: [
      { l: "a", g: { q: F(3, 5), r: bandes(1, 5, 3) }, d: { q: F(9, 5), r: bandes(2, 5, 9) } },
      { l: "b", g: { q: F(4, 4), r: bandes(1, 4, 4) }, d: { q: F(8, 2), r: bandes(4, 2, 8) } },
      { l: "c", g: { q: F(3, 2), r: bandes(2, 2, 3) }, d: { q: F(15, 9), r: bandes(2, 9, 15) } },
      { l: "d", g: { q: F(4, 3), r: bandes(2, 3, 4) }, d: { q: F(11, 3), r: bandes(4, 3, 11) } },
      { l: "⭐e", g: { q: F(9, 5), r: bandes(2, 5, 9) }, d: { q: F(17, 6), r: bandes(3, 6, 17) } }
    ] },
    { nom: "Exercice 3", consigne: "Décompose la fraction comme dans l'exemple", exemple: "ex : " + decompose(7, 4), items: [
      { l: "a", g: { q: F(4, 2), r: decompose(4, 2) }, d: { q: F(5, 2), r: decompose(5, 2) } },
      { l: "b", g: { q: F(5, 3), r: decompose(5, 3) }, d: { q: F(6, 4), r: decompose(6, 4) } },
      { l: "c", g: { q: F(8, 6), r: decompose(8, 6) }, d: { q: F(8, 6), r: decompose(8, 6) } },
      { l: "d", g: { q: F(6, 5), r: decompose(6, 5) }, d: { q: F(9, 3), r: decompose(9, 3) } },
      { l: "⭐e", g: { q: F(10, 3), r: decompose(10, 3) }, d: { q: F(14, 5), r: decompose(14, 5) } }
    ] }
  ];

  var el = function (id) { return document.getElementById(id); };
  var exo = 0, item = 0;
  EXOS.forEach(function (e, i) {
    var b = document.createElement("button"); b.type = "button"; b.textContent = e.nom;
    b.addEventListener("click", function () { aller(i, 0); }); el("onglets").appendChild(b);
  });
  function aller(e, it) {
    exo = e; item = it;
    var E = EXOS[exo], I = E.items[item];
    document.body.classList.remove("correction");
    el("consigne").textContent = E.consigne;
    el("exemple").innerHTML = E.exemple || "";
    el("lg").textContent = el("ld").textContent = I.l + ".";
    [["qg", I.g], ["qd", I.d]].forEach(function (c) {
      el(c[0]).innerHTML = '<div class="texte">' + c[1].q + '</div><div class="rep' + (exo === 2 ? ' long' : '') + '">' + c[1].r + '</div>';
    });
    Array.prototype.forEach.call(el("onglets").children, function (b, k) { b.classList.toggle("actif", k === exo); });
    el("items").innerHTML = "";
    E.items.forEach(function (x, k) {
      var b = document.createElement("button"); b.type = "button"; b.textContent = x.l; if (k === item) b.className = "actif";
      b.addEventListener("click", function () { aller(exo, k); }); el("items").appendChild(b);
    });
    try { history.replaceState(null, "", "#" + (exo + 1)); } catch (err) {}
  }
  // ◀ ▶ : item par item, puis exercice suivant
  function pas(sens) {
    var n = item + sens;
    if (n >= EXOS[exo].items.length) aller((exo + 1) % EXOS.length, 0);
    else if (n < 0) { var e = (exo - 1 + EXOS.length) % EXOS.length; aller(e, EXOS[e].items.length - 1); }
    else aller(exo, n);
  }
  el("prec").addEventListener("click", function () { pas(-1); });
  el("suiv").addEventListener("click", function () { pas(1); });
  el("btnCorr").addEventListener("click", function () { document.body.classList.toggle("correction"); });
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "ArrowRight") pas(1); else if (ev.key === "ArrowLeft") pas(-1);
    else if (ev.key === " ") { ev.preventDefault(); document.body.classList.toggle("correction"); }
  });
  // Class Flow ouvre un exercice précis : …html#2
  var h = parseInt(location.hash.slice(1), 10);
  aller(h >= 1 && h <= EXOS.length ? h - 1 : 0, 0);
  window.__colonnes = { EXOS: EXOS, aller: aller };
})();
</script>
<!-- MENU -->
<script>
/* ==== LE MENU ☰ (GTH, 10/10) : interface épurée — à l'écran, seulement le titre, le score, la consigne et l'activité ====
   Tout le reste (niveaux, onglets de méthode, ✏️, 🔊, 🖨️, aide…) part dans un menu ☰, ouvert d'un toucher.
   Réglage par outil (CONF, posé par l'injecteur) : ancre = où mettre le bouton ☰ (sinon en haut à droite de l'écran) ;
   cacher = ce qui part dans le menu (sinon : tout ce qui, dans « .barre .droite », n'est pas un score).
   Installé par .claude/outils/menu-outil/injecter.py ; ne pas modifier dans l'outil, mais dans ce fichier. */
(function () {
  var CONF = {"ancre": ".barre", "cacher": ["#onglets"]};
  var st = document.createElement("style");
  st.textContent =
    ".menu-btn{width:58px; height:58px; border-radius:16px; border:2px solid rgba(0,0,0,.15); background:#fff; color:#1f2a33; font-size:2rem; line-height:1; cursor:pointer; flex:none; padding:0;}" +
    ".menu-btn.fixe{position:fixed; top:10px; right:12px; z-index:150; box-shadow:0 4px 14px rgba(0,0,0,.15);}" +
    ".menu-btn.ouvert{background:#1f2a33; color:#fff;}" +
    ".menu-panneau{position:fixed; top:76px; right:16px; z-index:200; background:#fff; color:#1f2a33; border-radius:18px; box-shadow:0 18px 50px rgba(0,0,0,.28); padding:16px 18px;" +
    "  display:flex; flex-direction:column; align-items:flex-start; gap:12px; max-width:min(620px, 92vw); max-height:80vh; overflow:auto;}" +
    ".menu-panneau[hidden]{display:none !important;}" +
    ".menu-panneau h4{margin:0; font-family:sans-serif; font-size:.85rem; text-transform:uppercase; letter-spacing:.6px; color:#6d7a85;}" +
    ".menu-panneau > *{position:static !important; margin:0 !important;}" +
    ".menu-panneau > div,.menu-panneau > nav{display:flex; flex-wrap:wrap; gap:8px;}";
  document.head.appendChild(st);
  function installer() {
    var autres = [];
    if (CONF.cacher) CONF.cacher.forEach(function (s) { document.querySelectorAll(s).forEach(function (e) { if (autres.indexOf(e) === -1) autres.push(e); }); });
    else { var d = document.querySelector(".barre .droite"); if (d) autres = Array.prototype.filter.call(d.children, function (e) { return !e.classList.contains("score"); }); }
    if (!autres.length) return;
    var btn = document.createElement("button"); btn.type = "button"; btn.className = "menu-btn"; btn.title = "Niveaux et réglages"; btn.textContent = "☰";
    var pan = document.createElement("div"); pan.className = "menu-panneau"; pan.hidden = true;
    var t = document.createElement("h4"); t.textContent = "Niveaux et réglages"; pan.appendChild(t);
    autres.forEach(function (e) { pan.appendChild(e); });
    var ancre = document.querySelector(CONF.ancre || ".barre .droite");
    if (ancre) ancre.appendChild(btn); else { btn.classList.add("fixe"); document.body.appendChild(btn); }
    document.body.appendChild(pan);
    function ouvrir(o) { pan.hidden = !o; btn.classList.toggle("ouvert", o); }
    btn.addEventListener("click", function (e) { e.stopPropagation(); ouvrir(pan.hidden); });
    // un niveau choisi, ou une fenêtre ouverte (✏️, 🖨️) : le menu se referme ; on garde le menu ouvert pour choisir un type de jeu
    pan.addEventListener("click", function (e) { var b = e.target.closest("button"); if (b && !b.closest(CONF.garderOuvert || ".types")) setTimeout(function () { ouvrir(false); }, 120); });
    document.addEventListener("pointerdown", function (e) { if (!pan.hidden && !pan.contains(e.target) && e.target !== btn) ouvrir(false); });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", installer); else installer();
})();
</script>
<!-- /MENU -->
</body>
</html>
