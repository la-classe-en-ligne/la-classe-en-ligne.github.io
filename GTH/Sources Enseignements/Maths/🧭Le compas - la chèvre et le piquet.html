<!--
  🧭 Le compas : la chèvre et le piquet — le cercle et le triangle au compas, P2 📅 2, 3 et 6 (GTH v2 : donnees/seances/maths/ma-s2-geometrie.js,
  ma-s3-geometrie.js, ma-s6-geometrie.js). Maquette validée par Karim le 28/10 (Rapports/Jeux de la P2 — ce qui existe, ce qui manque.md, C n° 2).
  Univers : un pré vu de dessus. La chèvre est attachée au piquet : le piquet = la pointe du compas (le centre), la corde tendue = l'écartement
  (le rayon) ; en tournant, la chèvre broute un cercle : tous ses points sont à la même distance du piquet.
  Gestes, comme avec un vrai compas : RÉGLER (piquet sur le 0 de la règle, glisser la chèvre jusqu'au nombre, ou toucher la règle),
  PIQUER (glisser le piquet sur le centre, ou toucher le piquet puis le point), TOURNER (faire tourner la chèvre au doigt : le cercle se trace
  sous le doigt ; seul geste sans « toucher », c'est le geste à apprendre). Le jeu ne trace jamais à la place de l'élève : une corde mal réglée
  ou un piquet à côté du centre donnent un cercle faux, effacé avec la raison.
  Onglets : Le rayon (#rayon), Le diamètre (#diametre), Passant par (#passant : pointe sur le centre, corde jusqu'au point), Le triangle
  (#triangle : la base est tracée ; deux arcs, puis poser le sommet), Défi (#defi : reproduire une figure, plusieurs cercles).
  Contenu : séances 📅 2, 3, 6 (mémo GEOM 4 p. 54 ; guide P2 S2 séance 3 p. 13 et S5 séance 3 p. 36 ; manuel P2 p. 53 ex. 2-3 et p. 67 ex. 3 b) ;
  les autres mesures et figures sont de moi, sur le même modèle (marquées « de moi » ci-dessous). 1 cm = 50 px. Hors ligne (ENI, Chromebook). Sans son.
-->
<style>
:root{--herbe:#cfe8a9;--herbe2:#b9db8a;--brout:#f1e6b8;--terre:#6d4c41;--encre:#263b14;--vert:#2e7d32;--rouge:#c62828;--talbot:#1f7a8c}
html,body{margin:0;height:100%;background:#263b14;overflow:hidden;font-family:Arial,Helvetica,sans-serif;color:var(--encre)}
#scene{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:var(--herbe)}
#decor{position:absolute;left:0;top:0;width:1920px;height:1080px;z-index:-1;pointer-events:none}

#barre{height:84px;display:flex;align-items:center;gap:20px;padding:0 28px;background:#558b2f;color:#fff}
#barre h1{margin:0;font-size:34px;display:flex;align-items:center;gap:12px;white-space:nowrap}
#barre h1 svg{width:56px;height:56px}
.onglets{display:flex;gap:8px;margin-left:16px}
.onglets button{font:inherit;font-size:23px;padding:10px 18px;border-radius:10px;border:2px solid #8bc34a;background:#689f38;color:#fff;cursor:pointer}
.onglets button.on{background:#fff;color:var(--encre);font-weight:700;border-color:#fff}
#coin{margin-left:auto;font-size:22px;white-space:nowrap}
#coin b{font-size:28px;color:#fff59d}
#consigne{height:100px;display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:700;text-align:center;background:#e7f3d4}
#consigne .q{color:#b23a00}
svg#pre{position:absolute;left:0;top:184px;width:1920px;height:786px;touch-action:none}
#bas{position:absolute;left:0;right:0;bottom:0;height:110px;display:flex;align-items:center;justify-content:center}
#verdict{font-size:38px;font-weight:700;text-align:center}
#verdict.ok{color:var(--vert)} #verdict.ko{color:var(--rouge)}
#indice{position:absolute;right:26px;top:96px;width:82px;height:82px;padding:0;border-radius:50%;font-size:44px;line-height:1;z-index:20;border:2px solid #d4b106;background:#fff8c4;cursor:pointer}
#bulle{position:absolute;right:124px;top:100px;max-width:660px;background:#fff8c4;border:2px solid #d4b106;border-radius:18px;padding:16px 26px;font-size:28px;display:none;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:20}
.choisi{filter:drop-shadow(0 0 7px #1f7a8c) drop-shadow(0 0 3px #1f7a8c)}
#piquet,#chevre,#drapeau{cursor:grab}
.point text{font-size:34px;font-weight:700;fill:#263b14}
#modele{font-size:26px}
</style>

  consigne(T && T.par ? "Plante le piquet sur <span class=\"q\">" + nomCentre(T) + "</span>" : T && T.d ? "Le diamètre fait <span class=\"q\">" + virgule(T.d) + " cm</span> : règle la corde" : T ? "Règle la corde sur <span class=\"q\">" + virgule(T.r) + " cm</span>" : ""); }
// l'arc du triangle : bonne corde, bon piquet, et il passe là où sera le sommet
function finArc() {
  const E = ex(), S = sommets(), de = etat.tri ? S.K : S.J, l = etat.tri ? E.d : E.g, n = E.noms;
  const nonArc = m => { verdict(m, "ko"); effaceTrait(); etat.p = null; etat.ang = 0; etat.acc = 0; etat.phase = "regler"; placeCompas(); consigne("Piquet en <span class=\"q\">" + n[etat.tri] + "</span>, corde de <span class=\"q\">" + virgule(l) + " cm</span> : fais un arc"); };
  if (dist(etat.p, de) > 2) return nonArc("🤪 Le piquet doit être en " + n[etat.tri] + ".");
  if (Math.abs(etat.r - l) > .02) return nonArc("🤪 La corde n'est pas réglée sur " + virgule(l) + " cm.");
  let cible = Math.atan2(S.I[1] - de[1], S.I[0] - de[0]) - etat.a0;   // l'angle du sommet, ramené près du départ
  while (cible > Math.PI) cible -= 2 * Math.PI; while (cible < -Math.PI) cible += 2 * Math.PI;
  const dans = c => c > etat.amin + .08 && c < etat.amax - .08;
  if (!(dans(cible) || dans(cible + 2 * Math.PI) || dans(cible - 2 * Math.PI))) return nonArc("🤪 Fais l'arc là où sera le sommet, au-dessus de la base.");
  etat.ligne = etat.herbe = null; etat.chemin = []; verdict("");
  etat.tri++; triEtape();
}
function poseSommet(q) {
  const S = sommets(), E = ex(), d = $("drapeau");
  if (dist(q, S.I) > 24) { verdict("🤪 " + E.noms[2] + " est là où les deux arcs se croisent.", "ko"); d.removeAttribute("transform"); return; }
  d.remove(); verdict("✅ Le triangle est juste : " + E.noms[0] + E.noms[2] + " = " + virgule(E.g) + " cm et " + E.noms[1] + E.noms[2] + " = " + virgule(E.d) + " cm.", "ok");
  [S.J, S.K].forEach(p => el("line", { x1: p[0], y1: p[1], x2: S.I[0], y2: S.I[1], stroke: "#263b14", "stroke-width": 5 }, $("figure")));
  const g = el("g", { class: "point" }, $("figure")); el("text", { x: S.I[0] - 10, y: S.I[1] - 22 }, g).textContent = E.noms[2];
  consigne("Bravo !"); marque(); etat.phase = "fini"; plusTard(() => { etat.i++; nouvelExercice(); }, 2400);
}
// l'indice donne la méthode de la classe, jamais la réponse
$("indice").onclick = () => {
  const T = tache();
  if (etat.o === "triangle") bulle(etat.phase === "sommet" ? "Le sommet est à la bonne distance des deux bouts de la base : il est sur les deux arcs à la fois." : "Pointe du compas sur le 0 de la règle, mine sur la longueur du côté ; puis pointe sur le bout de la base, et un arc au-dessus.");
  else if (T && T.par) bulle("Pointe sur le centre, mine sur le point : la corde va du piquet jusqu'au point, sans mesurer.");
  else if (T && T.m) bulle("Le centre d'un cercle de diamètre [" + T.m.join("") + "], c'est le milieu de [" + T.m.join("") + "].");
  else if (T && T.d) bulle("Le diamètre traverse tout le cercle en passant par le centre : le rayon, c'est la moitié du diamètre.");
  else bulle("Pointe du compas sur le 0 de la règle, mine sur le rayon : ici, le piquet sur le 0 et la chèvre sur le nombre. Puis je pique sur le centre et je tourne sans changer l'écartement.");
};
// ---------- démarrer ----------
function ouvre(o) {
  etat.o = o; etat.i = 0; etat.score = 0; choisir(null);
  document.querySelectorAll(".onglets button").forEach(b => b.classList.toggle("on", b.dataset.o === o));
  history.replaceState(null, "", "#" + o);
  afficheScore(); $("bulle").style.display = "none"; nouvelExercice();
}
document.querySelectorAll(".onglets button").forEach(b => b.onclick = () => ouvre(b.dataset.o));
function ajuste() {
  const e = Math.min(innerWidth / 1920, innerHeight / 1080), s = $("scene");
  s.style.transform = "scale(" + e + ")"; s.style.left = ((innerWidth - 1920 * e) / 2) + "px"; s.style.top = ((innerHeight - 1080 * e) / 2) + "px"; s.dataset.ech = e;
}
addEventListener("resize", ajuste); ajuste();
function depuisLien() { const m = location.hash.slice(1); ouvre(LISTES[m] ? m : "rayon"); }
addEventListener("hashchange", depuisLien);
depuisLien();
window.COMPAS_API = { LISTES, ex, tache, centreDe, rayonDe, sommets, px, REGLE, K };
</script>
