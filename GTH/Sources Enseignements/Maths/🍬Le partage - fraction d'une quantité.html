<!--
  🍬 Le partage : le butin des pirates — la fraction d'une quantité, P2 📅 6 mardi (GTH v2 : donnees/seances/maths/ma-s6-nombres.js).
  Maquette validée par Karim le 28/10 (Rapports/Jeux de la P2 — ce qui existe, ce qui manque.md, C n° 5). Méthode de la séance et du mémo NUM 11 :
  le dénominateur dit en combien de parts égales on partage ; on trouve une part (en distribuant, ou avec la table : 12 = 3 × 4) ;
  (CM2) le numérateur dit combien de parts on prend ; on le dit en une phrase (recommandations Eduscol fractions 2025, p. 9).
  Univers : le pont d'un bateau pirate. Le capitaine partage le butin de la cale dans des sacs tous pareils ; pour « deux tiers », il prend 2 sacs.
  Gestes (glisser, ou toucher puis toucher) : poser des sacs sur le pont (toucher la pile en pose un ; toucher un sac vide le reprend) ;
  Je distribue : glisser les objets dans les sacs (ou toucher un sac : un objet de la cale y tombe ; toucher un objet d'un sac le remet dans la cale) ;
  la table : poser l'étiquette d'une part sur un sac (les sacs se remplissent tous pareils) ; plusieurs parts : glisser des sacs dans le coffre du
  capitaine ; puis l'étiquette du total. Le jeu ne donne jamais le nombre : il vérifie que les parts sont égales et que tout le butin est partagé.
  Onglets : Je distribue (#distribue), La table (#table), Plusieurs parts (#parts), Défi (#defi : on connaît une part, on cherche le butin).
  Contenu : fichier ressources P2 p. 22-25 (les enveloppes CM1 et CM2), mémo NUM 11, séance 📅 6, recommandations Eduscol ; les autres
  sont de moi (marqués « de moi »). Hors ligne (ENI, Chromebook). Sans son.
-->

    [2, 3, 12, "12 pommes", "pommes", "", "fichier ressources P2 p. 24 (enveloppe 1, CM2)"], [3, 10, 500, "500 g de sucre", "g", "", "fichier ressources P2 p. 24 (enveloppe 2, CM2) ; mémo NUM 11"],
    [4, 5, 60, "60 kg de café", "kg", "", "fichier ressources P2 p. 25 (enveloppe 3, CM2)"], [3, 4, 10, "10 m de corde", "m", "", "fichier ressources P2 p. 25 (enveloppe 4, CM2)"],
    [3, 4, 20, "20 billes", "billes", "", "séance 📅 6 (Je vérifie, CM2)"], [2, 5, 60, "60 kg de sable", "kg", "", "Eduscol fractions 2025, p. 11-12"],
    [2, 3, 30, "30 €", "€", "", "de moi"], [5, 6, 36, "36 perles", "perles", "", "de moi"], [3, 8, 40, "40 pièces d'or", "pièces", "", "de moi"], [3, 5, 25, "25 bonbons", "bonbons", "", "de moi"]
  ],
  // Défi : on connaît une part, on cherche tout le butin
  defi: [
    [1, 4, 88, "le nombre de Théa", "", "", "exercices différenciés P2 CM2 p. 11 (« Le quart du nombre choisi par Théa est 22 »)"],
    [1, 3, 24, "le trésor", "pièces", "", "de moi"], [1, 5, 35, "les perles du coffre", "perles", "", "de moi"], [1, 2, 18, "les rubis", "rubis", "", "de moi"],
    [1, 6, 42, "la réserve d'eau", "L", "", "de moi"], [1, 10, 200, "la farine", "g", "", "de moi"], [1, 4, 36, "les billes", "billes", "", "de moi"],
    [1, 8, 80, "le voyage", "km", "", "de moi"], [1, 3, 27, "les pommes", "pommes", "", "de moi"], [1, 5, 50, "la corde", "m", "", "de moi"]
  ]
};
const DEN = { 2: ["demi", "demis"], 3: ["tiers", "tiers"], 4: ["quart", "quarts"], 5: ["cinquième", "cinquièmes"], 6: ["sixième", "sixièmes"], 7: ["septième", "septièmes"], 8: ["huitième", "huitièmes"], 9: ["neuvième", "neuvièmes"], 10: ["dixième", "dixièmes"] };
const NUMW = ["", "un", "deux", "trois", "quatre", "cinq", "six"];
const nomFraction = (a, b, maj) => { const t = (a === 1 && b === 2 ? "la moitié" : (a === 1 ? (b === 3 ? "un " : "un ") : NUMW[a] + " ") + DEN[b][a > 1 ? 1 : 0]); return maj ? t.charAt(0).toUpperCase() + t.slice(1) : t; };
const nb = x => String(x).replace(".", ",");
const SAC = '<svg viewBox="0 0 150 180"><path d="M28 60h94l18 110H10z" fill="#c8a165" stroke="#6d4c41" stroke-width="5"/><path d="M45 60c0-40 60-40 60 0" stroke="#6d4c41" stroke-width="7" fill="none"/><path d="M28 60h94" stroke="#6d4c41" stroke-width="9"/></svg>';

const etat = { o: "distribue", i: 0, score: 0, sacs: [], cale: 0, coffre: [], part: null, phase: "", fini: false };
window.PARTAGE = etat;
const $ = id => document.getElementById(id);
const mem = { lire(k) { try { return +localStorage.getItem(k) || 0; } catch (e) { return 0; } }, ecrire(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const cleRecord = () => "partage-record-" + etat.o;
function afficheScore() { $("score").textContent = etat.score; $("record").textContent = mem.lire(cleRecord()); }
function marque() { etat.score++; if (etat.score > mem.lire(cleRecord())) mem.ecrire(cleRecord(), etat.score); afficheScore(); }
function verdict(t, cls) { const v = $("verdict"); v.textContent = t; v.className = cls || ""; }
function consigne(h) { $("consigne").innerHTML = "<span>" + h + "</span>"; }
function bulle(t) { const b = $("bulle"); b.textContent = t; b.style.display = "block"; clearTimeout(bulle.t); bulle.t = setTimeout(() => b.style.display = "none", 8000); }
let minuteur = 0; const plusTard = (f, ms) => { clearTimeout(minuteur); minuteur = setTimeout(f, ms || 2400); };
const ex = () => L[etat.o][etat.i % L[etat.o].length];
const unePart = () => { const [, b, q] = ex(); return Math.round(q / b * 100) / 100; };

// ---------- un butin ----------
function nouvel() {
  clearTimeout(minuteur); verdict(""); etat.fini = false; etat.sacs = []; etat.coffre = []; etat.part = null; etat.phase = "sacs";
  if (etat.o !== "distribue") etat.phase = "part";   // les sacs et les étiquettes ensemble ; le nombre de sacs est vérifié quand on pose l'étiquette
  const [a, b, q, quoi, u, obj] = ex();
  etat.cale = etat.o === "distribue" ? q : 0;
  $("carte").innerHTML = etat.o === "defi" ? nomFraction(a, b, true) + " de " + quoi + ", c'est " + nb(unePart()) + (u ? " " + u : "") + ".<small>Combien en tout ?</small>"
    : nomFraction(a, b, true) + " de " + quoi + "<small>" + a + "/" + b + " de " + quoi + "</small>";
  $("coffre").style.display = etat.o === "parts" ? "flex" : "none";
  $("couvercle").style.display = $("joyaux").style.display = etat.o === "parts" ? "block" : "none";
  consigne(etat.o === "distribue" ? nomFraction(a, b, true) + " : pose autant de <span class=\"q\">sacs</span> que de parts égales"
    : etat.o === "defi" ? "Pose les <span class=\"q\">sacs</span>, puis l'étiquette de tout le butin dans la cale" : "Pose les <span class=\"q\">sacs</span>, puis l'étiquette d'un sac");
  dessiner();
}
function tuiles(bonne) {   // l'étiquette juste et des erreurs fréquentes (le dénominateur pris pour la part, la quantité moins ou plus…)
  const [, b, q] = ex(), c = [bonne, bonne * 2, bonne + b, Math.abs(q - b), q, bonne + 1].map(x => Math.round(x * 100) / 100).filter((x, k, T) => x > 0 && T.indexOf(x) === k);
  const t = [c[0]].concat(c.slice(1).sort(() => Math.random() - .5).slice(0, 3));
  return t.sort((x, y) => x - y);
}
const pileOuverte = () => etat.phase === "sacs" || (etat.o === "distribue" && etat.phase === "distribuer") || (etat.o !== "distribue" && etat.phase === "part" && etat.part == null);
function dessiner() {
  const [a, b, q, quoi, u, obj] = ex();
  // la cale
  if (etat.o === "distribue") $("cale").innerHTML = "<h3>La cale</h3>" + Array.from({ length: etat.cale }, (_, k) => '<div class="objet" data-k="obj">' + obj + '</div>').join("");
  else $("cale").innerHTML = "<h3>La cale</h3><div class=\"gros\">" + (etat.o === "defi" ? (etat.fini ? nb(q) + (u ? " " + u : "") : "?") : (etat.part != null ? "" : quoi)) + "</div>";
  // les sacs du pont et du coffre
  const sacHtml = (s, k, ou) => '<div class="sac" data-s="' + k + '" data-ou="' + ou + '">' + SAC + (s.lab != null ? '<div class="etiquette">' + nb(s.lab) + (u ? " " + u : "") + '</div>' : '<div class="dedans">' + Array.from({ length: s.n }, () => '<span class="objet" data-de="' + k + '">' + obj + '</span>').join("") + '</div>') + '</div>';
  $("pont").innerHTML = etat.sacs.map((s, k) => etat.coffre.includes(k) ? "" : sacHtml(s, k, "pont")).join("");
  $("coffre").innerHTML = "<h3>Le coffre du capitaine</h3>" + etat.coffre.map(k => sacHtml(etat.sacs[k], k, "coffre")).join("");
  // le plateau : la pile de sacs, puis les étiquettes
  let p = "";
  if (pileOuverte()) p += '<div class="outil pile" data-k="sac">' + SAC.replace('viewBox="0 0 150 180"', 'viewBox="0 0 150 180" width="70" height="80"') + '<span style="font-size:24px">Un sac</span></div>';
  if (etat.phase === "part" && etat.o !== "distribue" && etat.part == null) p += tuiles(etat.o === "defi" ? q : unePart()).map(v => '<div class="outil" data-k="part:' + v + '">' + nb(v) + '</div>').join("");
  if (etat.phase === "compte") p += tuiles(unePart()).map(v => '<div class="outil" data-k="part:' + v + '">' + nb(v) + '</div>').join("");
  if (etat.phase === "total") p += tuiles(a * unePart()).map(v => '<div class="outil" data-k="total:' + v + '">' + nb(v) + '</div>').join("");
  $("plateau").innerHTML = etat.fini ? "" : p;   // le butin partagé : plus d'étiquettes
}
// ---------- les gestes ----------
let tient = null, choix = null;
const source = el => el && el.closest && el.closest(".outil, .objet, .sac");   // .objet avant .sac : un objet dans un sac se prend seul
function choisir(e) { if (choix) choix.classList.remove("choisi"); choix = e; if (e) e.classList.add("choisi"); }
document.addEventListener("pointerdown", ev => { const s = source(ev.target); if (!s || etat.fini) return; ev.preventDefault(); tient = { el: s, x: ev.clientX, y: ev.clientY, vole: null, sous: ev.target }; });
document.addEventListener("pointermove", ev => {
  if (!tient) return;
  if (!tient.vole && Math.hypot(ev.clientX - tient.x, ev.clientY - tient.y) > 12) {
    const r = tient.el.getBoundingClientRect(), v = tient.el.cloneNode(true); v.classList.add("vole"); v.classList.remove("choisi");
    v.style.width = tient.el.offsetWidth + "px"; v.style.height = tient.el.offsetHeight + "px"; v.style.transform = "scale(" + (r.width / tient.el.offsetWidth) + ")"; document.body.appendChild(v); tient.vole = v; tient.dx = ev.clientX - r.left; tient.dy = ev.clientY - r.top; choisir(null);
  }
  if (tient.vole) { tient.vole.style.left = (ev.clientX - tient.dx) + "px"; tient.vole.style.top = (ev.clientY - tient.dy) + "px"; }
});
document.addEventListener("pointerup", ev => {
  const t = tient; tient = null;
  if (t && t.vole) { t.vole.remove(); return deposer(t.el, document.elementFromPoint(ev.clientX, ev.clientY)); }
  if (t) return toucher(t.el, t.sous);
  if (choix) { const c = choix; choisir(null); deposer(c, ev.target); }
});
// un toucher : sur la pile, un sac de plus ; sur un sac du pont (rien de choisi) : distribuer un objet, ou reprendre un sac vide, ou le mettre au coffre
function toucher(el, sous) {
  if (choix && choix !== el) { const c = choix; choisir(null); return deposer(c, el); }
  // un objet dans un sac : tant que la cale n'est pas vide, le toucher vaut un toucher sur le sac (on distribue) ; ensuite on le choisit pour le déplacer
  if (el.classList.contains("objet") && el.dataset.de != null && etat.cale > 0) el = el.closest(".sac");
  if (el.dataset.k === "sac" && pileOuverte()) return ajouteSac();
  if (el.classList.contains("sac") && !choix) {
    const k = +el.dataset.s, s = etat.sacs[k];
    if (etat.o !== "distribue" && etat.phase === "part" && etat.part == null) return enleveSac(k);
    if (etat.o === "distribue" && (etat.phase === "sacs" || etat.phase === "distribuer")) {
      return distribuer(k);
    }
    if (etat.o === "parts" && etat.phase === "prendre") return auCoffre(k, el.dataset.ou);
  }
  choisir(choix === el ? null : el);
}
function deposer(src, cible) {
  if (!cible || etat.fini) return;
  const k = src.dataset.k || "", sac = cible.closest && cible.closest(".sac");
  if (k === "sac") { if (cible.closest("#pont") && pileOuverte()) ajouteSac(); return; }
  if (src.classList.contains("objet") && src.dataset.de != null) {   // un objet repris d'un sac : vers la cale ou vers un autre sac
    const de = +src.dataset.de; if (!etat.sacs[de] || etat.sacs[de].n === 0) return;
    if (cible.closest("#cale")) { etat.sacs[de].n--; etat.cale++; etat.phase = "distribuer"; verdict(""); dessiner(); return; }
    if (sac && +sac.dataset.s !== de) { etat.sacs[de].n--; etat.sacs[+sac.dataset.s].n++; verdict(""); dessiner(); return verifFin(); }
    return;
  }
  if (src.classList.contains("objet")) { if (sac) distribuer(+sac.dataset.s); return; }
  if (src.classList.contains("sac") && etat.o === "parts" && etat.phase === "prendre") { if (cible.closest("#coffre") || cible.closest("#pont")) auCoffre(+src.dataset.s, cible.closest("#coffre") ? "pont" : "coffre"); return; }
  // un sac glissé sur la pile (en bas) est repris, s'il est vide
  if (src.classList.contains("sac") && pileOuverte() && cible.closest("#plateau") && etat.sacs[+src.dataset.s].n === 0) return enleveSac(+src.dataset.s);
  if (k.startsWith("part:")) { if (sac || cible.closest("#pont") || cible.closest("#cale")) poserPart(+k.slice(5), src); return; }
  if (k.startsWith("total:")) { if (cible.closest("#coffre") || cible.closest("#cale") || sac) poserTotal(+k.slice(6), src); return; }
}
// ---------- les actions ----------
function ajouteSac() { if (etat.sacs.length >= 10) return verdict("🤪 Pas plus de 10 sacs sur le pont.", "ko"); etat.sacs.push({ n: 0, lab: etat.o === "defi" ? unePart() : null }); verdict(""); afterSacs(); }
function enleveSac(k) { etat.sacs.splice(k, 1); verdict(""); afterSacs(); }
function afterSacs() {
  const [a, b] = ex();
  if (etat.o === "distribue") consigne(etat.sacs.length ? "Partage le butin : toutes les parts <span class=\"q\">pareilles</span>" : nomFraction(a, b, true) + " : pose autant de <span class=\"q\">sacs</span> que de parts égales");
  dessiner();
}
function verifSacs() {   // le nombre de sacs = le dénominateur
  const [a, b] = ex();
  if (etat.sacs.length !== b) { verdict("🤪 " + nomFraction(1, b, true) + " : il faut " + b + " parts égales, donc " + b + " sacs.", "ko"); return false; }
  return true;
}
function distribuer(k) {
  if (etat.cale === 0) return;
  if (!verifSacs()) return;
  etat.phase = "distribuer"; etat.sacs[k].n++; etat.cale--; verdict(""); dessiner(); verifFin();
}
function verifFin() {
  if (etat.cale === 0 && etat.o === "distribue" && etat.phase !== "compte") {
    const n0 = etat.sacs[0].n;
    if (etat.sacs.some(s => s.n !== n0)) return verdict("🤪 Les parts ne sont pas pareilles : glisse un objet d'un sac vers un autre.", "ko");
    etat.phase = "compte"; consigne("Combien dans <span class=\"q\">un sac</span> ? Pose l'étiquette"); dessiner();
  }
}
function poserPart(v, el) {
  const [a, b, q, quoi, u] = ex();
  if (etat.o === "defi") return poserTotal(v, el);
  if (!verifSacs()) return;
  const bonne = unePart();
  if (Math.abs(v - bonne) > 1e-9) { el.classList.add("ko"); setTimeout(() => el.classList.remove("ko"), 900); return verdict("🤪 " + b + " sacs de " + nb(v) + ", ça ne fait pas " + nb(q) + " : cherche dans la table de " + b + ".", "ko"); }
  etat.part = bonne; etat.sacs.forEach(s => { s.lab = bonne; s.n = 0; }); verdict("");
  if (etat.o === "parts") { etat.phase = "prendre"; consigne(nomFraction(a, b, true) + " : mets <span class=\"q\">" + a + " sacs</span> dans le coffre"); dessiner(); return; }
  return fini(nomFraction(a, b, true) + " de " + quoi + ", c'est " + nb(bonne) + " " + u + " : je partage en " + b + " parts égales ; " + nb(q) + " = " + b + " × " + nb(bonne) + ".");
}
function auCoffre(k, ou) {
  const [a] = ex();
  if (ou === "coffre") etat.coffre = etat.coffre.filter(x => x !== k); else if (!etat.coffre.includes(k)) etat.coffre.push(k);
  verdict(""); dessiner();
  if (etat.coffre.length === a) { etat.phase = "total"; consigne("Combien dans le <span class=\"q\">coffre</span> ? Pose l'étiquette"); dessiner(); }
  else if (etat.coffre.length > a) verdict("🤪 Le numérateur dit combien de parts on prend : " + a + " sacs.", "ko");
}
function poserTotal(v, el) {
  const [a, b, q, quoi, u] = ex(), bon = etat.o === "defi" ? q : Math.round(a * unePart() * 100) / 100;
  if (etat.o === "defi" && !verifSacs()) return;
  if (Math.abs(v - bon) > 1e-9) { el.classList.add("ko"); setTimeout(() => el.classList.remove("ko"), 900); return verdict(etat.o === "defi" ? "🤪 " + b + " parts de " + nb(unePart()) + " : combien en tout ?" : "🤪 " + a + " sacs de " + nb(unePart()) + " : combien en tout ?", "ko"); }
  if (etat.o === "defi") return fini(nomFraction(1, b, true) + " de " + quoi + ", c'est " + nb(unePart()) + (u ? " " + u : "") + " : tout, c'est " + b + " parts ; " + b + " × " + nb(unePart()) + " = " + nb(q) + ".");
  return fini(nomFraction(a, b, true) + " de " + quoi + ", c'est " + nb(bon) + " " + u + " : une part = " + nb(unePart()) + " ; " + a + " × " + nb(unePart()) + " = " + nb(bon) + ".");
}
function compter(v, el) {   // Je distribue : combien dans un sac ?
  const [a, b, q, quoi, u] = ex(), bonne = unePart();
  if (v !== bonne) { el.classList.add("ko"); setTimeout(() => el.classList.remove("ko"), 900); return verdict("🤪 Compte les objets d'un sac.", "ko"); }
  fini(nomFraction(a, b, true) + " de " + quoi + ", c'est " + bonne + " " + u + " : je partage en " + b + " parts égales ; " + q + " = " + b + " × " + bonne + ".");
}
function fini(phrase) { etat.fini = true; marque(); verdict("✅ " + phrase, "ok"); consigne("Le butin est partagé !"); dessiner(); plusTard(() => { etat.i++; nouvel(); }, 3200); }
// Je distribue : l'étiquette « combien dans un sac » passe par poserPart sauf pour ce niveau
const poserPart0 = poserPart; poserPart = function (v, el) { if (etat.o === "distribue") return compter(v, el); return poserPart0(v, el); };
// l'indice donne la méthode de la classe, jamais le nombre
$("indice").onclick = () => {
  const [a, b] = ex();
  if (etat.phase === "sacs") bulle("Le dénominateur dit en combien de parts égales je partage : " + nomFraction(1, b) + ", c'est " + b + " parts.");
  else if (etat.o === "distribue") bulle("Je donne un objet à chaque sac, chacun son tour, jusqu'à ce que la cale soit vide. Puis je compte un sac.");
  else if (etat.o === "defi") bulle("Une part, c'est " + nomFraction(1, b) + " : tout le butin, c'est " + b + " parts pareilles. Je multiplie.");
  else if (etat.phase === "part") bulle("Je cherche dans la table de " + b + " : " + b + " fois combien font la quantité ?");
  else bulle("Le numérateur dit combien de parts je prends : " + a + " parts, c'est " + a + " fois une part.");
};
// ---------- démarrer ----------
function ouvre(o) {
  etat.o = o; etat.i = 0; etat.score = 0; choisir(null);
  document.querySelectorAll(".onglets button").forEach(b => b.classList.toggle("on", b.dataset.o === o));
  history.replaceState(null, "", "#" + o);
  afficheScore(); $("bulle").style.display = "none"; nouvel();
}
document.querySelectorAll(".onglets button").forEach(b => b.onclick = () => ouvre(b.dataset.o));
function ajuste() {
  const e = Math.min(innerWidth / 1920, innerHeight / 1080), s = $("scene");
  s.style.transform = "scale(" + e + ")"; s.style.left = ((innerWidth - 1920 * e) / 2) + "px"; s.style.top = ((innerHeight - 1080 * e) / 2) + "px"; s.dataset.ech = e;
}
addEventListener("resize", ajuste); ajuste();
function depuisLien() { const m = location.hash.slice(1); ouvre(L[m] ? m : "distribue"); }
addEventListener("hashchange", depuisLien);
depuisLien();
window.PARTAGE_API = { L, ex, unePart };
</script>
