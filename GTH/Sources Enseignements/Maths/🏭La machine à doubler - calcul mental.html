<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La machine à doubler</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='20' width='52' height='38' rx='8' fill='%231f6fb2'/%3E%3Cpath d='M20 4h24l-6 16H26z' fill='%2366737f'/%3E%3Crect x='14' y='30' width='36' height='16' rx='4' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Quicksand:wght@600;700&display=swap">
<style>
  /* Univers (Karim, 12/10, à la place du papillon) : une usine. Le nombre arrive sur le tapis roulant ; on le COUPE au doigt
     en morceaux (centaines | dizaines | unités : 145 → 100 | 40 | 5) ; chaque morceau entre dans la machine, qui en sort deux
     pareils (40 + 40) : l'élève donne le double ; les doubles s'empilent à la sortie, puis on assemble le double du nombre.
     Le calcul se construit en bas : Le double de 145 = 200 + 80 + 10 = 290. Méthode du guide de la banque (P1, S4 séance 4 :
     « le double de 235 = le double de 200 + le double de 35 »). Onglet La tour : 3 → 6 → 12 → 24…, un étage par double.
     Nombres : leçon MENTAL 2 et exercices de la banque (manuel P1 S4 séances 1, 3, 4 ; bilan P1 ; devoirs fiche 16), rien d'inventé.
     Réponse au toucher OU glissée dans la case (une seule case : un toucher suffit).
     ✏️ Mon nombre (Karim, 12/10) : le maître tape le nombre qu'il veut sur un pavé (1 à 99 999 ; dans La tour, le départ, 1 à 500). */
  :root{ --encre:#1f2a33; --gris:#66737f; --bord:#dfe5ea; --bleu:#1f6fb2; --bleu-fonce:#164f80; --bleu-clair:#d8e8f6;
    --bien:#1a8f5c; --faux:#d6455d; --talbot:#1f7a8c; --jaune:#f4b400; }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0; color:var(--encre); font-family:"Quicksand",system-ui,sans-serif; overflow:hidden; height:100vh; display:flex; flex-direction:column;
    background:#f3f5f7; user-select:none; -webkit-user-select:none; touch-action:none;}
  [hidden]{display:none !important;}
  .barre{display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:20px; padding:8px 26px; background:#fff; border-bottom:3px solid var(--bord);}
  .titre{display:flex; align-items:center; gap:12px;} .titre svg{width:54px; height:54px;}
  .titre h1{font-family:"Baloo 2",cursive; font-weight:800; font-size:1.9rem; margin:0;}
  .onglets{display:flex; gap:6px; justify-content:center;}
  .onglets button{font:inherit; font-weight:700; font-size:1.1rem; padding:6px 18px; border-radius:999px; cursor:pointer; background:#fff; color:var(--gris); border:2px solid var(--bord); white-space:nowrap;}
  .onglets button.actif{background:var(--encre); color:#fff; border-color:var(--encre);}
  .droite{display:flex; align-items:center; gap:12px;}
  .score{display:flex; flex-direction:column; align-items:center; padding:2px 14px; border-radius:12px; background:#fff; border:2px solid var(--bord); min-width:130px;}
  .score small{font-size:.8rem; font-weight:700; color:var(--gris); text-transform:uppercase; letter-spacing:.5px;}
  .score b{font-family:"Baloo 2",cursive; font-size:1.8rem; line-height:1.05;}
  .niveaux{display:flex; gap:4px; flex-wrap:wrap;}
  .niveaux button{font:inherit; font-weight:700; font-size:.95rem; padding:3px 14px; border-radius:999px; cursor:pointer; background:#fff; color:var(--gris); border:2px solid var(--bord);}
  .niveaux button.actif{background:var(--encre); color:#fff; border-color:var(--encre);}
  .btn-son{width:44px; height:44px; border-radius:50%; font-size:1.2rem; cursor:pointer; background:#fff; border:2px solid var(--bord);}
  .consigne{display:flex; justify-content:center; padding:12px 20px 0;}
  .consigne p{margin:0; font-family:"Baloo 2",cursive; font-weight:700; font-size:2.1rem; text-align:center; background:#fff; padding:2px 22px; border-radius:16px; border:2px solid var(--bord);}
  .jeu{flex:1; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:0 40px;}

  /* ---------- le tapis roulant et le nombre ---------- */
  .tapis{position:relative; width:1500px; max-width:100%; height:200px; display:flex; align-items:flex-end; justify-content:center; padding-bottom:34px; touch-action:none;}
  .tapis::after{content:""; position:absolute; left:0; right:0; bottom:0; height:30px; border-radius:15px;
    background:repeating-linear-gradient(90deg,#4a5560 0 22px,#36404a 22px 44px); box-shadow:inset 0 -5px 0 rgba(0,0,0,.25);}
  .morceaux{position:relative; z-index:1; display:flex; gap:56px; align-items:flex-end;}
  .morceau{display:flex; align-items:center; font-family:"Baloo 2",cursive; font-weight:800; font-size:8rem; line-height:1; padding:14px 30px 2px;
    background:#fff; border:5px solid var(--encre); border-radius:22px; box-shadow:0 8px 0 rgba(31,42,51,.18); cursor:grab; touch-action:none;}
  .morceau .ch{display:inline-block;} .morceau .ch.mille{margin-left:.22em;}
  .morceau .zero{color:#aab4bd;}
  .morceau.utilise{opacity:.18; border-style:dashed; box-shadow:none; cursor:default;}
  .morceau.parti{visibility:hidden;}
  .fente{position:relative; display:inline-block; width:44px; height:1em; cursor:crosshair; touch-action:none;}
  .fente::before{content:""; position:absolute; left:50%; top:-26px; bottom:-14px; margin-left:-3px; border-left:6px dashed #9aa6b0;}
  .fente:hover::before{border-left-color:var(--talbot);}
  .coupe{animation:coupe .35s ease;} @keyframes coupe{50%{transform:scale(1.06) rotate(-2deg)}}

  /* ---------- l'atelier : la machine au centre, la pile des doubles à droite ---------- */
  .atelier{display:grid; grid-template-columns:330px 820px 330px; align-items:center; gap:30px; margin-top:40px; margin-bottom:58px;}
  .machine{position:relative; height:300px; border-radius:18px; border:8px solid #37495a;
    background:radial-gradient(circle at 16px 16px,#b0bec5 5px,transparent 6px),radial-gradient(circle at calc(100% - 16px) 16px,#b0bec5 5px,transparent 6px),
      radial-gradient(circle at 16px calc(100% - 16px),#b0bec5 5px,transparent 6px),radial-gradient(circle at calc(100% - 16px) calc(100% - 16px),#b0bec5 5px,transparent 6px),
      repeating-linear-gradient(90deg,#557086 0 3px,#64829b 3px 160px);
    box-shadow:0 10px 22px rgba(0,0,0,.2);}
  .machine::before{content:"ENTRÉE"; position:absolute; left:50%; top:-84px; width:300px; height:76px; margin-left:-150px; background:linear-gradient(180deg,#90a4ae,#607d8b);
    clip-path:polygon(0 0,100% 0,72% 100%,28% 100%); color:#fff; font-family:"Baloo 2",cursive; font-weight:800; font-size:1.3rem; text-align:center; line-height:44px; letter-spacing:2px;}
  .machine::after{content:"SORTIE ▼"; position:absolute; left:50%; bottom:-50px; width:240px; height:42px; margin-left:-120px; background:#37495a; color:#ffd54f;
    clip-path:polygon(10% 0,90% 0,100% 100%,0 100%); font-family:"Baloo 2",cursive; font-weight:800; font-size:1.2rem; text-align:center; line-height:44px; letter-spacing:2px;}
  .hublot{position:absolute; right:22px; top:8px; width:200px; height:80px; border-radius:40px; background:#263845; border:6px solid #b0bec5; overflow:hidden;}
  .chute-morceau{position:absolute; left:50%; top:-170px; transform:translateX(-50%); z-index:3; font-family:"Baloo 2",cursive; font-weight:800; font-size:3rem; line-height:1;
    background:#fff; border:4px solid #1f2a33; border-radius:14px; padding:8px 22px 2px; animation:chute .55s ease-in forwards;}
  @keyframes chute{to{top:-30px; transform:translateX(-50%) scale(.35); opacity:0}}
  .ecran span.copie{display:inline-block; animation:copie .45s ease-out both;} .ecran span.copie.b{animation-delay:.18s;}
  @keyframes copie{from{transform:translateY(-120px) scale(.4); opacity:0}}
  .machine.cible{outline:8px solid var(--talbot); outline-offset:6px;}
  .plaque{position:absolute; left:28px; top:22px; color:#fff; background:#37495a; padding:4px 14px; border-radius:8px; font-family:"Baloo 2",cursive; font-weight:800; font-size:1.5rem; letter-spacing:1px;}
  .roue{position:absolute; width:96px; height:96px; top:-2px;}
  .roue.g{left:20px;} .roue.d{left:104px; width:74px; height:74px; top:10px;}
  .machine.tourne .roue.g{animation:tourne .7s linear infinite;} .machine.tourne .roue.d{animation:tourne .7s linear infinite reverse;}
  .machine.tourne{animation:vibre .1s linear infinite;}
  @keyframes tourne{to{transform:rotate(360deg)}} @keyframes vibre{50%{transform:translateY(2px)}}
  .ecran{position:absolute; left:28px; right:28px; bottom:30px; height:160px; border-radius:20px; background:#fff; display:flex; align-items:center; justify-content:center; gap:22px;
    font-family:"Baloo 2",cursive; font-weight:800; font-size:4.4rem; line-height:1; box-shadow:inset 0 4px 0 rgba(0,0,0,.08); white-space:nowrap;}
  .ecran .vide{color:#c3ccd4; font-size:2.4rem; font-weight:700;}
  .trou{display:inline-flex; align-items:center; justify-content:center; min-width:150px; height:1.25em; padding:8px 18px 0; border:5px dashed var(--gris); border-radius:16px; color:var(--gris);}
  .trou.cible{border-color:var(--talbot); background:#e3f2f5;}
  .trou.plein{border-style:solid; border-color:var(--bien); color:var(--bien); background:#e7f6ee;}
  .pile{display:flex; flex-direction:column-reverse; align-items:flex-start; gap:10px; height:300px; justify-content:flex-start;}
  .double{font-family:"Baloo 2",cursive; font-weight:800; font-size:3.4rem; line-height:1; padding:10px 26px 2px; background:#fff; border:5px solid var(--bien); color:var(--encre); border-radius:18px;
    box-shadow:0 6px 0 rgba(26,143,92,.25); animation:arrive .5s ease;}
  @keyframes arrive{from{transform:translateX(-160px) scale(.6); opacity:0}}

  /* ---------- les réponses ---------- */
  .tuiles{display:flex; gap:34px; justify-content:center; min-height:104px; align-items:center;}
  .tuile{font-family:"Baloo 2",cursive; font-weight:800; font-size:3.6rem; line-height:1; padding:12px 34px 4px; border-radius:18px; background:#fff; border:5px solid var(--encre); cursor:grab; touch-action:none;
    box-shadow:0 6px 0 rgba(31,42,51,.18);}
  .tuile.parti{visibility:hidden;} .tuile.tombe{animation:tombe .6s ease forwards;}
  @keyframes tombe{to{transform:translateY(80px) rotate(25deg); opacity:0}}
  .en-vol{position:fixed !important; z-index:50; pointer-events:none; margin:0 !important; transform:rotate(-4deg) scale(1.05);}
  .secoue{animation:secoue .4s ease;} @keyframes secoue{0%,100%{transform:none}25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}

  /* ---------- le calcul qui se construit ---------- */
  .calcul{font-family:"Baloo 2",cursive; font-weight:800; font-size:3.6rem; line-height:1.1; display:flex; gap:20px; align-items:center; white-space:nowrap; min-height:96px;}
  .calcul .mot{font-size:2.6rem; color:var(--gris);} .calcul .db{color:var(--bien);} .calcul .att{color:#c3ccd4;}
  .calcul .trou{min-width:180px;}

  /* ---------- la tour ---------- */
  .tour-jeu{display:grid; grid-template-columns:1fr 1fr; gap:60px; align-items:center; width:1500px; max-width:100%; height:100%;}
  .tour{display:flex; flex-direction:column-reverse; align-items:center; gap:8px; justify-self:end;}
  .etage{font-family:"Baloo 2",cursive; font-weight:800; font-size:2.7rem; line-height:1; height:72px; display:flex; align-items:center; justify-content:center; padding-top:8px;
    background:var(--bleu); color:#fff; border-radius:14px; box-shadow:inset 0 -8px 0 rgba(0,0,0,.18);}
  .etage:nth-child(even){background:var(--bleu-fonce);}
  .etage.neuf{animation:pose .45s ease;}
  .etage.attend{background:#fff; color:var(--gris); border:5px dashed var(--gris); box-shadow:none; animation:none;}
  .etage.attend.cible{border-color:var(--talbot); background:#e3f2f5;}
  @keyframes pose{from{transform:translateY(-120px); opacity:0}}
  .tour-panneau{display:flex; flex-direction:column; gap:30px; align-items:flex-start;}
  .tour-eq{font-family:"Baloo 2",cursive; font-weight:800; font-size:5rem; line-height:1; white-space:nowrap;}
  .tour-panneau .tuiles{justify-content:flex-start;}

  /* ✏️ Mon nombre : le pavé du maître */
  .onglets .perso{border-color:var(--talbot); color:var(--talbot);}
  .fond-pave{position:fixed; inset:0; background:rgba(20,30,45,.45); display:flex; align-items:center; justify-content:center; z-index:60;}
  .pave{background:#fff; border-radius:26px; padding:24px 30px; box-shadow:0 20px 50px rgba(0,0,0,.3); display:flex; flex-direction:column; gap:16px; align-items:center;}
  .pave h2{margin:0; font-family:"Baloo 2",cursive; font-size:1.8rem;}
  .pave-ecran{font-family:"Baloo 2",cursive; font-weight:800; font-size:5rem; line-height:1; min-width:420px; text-align:center; padding:14px 20px 4px; border:5px solid var(--encre); border-radius:18px; min-height:1.3em;}
  .pave-ecran.secoue{border-color:var(--faux);}
  .touches{display:grid; grid-template-columns:repeat(3,120px); gap:12px;}
  .touches button{font-family:"Baloo 2",cursive; font-weight:800; font-size:2.6rem; height:96px; border-radius:18px; border:3px solid var(--bord); background:#f6f8fa; cursor:pointer;}
  .touches button.ok{background:var(--talbot); color:#fff; border-color:var(--talbot); font-size:2rem;}
  .pave-bas{display:flex; gap:12px;}
  .pave-bas button{font:inherit; font-weight:700; font-size:1.2rem; padding:8px 22px; border-radius:999px; border:2px solid var(--bord); background:#fff; cursor:pointer;}
  .bas{display:flex; align-items:center; justify-content:center; gap:18px; padding:6px 0 14px; min-height:70px;}
  .btn-indice{font:inherit; font-weight:700; font-size:1.2rem; padding:6px 16px; border-radius:999px; cursor:pointer; background:#fff8dc; border:2px solid #f1d27a; color:#7a5b00;}
  .verdict{min-height:3rem; font-family:"Baloo 2",cursive; font-size:2rem; font-weight:800; text-align:center;}
  .verdict:not(:empty){background:#fff; padding:0 24px; border-radius:14px;}
  .verdict.bien{color:var(--bien);} .verdict.faux{color:var(--faux);} .verdict.indice{color:#7a5b00;}
  .btn-suivant{font:inherit; font-family:"Baloo 2",cursive; font-weight:800; font-size:1.8rem; padding:4px 34px; border-radius:999px; cursor:pointer; background:var(--encre); color:#fff; border:none;}
</style>
</head>

<div class="barre">
  <div class="titre">
    <svg viewBox="0 0 64 64" aria-hidden="true"><rect x="6" y="20" width="52" height="38" rx="8" fill="#1f6fb2"/><path d="M20 4h24l-6 16H26z" fill="#66737f"/><rect x="14" y="30" width="36" height="16" rx="4" fill="#fff"/><text x="32" y="43" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2a33">×2</text></svg>

<!-- CALCULETTE -->
<script>
/* 🧮 La calculette (Karim, 21/10) : pour répondre par un nombre, l'élève touche les touches d'une petite calculette posée sur le côté
   (plus d'étiquettes-réponses à glisser). Ce qu'il tape s'écrit dans la case du jeu ; dès que le nombre ne peut plus devenir la
   réponse, c'est faux ; dès qu'il est juste, le jeu continue. Installé par injecter.py.
   Calculette.ouvrir({ cible: élément, bon: 42, format: f, siBon: function () {}, siFaux: function (tapé) {} }) ; Calculette.fermer(). */
(function () {
  var st = document.createElement("style");
  st.textContent =
    "#calculette{position:fixed; right:110px; bottom:28px; display:none; flex-direction:column; gap:6px; padding:8px; background:#eceff1; border:2px solid #cfd8dc; border-radius:14px; z-index:55; opacity:.9}" +
    "#calculette .ecr{display:none}" +
    "#calculette .tou{display:grid; grid-template-columns:repeat(3,46px); gap:5px}" +
    "#calculette button{height:38px; border:1px solid #cfd8dc; border-radius:8px; background:#fff; color:#607d8b; font:700 19px 'Baloo 2',Arial,sans-serif; cursor:pointer}" +
    "#calculette button:active{transform:translateY(2px); box-shadow:none}" +
    "#calculette button.eff{color:#c62828}";
  document.head.appendChild(st);
  var box = document.createElement("div"); box.id = "calculette";
  box.innerHTML = '<div class="ecr"></div><div class="tou"></div>';
  document.addEventListener("DOMContentLoaded", function () { document.body.appendChild(box); });
  if (document.body) document.body.appendChild(box);
  var o = null, tape = "", texteAvant = "";
  ["7", "8", "9", "4", "5", "6", "1", "2", "3", "", "0", "⌫"].forEach(function (k) {
    var b = document.createElement("button"); b.type = "button"; b.textContent = k; if (!k) b.style.visibility = "hidden"; if (k === "⌫") b.className = "eff";
    b.addEventListener("click", function () { touche(k); }); box.querySelector(".tou").appendChild(b);
  });
  function montre() {
    box.querySelector(".ecr").textContent = tape;
    if (o && o.cible) o.cible.textContent = tape ? (o.format ? o.format(+tape) : tape) : texteAvant;
  }
  function touche(k) {
    if (!o || !k) return;
    if (k === "⌫") tape = tape.slice(0, -1); else if (tape.length < 7) tape += k;
    montre();
    var juste = String(o.bon);
    if (tape === juste) { var f = o.siBon; o = null; tape = ""; box.style.display = "none"; f(+juste); return; }
    if (tape && juste.indexOf(tape) !== 0) {
      var t = tape; if (o.siFaux) o.siFaux(+t);
      setTimeout(function () { tape = ""; montre(); }, 700);
    }
  }
  document.addEventListener("keydown", function (e) { if (!o) return; if (/^[0-9]$/.test(e.key)) touche(e.key); else if (e.key === "Backspace") touche("⌫"); });
  // si le jeu passe à autre chose (sa case disparaît), la calculette se range
  setInterval(function () { if (o && o.cible && !document.body.contains(o.cible)) window.Calculette.fermer(); }, 400);
  window.Calculette = {
    ouvrir: function (opt) { o = opt; tape = ""; texteAvant = opt.cible ? opt.cible.textContent : ""; box.style.display = "flex"; montre(); },
    fermer: function () { o = null; tape = ""; box.style.display = "none"; }
  };
})();
</script>
<!-- /CALCULETTE -->
<script>
(function () {

  // ---------- glisser (ou toucher) : morceaux vers la machine, réponses vers la case ----------
  function glissable(d, cible, quand) {

    var chute = document.createElement("div"); chute.className = "chute-morceau"; chute.textContent = n(p); M.appendChild(chute); setTimeout(function () { chute.remove(); }, 650);   // le morceau tombe dans la trémie

    function ouvrir(o) { pan.hidden = !o; btn.classList.toggle("ouvert", o); }
    btn.addEventListener("click", function (e) { e.stopPropagation(); ouvrir(pan.hidden); });
    // un niveau choisi, ou une fenêtre ouverte (✏️, 🖨️) : le menu se referme ; on garde le menu ouvert pour choisir un type de jeu
    pan.addEventListener("click", function (e) { var b = e.target.closest("button"); if (b && !b.closest(CONF.garderOuvert || ".types")) setTimeout(function () { ouvrir(false); }, 120); });
    document.addEventListener("pointerdown", function (e) { if (!pan.hidden && !pan.contains(e.target) && e.target !== btn) ouvrir(false); });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", installer); else installer();
})();
</script>
<!-- /MENU -->
<!-- INDICE-COTE -->
<script>
/* 💡 sur le côté (Karim, 21/10) : dans les jeux qui ont un bouton « 💡 Indice » (.btn-indice), le bouton devient une ampoule seule,
   collée au bord droit de l'écran, à mi-hauteur ; l'indice s'ouvre dans une bulle à côté d'elle, jamais sous le jeu.
   Le jeu garde son propre code : au toucher, on regarde quel texte il vient d'écrire (zone #indice, ou la ligne de message),
   on le reprend dans la bulle et on remet la zone comme avant. Installé par injecter.py. */
(function () {
  var b = document.querySelector(".btn-indice"); if (!b) return;
  var st = document.createElement("style");
  st.textContent =
    ".btn-indice.cote{position:fixed !important; right:18px; top:50%; transform:translateY(-50%); width:76px; height:76px; padding:0 !important; border-radius:50% !important;" +
    " font-size:40px !important; line-height:1; z-index:60; margin:0 !important; display:flex; align-items:center; justify-content:center}" +
    "#bulle-cote{position:fixed; right:110px; top:50%; transform:translateY(-50%); max-width:520px; background:#fff8c4; border:2px solid #d4b106; border-radius:18px;" +
    " padding:16px 22px; font-size:26px; line-height:1.35; z-index:60; box-shadow:0 6px 18px rgba(0,0,0,.15); display:none}" +
    "#bulle-cote::after{content:''; position:absolute; right:-14px; top:50%; margin-top:-12px; border:12px solid transparent; border-left:14px solid #d4b106; border-right:none}";
  document.head.appendChild(st);
  b.classList.add("cote"); b.textContent = "💡"; b.title = "Indice"; document.body.appendChild(b);
  var bulle = document.createElement("div"); bulle.id = "bulle-cote"; document.body.appendChild(bulle);
  var zones = function () { return Array.prototype.slice.call(document.querySelectorAll("#indice, .indice, #message, .message, #verdict, .verdict, #consigne-aide")); };
  var avant = [], minuteur = null;
  b.addEventListener("click", function () { avant = zones().map(function (z) { return [z, z.textContent, z.className]; }); }, true);   // avant le code du jeu
  b.addEventListener("click", function () {
    setTimeout(function () {
      var txt = "";
      avant.forEach(function (a) {
        var z = a[0], neuf = z.textContent;
        if (neuf !== a[1] && neuf.trim()) { txt = neuf; z.textContent = a[1]; z.className = a[2]; }
      });
      if (!txt) return;   // le jeu montre l'indice autrement : on le laisse faire
      bulle.textContent = txt.replace(/^\s*💡\s*/, ""); bulle.style.display = "block";
      clearTimeout(minuteur); minuteur = setTimeout(function () { bulle.style.display = "none"; }, 8000);
    }, 0);
  });
  document.addEventListener("pointerdown", function (e) { if (e.target !== b && e.target !== bulle) bulle.style.display = "none"; });
})();
</script>
<!-- /INDICE-COTE -->
