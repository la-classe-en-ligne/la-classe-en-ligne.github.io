<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La machine à calculer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='22' fill='none' stroke='%2378909c' stroke-width='12' stroke-dasharray='9 6'/%3E%3Ccircle cx='32' cy='32' r='14' fill='%23fff8e1' stroke='%2337474f' stroke-width='4'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Quicksand:wght@600;700&display=swap">
<style>
  /* ⚙️ La machine à calculer (maquette validée par Karim le 22/10) : calcul en ligne en coupant un nombre.
     On COUPE le nombre au doigt (72 → 70 | 2), chaque morceau passe dans la machine (× 6 : 420, puis 12), puis on ASSEMBLE à
     l'ascenseur (420 + 12 = 432). Le calcul s'écrit à droite, une ligne par étape ; l'élève tape seulement les résultats
     (petite calculette commune). Onglets : × un nombre · + un nombre (47 + 38 : 47 + 30 = 77, l'ascenseur s'arrête à la
     dizaine, 80, puis 80 + 5 = 85) · Le double (200 + 80 + 10) · ✏️ mon calcul.
     Méthodes de la banque : distributivité dans des cas simples (programme CM1, MENT 10 « multiplier par 4, par 8 »),
     ajouter par sauts de dizaines puis passer la dizaine (ascenseur du 10), doubles (MENTAL 2). Nombres : séances P2 de
     calcul mental et d'opérations (📅 1 à 7) et machine à doubler (P1) ; rien d'inventé. */
  :root{ --encre:#1f2a33; --gris:#66737f; --bord:#dfe5ea; --acier:#607d8b; --acier-fonce:#37474f; --bien:#1a8f5c; --faux:#d6455d;
    --talbot:#1f7a8c; --orange:#e65100; --dizaine:#c2541a; }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0; color:var(--encre); font-family:"Quicksand",system-ui,sans-serif; overflow:hidden; height:100vh; display:flex; flex-direction:column;
    background:#eef3f6; user-select:none; -webkit-user-select:none; touch-action:none;}
  [hidden]{display:none !important;}
  .barre{display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:20px; padding:8px 26px; background:#fff; border-bottom:3px solid var(--bord);}
  .titre{display:flex; align-items:center; gap:12px;} .titre svg{width:54px; height:54px;}
  .titre h1{font-family:"Baloo 2",cursive; font-weight:800; font-size:1.9rem; margin:0;}
  .onglets{display:flex; gap:8px; justify-content:center;}
  .onglets button{font:inherit; font-family:"Baloo 2",cursive; font-weight:800; font-size:1.35rem; padding:4px 22px; border-radius:999px; cursor:pointer; background:#eceff1; color:var(--encre); border:none; white-space:nowrap;}
  .onglets button.actif{background:var(--talbot); color:#fff;}
  .onglets .perso{background:#eceff1; color:var(--talbot);}
  .droite{display:flex; align-items:center; gap:12px;}
  .score{display:flex; flex-direction:column; align-items:center; padding:2px 14px; border-radius:12px; background:#fff; border:2px solid var(--bord); min-width:130px;}
  .score small{font-size:.8rem; font-weight:700; color:var(--gris); text-transform:uppercase; letter-spacing:.5px;}
  .score b{font-family:"Baloo 2",cursive; font-size:1.8rem; line-height:1.05;}
  .niveaux{display:flex; gap:4px; flex-wrap:wrap;}
  .niveaux button{font:inherit; font-weight:700; font-size:.95rem; padding:3px 14px; border-radius:999px; cursor:pointer; background:#fff; color:var(--gris); border:2px solid var(--bord);}
  .niveaux button.actif{background:var(--encre); color:#fff; border-color:var(--encre);}
  .btn-son{width:44px; height:44px; border-radius:50%; font-size:1.2rem; cursor:pointer; background:#fff; border:2px solid var(--bord);}

  /* l'opération en gros, puis la consigne de l'étape */
  .entete{display:flex; flex-direction:column; align-items:center; gap:6px; padding:12px 20px 0;}
  .operation{font-family:"Baloo 2",cursive; font-weight:800; font-size:3.4rem; line-height:1.1; background:#fff; padding:4px 40px 0; border-radius:18px; white-space:nowrap;}
  .operation .res{color:var(--bien);}
  .consigne p{margin:0; font-family:"Baloo 2",cursive; font-weight:700; font-size:1.9rem; color:#455a64; text-align:center;}

  .jeu{flex:1; min-height:0; display:grid; grid-template-columns:500px 410px 340px minmax(0,1fr); gap:20px; padding:10px 120px 10px 30px; align-items:start;}

  /* ---------- le nombre à couper ---------- */
  .tapis{display:flex; flex-direction:column; align-items:center; padding-top:40px; touch-action:none; height:100%; min-width:0;}
  .morceaux{display:flex; flex-wrap:nowrap; gap:.25em; justify-content:center; align-items:flex-end; width:100%; font-size:112px; overflow:hidden; padding:30px 0 12px;}
  .morceau{display:flex; align-items:center; font-family:"Baloo 2",cursive; font-weight:800; font-size:1em; line-height:1; padding:.12em .2em 0; flex:none;
    background:#fff; border:5px solid #455a64; border-radius:20px; box-shadow:0 8px 0 rgba(31,42,51,.15); cursor:grab; touch-action:none;}
  .morceau.coupe-faite{border-color:var(--talbot);}
  .morceau .ch.mille{margin-left:.22em;}
  .morceau .zero{color:#aab4bd;}
  .morceau.utilise{opacity:.2; border-style:dashed; box-shadow:none; cursor:default;}
  .morceau.parti{visibility:hidden;}
  .fente{position:relative; display:inline-block; width:.34em; height:1em; cursor:crosshair; touch-action:none;}
  .fente::before{content:""; position:absolute; left:50%; top:-24px; bottom:-12px; margin-left:-3px; border-left:6px dashed #b0bec5;}
  .fente:hover::before{border-left-color:#e53935;}
  .ciseaux{font-size:3.4rem; height:60px; margin-bottom:6px;}
  .coupe{animation:coupe .35s ease;} @keyframes coupe{50%{transform:scale(1.05) rotate(-2deg)}}

  /* ---------- la machine ---------- */
  .zone-machine{display:flex; flex-direction:column; align-items:center; padding-top:84px;}
  .machine{position:relative; width:400px; height:400px; border-radius:26px; border:8px solid var(--acier-fonce); background:linear-gradient(#90a4ae,#607d8b);
    box-shadow:0 10px 22px rgba(0,0,0,.18);}
  .machine::before{content:"ENTRÉE"; position:absolute; left:50%; top:-76px; width:220px; height:70px; margin-left:-110px; background:#78909c; border:7px solid var(--acier-fonce); border-bottom:none;
    clip-path:polygon(0 0,100% 0,75% 100%,25% 100%); color:#fff; font-family:"Baloo 2",cursive; font-weight:800; font-size:1.1rem; text-align:center; line-height:36px; letter-spacing:2px;}
  .machine.cible{outline:8px solid var(--talbot); outline-offset:6px;}
  .hublot{position:absolute; left:50%; top:26px; width:200px; height:200px; margin-left:-100px; border-radius:50%; background:#fff8e1; border:12px solid var(--acier-fonce);
    display:flex; align-items:center; justify-content:center; font-family:"Baloo 2",cursive; font-weight:800; font-size:5.2rem; line-height:1; color:var(--orange); padding-top:12px;}
  .hublot.petit{font-size:3.6rem;}
  .machine.tourne .hublot{animation:tourne .7s linear infinite;} .machine.tourne{animation:vibre .1s linear infinite;}
  @keyframes tourne{to{transform:rotate(360deg)}} @keyframes vibre{50%{transform:translateY(2px)}}
  .ecran{position:absolute; left:20px; right:20px; bottom:46px; height:96px; border-radius:16px; background:#fff; display:flex; align-items:center; justify-content:center; gap:14px;
    font-family:"Baloo 2",cursive; font-weight:800; font-size:48px; line-height:1; white-space:nowrap; box-shadow:inset 0 4px 0 rgba(0,0,0,.08); overflow:hidden; padding:0 12px;}
  .ecran .vide{color:#b0bec5; font-size:1.5rem; font-weight:700;}
  .sortie{position:absolute; left:50%; bottom:-8px; width:160px; height:42px; margin-left:-80px; background:var(--acier-fonce); border-radius:10px 10px 0 0; color:#fff;
    text-align:center; font-size:1.1rem; line-height:44px; letter-spacing:2px; font-family:"Baloo 2",cursive; font-weight:700;}
  .chute{position:absolute; left:50%; top:-150px; transform:translateX(-50%); z-index:3; font-family:"Baloo 2",cursive; font-weight:800; font-size:3rem; line-height:1;
    background:#fff; border:4px solid #455a64; border-radius:14px; padding:8px 20px 2px; animation:chute .55s ease-in forwards;}
  @keyframes chute{to{top:-20px; transform:translateX(-50%) scale(.35); opacity:0}}
  .trou{display:inline-flex; align-items:center; justify-content:center; min-width:130px; height:1.2em; padding:6px 14px 0; border:5px dashed var(--gris); border-radius:14px; color:var(--gris);}
  .trou.plein{border-style:solid; border-color:var(--bien); color:var(--bien); background:#e7f6ee;}
  .produits{display:flex; flex-wrap:wrap; gap:16px; justify-content:center; margin-top:30px; min-height:90px; max-width:440px;}
  .produit{font-family:"Baloo 2",cursive; font-weight:800; font-size:3.4rem; line-height:1; padding:12px 24px 2px; background:#fff; border:5px solid var(--talbot); border-radius:16px; animation:arrive .45s ease;}
  .produits.petit .produit{font-size:2.5rem;}
  @keyframes arrive{from{transform:translateY(-60px) scale(.6); opacity:0}}

  /* ---------- l'ascenseur ---------- */
  .zone-tour{position:relative; height:100%; padding-top:20px;}
  .tour{position:relative; margin-left:84px; width:150px; height:680px; border:4px solid #90a4ae; border-top:18px solid #90a4ae; border-bottom:10px solid #78909c;
    background:linear-gradient(115deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.55) 42%,rgba(255,255,255,0) 54%), linear-gradient(180deg,#eef4f8,#d9e5ec);}
  .tour.repos{opacity:.35;}
  .etage{position:absolute; left:0; right:0; border-top:2px solid rgba(120,144,156,.5);}
  .etage span{position:absolute; right:calc(100% + 12px); top:-22px; font-family:"Baloo 2",cursive; font-weight:800; font-size:1.7rem; color:var(--dizaine); white-space:nowrap;}
  .cabine{position:absolute; left:28px; width:70px; height:46px; margin-top:-23px; border-radius:6px; background:linear-gradient(180deg,#eceff1,#b0bec5); border:3px solid #546e7a;
    display:flex; align-items:center; justify-content:center; font-family:"Baloo 2",cursive; font-weight:800; font-size:1.3rem; color:var(--talbot); transition:top .7s ease; z-index:2;}
  .accolade{position:absolute; left:108px; width:28px; border:5px dashed #e0a800; border-left:none; border-radius:0 14px 14px 0; z-index:1;}
  .accolade.fait{border-style:solid; border-color:var(--bien);}
  .accolade b{position:absolute; left:30px; top:50%; transform:translateY(-50%); font-family:"Baloo 2",cursive; font-weight:800; font-size:2rem; color:#7a5b00; white-space:nowrap; background:#eef3f6; padding:0 6px; border-radius:8px;}
  .accolade.fait b{color:var(--bien);}

  /* ---------- le calcul qui s'écrit ---------- */
  .calcul{font-family:"Baloo 2",cursive; font-weight:800; font-size:52px; line-height:1.3; padding-top:30px; white-space:nowrap; overflow:hidden; min-width:0;}
  .calcul div{animation:ligne .35s ease;} @keyframes ligne{from{opacity:0; transform:translateX(-20px)}}
  .calcul .vu{color:var(--talbot);} .calcul .fin{color:var(--bien);} .calcul .att{color:#b0bec5;}
  .calcul .trou{font-size:.9em;}

  .en-vol{position:fixed !important; z-index:50; pointer-events:none; margin:0 !important; transform:rotate(-4deg) scale(1.05);}
  .secoue{animation:secoue .4s ease;} @keyframes secoue{0%,100%{transform:none}25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}

  /* ✏️ mon calcul : le pavé du maître */
  .fond-pave{position:fixed; inset:0; background:rgba(20,30,45,.45); display:flex; align-items:center; justify-content:center; z-index:60;}
  .pave{background:#fff; border-radius:26px; padding:24px 30px; box-shadow:0 20px 50px rgba(0,0,0,.3); display:flex; flex-direction:column; gap:16px; align-items:center;}
  .pave h2{margin:0; font-family:"Baloo 2",cursive; font-size:1.8rem;}
  .pave-ecran{font-family:"Baloo 2",cursive; font-weight:800; font-size:4.4rem; line-height:1; min-width:420px; text-align:center; padding:14px 20px 4px; border:5px solid var(--encre); border-radius:18px; min-height:1.3em;}
  .pave-ecran.secoue{border-color:var(--faux);}
  .touches{display:grid; grid-template-columns:repeat(3,120px); gap:12px;}
  .touches button{font-family:"Baloo 2",cursive; font-weight:800; font-size:2.6rem; height:90px; border-radius:18px; border:3px solid var(--bord); background:#f6f8fa; cursor:pointer;}
  .touches button.ok{background:var(--talbot); color:#fff; border-color:var(--talbot); font-size:2rem;}
  .pave-bas button{font:inherit; font-weight:700; font-size:1.2rem; padding:8px 22px; border-radius:999px; border:2px solid var(--bord); background:#fff; cursor:pointer;}

  .bas{display:flex; align-items:center; justify-content:center; gap:18px; padding:4px 0 12px; min-height:66px;}
  .btn-indice{font:inherit; font-weight:700; font-size:1.2rem; padding:6px 16px; border-radius:999px; cursor:pointer; background:#fff8dc; border:2px solid #f1d27a; color:#7a5b00;}
  .verdict{min-height:3rem; font-family:"Baloo 2",cursive; font-size:2rem; font-weight:800; text-align:center;}
  .verdict:not(:empty){background:#fff; padding:0 24px; border-radius:14px;}
  .verdict.bien{color:var(--bien);} .verdict.faux{color:var(--faux);} .verdict.indice{color:#7a5b00;}
  .btn-suivant{font:inherit; font-family:"Baloo 2",cursive; font-weight:800; font-size:1.8rem; padding:4px 34px; border-radius:999px; cursor:pointer; background:var(--encre); color:#fff; border:none;}
</style>
</head>
<body>
<div class="barre">
  <div class="titre">
    <svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="22" fill="none" stroke="#78909c" stroke-width="12" stroke-dasharray="9 6"/><circle cx="32" cy="32" r="14" fill="#fff8e1" stroke="#37474f" stroke-width="4"/></svg>
    <h1>La machine à calculer</h1>
  </div>
  <div class="onglets" id="onglets">
    <button type="button" data-op="fois" class="actif">× un nombre</button>
    <button type="button" data-op="plus">+ un nombre</button>
    <button type="button" data-op="double">Le double</button>
    <button type="button" class="perso" id="btnPerso" title="Taper le calcul de mon choix">✏️</button>
  </div>
  <div class="droite">
    <div class="score"><small>Calculs réussis</small><b id="score">0</b></div>
    <div class="score" title="Le meilleur score à ce niveau, gardé sur cet ordinateur"><small>🏆 Record</small><b id="record">0</b></div>
    <div class="niveaux" id="niveaux">
      <button type="button" data-niveau="100" class="actif">≤ 100</button>

  </div>
</div>
<div class="entete">
  <div class="operation" id="operation"></div>
  <div class="consigne"><p id="consigne"></p></div>
</div>
<div class="jeu">
  <div class="tapis" id="tapis"><div class="ciseaux" id="ciseaux">✂️</div><div class="morceaux" id="morceaux"></div></div>
  <div class="zone-machine">
    <div class="machine" id="machine"><div class="hublot" id="hublot"></div><div class="ecran" id="ecran"></div><div class="sortie">SORTIE</div></div>
    <div class="produits" id="produits"></div>
  </div>
  <div class="zone-tour"><div class="tour repos" id="tour"></div></div>

</div>
<div class="fond-pave" id="fondPave" hidden>
  <div class="pave">
    <h2 id="paveTitre"></h2>
    <div class="pave-ecran" id="paveEcran"></div>

      <button type="button">7</button><button type="button">8</button><button type="button">9</button>
      <button type="button">4</button><button type="button">5</button><button type="button">6</button>
      <button type="button">1</button><button type="button">2</button><button type="button">3</button>
      <button type="button" data-t="eff">⌫</button><button type="button">0</button><button type="button" class="ok" data-t="ok">OK</button>
    </div>
    <div class="pave-bas"><button type="button" id="paveAnnuler">Annuler</button></div>
  </div>
</div>
<div class="bas">
  <button class="btn-indice" id="btnIndice" type="button">💡 Indice</button>
  <div class="verdict" id="verdict"></div>
  <button class="btn-suivant" id="btnSuivant" type="button" hidden>➜</button>
</div>
<!-- CALCULETTE -->
<script>
/* 🧮 La calculette (Karim, 21/10) : pour répondre par un nombre, l'élève touche les touches d'une petite calculette posée sur le côté
   (plus d'étiquettes-réponses à glisser). Ce qu'il tape s'écrit dans la case du jeu ; dès que le nombre ne peut plus devenir la
   réponse, c'est faux ; dès qu'il est juste, le jeu continue. Installé par injecter.py.
   Calculette.ouvrir({ cible: élément, bon: 42, format: f, siBon: function () {}, siFaux: function (tapé) {} }) ; Calculette.fermer(). */
(function () {
  var st = document.createElement("style");
  st.textContent =
    "#calculette{position:fixed; right:110px; bottom:28px; display:none; flex-direction:column; gap:6px; padding:8px; background:#eceff1; border:2px solid #cfd8dc; border-radius:14px; z-index:55; opacity:.9}" +
    "#calculette .ecr{display:none}" +
    "#calculette .tou{display:grid; grid-template-columns:repeat(3,46px); gap:5px}" +
    "#calculette button{height:38px; border:1px solid #cfd8dc; border-radius:8px; background:#fff; color:#607d8b; font:700 19px 'Baloo 2',Arial,sans-serif; cursor:pointer}" +
    "#calculette button:active{transform:translateY(2px); box-shadow:none}" +
    "#calculette button.eff{color:#c62828}";
  document.head.appendChild(st);
  var box = document.createElement("div"); box.id = "calculette";
  box.innerHTML = '<div class="ecr"></div><div class="tou"></div>';
  document.addEventListener("DOMContentLoaded", function () { document.body.appendChild(box); });
  if (document.body) document.body.appendChild(box);
  var o = null, tape = "", texteAvant = "";
  ["7", "8", "9", "4", "5", "6", "1", "2", "3", "", "0", "⌫"].forEach(function (k) {
    var b = document.createElement("button"); b.type = "button"; b.textContent = k; if (!k) b.style.visibility = "hidden"; if (k === "⌫") b.className = "eff";
    b.addEventListener("click", function () { touche(k); }); box.querySelector(".tou").appendChild(b);
  });
  function montre() {
    box.querySelector(".ecr").textContent = tape;
    if (o && o.cible) o.cible.textContent = tape ? (o.format ? o.format(+tape) : tape) : texteAvant;
  }
  function touche(k) {
    if (!o || !k) return;
    if (k === "⌫") tape = tape.slice(0, -1); else if (tape.length < 7) tape += k;
    montre();
    var juste = String(o.bon);
    if (tape === juste) { var f = o.siBon; o = null; tape = ""; box.style.display = "none"; f(+juste); return; }
    if (tape && juste.indexOf(tape) !== 0) {
      var t = tape; if (o.siFaux) o.siFaux(+t);
      setTimeout(function () { tape = ""; montre(); }, 700);
    }
  }
  document.addEventListener("keydown", function (e) { if (!o) return; if (/^[0-9]$/.test(e.key)) touche(e.key); else if (e.key === "Backspace") touche("⌫"); });
  // si le jeu passe à autre chose (sa case disparaît), la calculette se range
  setInterval(function () { if (o && o.cible && !document.body.contains(o.cible)) window.Calculette.fermer(); }, 400);
  window.Calculette = {
    ouvrir: function (opt) { o = opt; tape = ""; texteAvant = opt.cible ? opt.cible.textContent : ""; box.style.display = "flex"; montre(); },
    fermer: function () { o = null; tape = ""; box.style.display = "none"; }
  };
})();
</script>
<!-- /CALCULETTE -->
<script>
(function () {
  // Nombres des séances P2 (GTH v2/donnees/seances/maths) et de la banque, aucun inventé :
  // × : calcul mental 📅 4 (× 4, × 8 : 12, 15, 17, 25, 27, 28, 35, 36, 44, 62, 78, 108, 125, 246, 321…) et 📅 7 (23 × 4, 23 × 8, 51 × 8),
  //     opérations 📅 1-4 (répertoires 136 ; 234 × 3, 318 × 6, 412 × 6, 523 × 6…), CM2 : produits à 4 chiffres des opérations 📅 3-4.
  // + : calcul mental 📅 5 à 7 (54 + 29, 47 + 29, 154 + 38, 378 + 69, 698 + 89, 254 + 98…), problèmes et opérations (345 + 439, 248 + 369…).
  // double : machine à doubler (MENTAL 2, manuel P1 S4, bilan P1) et calcul mental 📅 3 (575, 624).
  var LISTES = {
    fois: {
      "100": [[12, 4], [15, 4], [17, 4], [23, 4], [24, 4], [27, 4], [28, 4], [36, 4], [62, 4], [78, 4], [16, 8], [17, 8], [21, 8], [23, 8], [27, 8], [43, 8], [51, 8], [96, 8], [27, 6], [45, 7], [43, 6], [71, 6]],
      "centaines": [[108, 4], [125, 4], [246, 4], [253, 4], [321, 4], [368, 4], [136, 3], [136, 5], [234, 3], [318, 6], [412, 6], [523, 6], [648, 3], [437, 5], [426, 7], [125, 8]],
      "defi": [[1492, 3], [3217, 4], [2406, 6], [4567, 5], [5812, 6], [3214, 8], [4812, 8], [8027, 6], [7935, 8], [4861, 5], [3865, 9], [9873, 8]]
    },
    plus: {

      if (!v || v > dm[1] || (op === "fois" && reponses.length === 1 && v < 2)) { secoue(el("paveEcran")); return; }
      reponses.push(v); saisie = ""; majPave();
      if (reponses.length < demandes.length) { el("paveTitre").textContent = demandes[reponses.length][0]; return; }
      fermerPave();
      nouveau(op === "fois" ? [reponses[0], reponses[1]] : op === "plus" ? [reponses[0], reponses[1]] : [reponses[0], 2]);
      return;
    }
    if (saisie.length >= String(dm[1]).length || (saisie === "" && b.textContent === "0")) return;
    saisie += b.textContent; majPave();
  });
  el("btnSuivant").addEventListener("click", function () { idx++; nouveau(); });
  el("btnSon").addEventListener("click", function () { sonActif = !sonActif; el("btnSon").textContent = sonActif ? "🔊" : "🔇"; });

  function lancer() {
    score = 0; idx = 0;
    document.querySelectorAll("#onglets button[data-op]").forEach(function (b) { b.classList.toggle("actif", b.dataset.op === op); });
    document.querySelectorAll("#niveaux button").forEach(function (b) { b.classList.toggle("actif", b.dataset.niveau === niveau); });
    majScore(); nouveau();
  }
  document.querySelectorAll("#onglets button[data-op]").forEach(function (b) { b.addEventListener("click", function () { op = b.dataset.op; lancer(); }); });
  document.querySelectorAll("#niveaux button").forEach(function (b) { b.addEventListener("click", function () { niveau = b.dataset.niveau; lancer(); }); });
  function lireHash() {   // #fois, #plus, #double, avec -100, -centaines, -defi (ex. #plus-centaines)
    decodeURIComponent(location.hash.slice(1)).split("-").forEach(function (h) { if (LISTES[h]) op = h; if (LISTES.fois[h]) niveau = h; });
    lancer();
  }
  window.addEventListener("hashchange", lireHash);
  window.addEventListener("resize", function () { if (el("cabine")) { var a = parseFloat(el("cabine").textContent.replace(/\s/g, "")); tourVoir(a, a, ""); } });
  lireHash();
  window.__machine = {
    etat: function () {
      return { op: op, niveau: niveau, A: A, N: N, etape: etape, morceaux: valeurs(), fentes: fentesPossibles(), dedans: dedans, faits: faits.slice(), produits: produits.slice(),
        total: total, calcul: [].map.call(el("calcul").children, function (d) { return d.textContent.replace(/\s+/g, " ").trim(); }), score: score, listes: LISTES,
        attendu: (function () { var t = document.getElementById("trouEcran") || document.getElementById("trouCalcul"); return t && !t.classList.contains("plein") ? t.__bon : null; })() };
    },
    couper: couper, entrer: entrer
  };
})();
</script>
<!-- MENU -->
<script>
/* ==== LE MENU ☰ (GTH, 10/10) : interface épurée — à l'écran, seulement le titre, le score, la consigne et l'activité ====
   Tout le reste (niveaux, onglets de méthode, ✏️, 🔊, 🖨️, aide…) part dans un menu ☰, ouvert d'un toucher.
   Réglage par outil (CONF, posé par l'injecteur) : ancre = où mettre le bouton ☰ (sinon en haut à droite de l'écran) ;
   cacher = ce qui part dans le menu (sinon : tout ce qui, dans « .barre .droite », n'est pas un score).
   Installé par .claude/outils/menu-outil/injecter.py ; ne pas modifier dans l'outil, mais dans ce fichier. */
(function () {
  var CONF = {"cacher": [".barre .droite > :not(.score)"]};
  var st = document.createElement("style");
  st.textContent =
    ".menu-btn{width:58px; height:58px; border-radius:16px; border:2px solid rgba(0,0,0,.15); background:#fff; color:#1f2a33; font-size:2rem; line-height:1; cursor:pointer; flex:none; padding:0;}" +
    ".menu-btn.fixe{position:fixed; top:10px; right:12px; z-index:150; box-shadow:0 4px 14px rgba(0,0,0,.15);}" +
    ".menu-btn.ouvert{background:#1f2a33; color:#fff;}" +
    ".menu-panneau{position:fixed; top:76px; right:16px; z-index:200; background:#fff; color:#1f2a33; border-radius:18px; box-shadow:0 18px 50px rgba(0,0,0,.28); padding:16px 18px;" +
    "  display:flex; flex-direction:column; align-items:flex-start; gap:12px; max-width:min(620px, 92vw); max-height:80vh; overflow:auto;}" +
    ".menu-panneau[hidden]{display:none !important;}" +
    ".menu-panneau h4{margin:0; font-family:sans-serif; font-size:.85rem; text-transform:uppercase; letter-spacing:.6px; color:#6d7a85;}" +
    ".menu-panneau > *{position:static !important; margin:0 !important;}" +
    ".menu-panneau > div,.menu-panneau > nav{display:flex; flex-wrap:wrap; gap:8px;}";
  document.head.appendChild(st);
  function installer() {
    var autres = [];
    if (CONF.cacher) CONF.cacher.forEach(function (s) { document.querySelectorAll(s).forEach(function (e) { if (autres.indexOf(e) === -1) autres.push(e); }); });
    else { var d = document.querySelector(".barre .droite"); if (d) autres = Array.prototype.filter.call(d.children, function (e) { return !e.classList.contains("score"); }); }
    if (!autres.length) return;
    var btn = document.createElement("button"); btn.type = "button"; btn.className = "menu-btn"; btn.title = "Niveaux et réglages"; btn.textContent = "☰";
    var pan = document.createElement("div"); pan.className = "menu-panneau"; pan.hidden = true;
    var t = document.createElement("h4"); t.textContent = "Niveaux et réglages"; pan.appendChild(t);
    autres.forEach(function (e) { pan.appendChild(e); });
    var ancre = document.querySelector(CONF.ancre || ".barre .droite");
    if (ancre) ancre.appendChild(btn); else { btn.classList.add("fixe"); document.body.appendChild(btn); }
    document.body.appendChild(pan);
    function ouvrir(o) { pan.hidden = !o; btn.classList.toggle("ouvert", o); }
    btn.addEventListener("click", function (e) { e.stopPropagation(); ouvrir(pan.hidden); });
    // un niveau choisi, ou une fenêtre ouverte (✏️, 🖨️) : le menu se referme ; on garde le menu ouvert pour choisir un type de jeu
    pan.addEventListener("click", function (e) { var b = e.target.closest("button"); if (b && !b.closest(CONF.garderOuvert || ".types")) setTimeout(function () { ouvrir(false); }, 120); });
    document.addEventListener("pointerdown", function (e) { if (!pan.hidden && !pan.contains(e.target) && e.target !== btn) ouvrir(false); });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", installer); else installer();
})();
</script>
<!-- /MENU -->
<!-- INDICE-COTE -->
<script>
/* 💡 sur le côté (Karim, 21/10) : dans les jeux qui ont un bouton « 💡 Indice » (.btn-indice), le bouton devient une ampoule seule,
   collée au bord droit de l'écran, à mi-hauteur ; l'indice s'ouvre dans une bulle à côté d'elle, jamais sous le jeu.
   Le jeu garde son propre code : au toucher, on regarde quel texte il vient d'écrire (zone #indice, ou la ligne de message),
   on le reprend dans la bulle et on remet la zone comme avant. Installé par injecter.py. */
(function () {
  var b = document.querySelector(".btn-indice"); if (!b) return;
  var st = document.createElement("style");
  st.textContent =
    ".btn-indice.cote{position:fixed !important; right:18px; top:50%; transform:translateY(-50%); width:76px; height:76px; padding:0 !important; border-radius:50% !important;" +
    " font-size:40px !important; line-height:1; z-index:60; margin:0 !important; display:flex; align-items:center; justify-content:center}" +
    "#bulle-cote{position:fixed; right:110px; top:50%; transform:translateY(-50%); max-width:520px; background:#fff8c4; border:2px solid #d4b106; border-radius:18px;" +
    " padding:16px 22px; font-size:26px; line-height:1.35; z-index:60; box-shadow:0 6px 18px rgba(0,0,0,.15); display:none}" +
    "#bulle-cote::after{content:''; position:absolute; right:-14px; top:50%; margin-top:-12px; border:12px solid transparent; border-left:14px solid #d4b106; border-right:none}";
  document.head.appendChild(st);
  b.classList.add("cote"); b.textContent = "💡"; b.title = "Indice"; document.body.appendChild(b);
  var bulle = document.createElement("div"); bulle.id = "bulle-cote"; document.body.appendChild(bulle);
  var zones = function () { return Array.prototype.slice.call(document.querySelectorAll("#indice, .indice, #message, .message, #verdict, .verdict, #consigne-aide")); };
  var avant = [], minuteur = null;
  b.addEventListener("click", function () { avant = zones().map(function (z) { return [z, z.textContent, z.className]; }); }, true);   // avant le code du jeu
  b.addEventListener("click", function () {
    setTimeout(function () {
      var txt = "";
      avant.forEach(function (a) {
        var z = a[0], neuf = z.textContent;
        if (neuf !== a[1] && neuf.trim()) { txt = neuf; z.textContent = a[1]; z.className = a[2]; }
      });
      if (!txt) return;   // le jeu montre l'indice autrement : on le laisse faire
      bulle.textContent = txt.replace(/^\s*💡\s*/, ""); bulle.style.display = "block";
      clearTimeout(minuteur); minuteur = setTimeout(function () { bulle.style.display = "none"; }, 8000);
    }, 0);
  });
  document.addEventListener("pointerdown", function (e) { if (e.target !== b && e.target !== bulle) bulle.style.display = "none"; });
})();
</script>
<!-- /INDICE-COTE -->
