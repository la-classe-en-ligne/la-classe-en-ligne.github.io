<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le schéma en barres</title>
<!--
  📊 Le schéma en barres, refait le 7/11 (Karim : « horrible, aussi bien visuellement que didactiquement, on comprend rien ») : plus de chocolaterie, de moules ni de couteau.
  Les quatre gestes de la méthode de la classe, l'un après l'autre, une seule question à l'écran :
    1. Je cherche : qu'est-ce qu'on cherche ? · 2. Je dessine : combien de parties ? (au Défi : quel schéma ?) · 3. Je place : les nombres de l'histoire et le « ? » sur le schéma · 4. Je calcule : quelle opération ?
  Le jeu ne donne jamais le résultat : à la fin, « écris ton calcul et ta phrase réponse sur l'ardoise ».
  Niveaux : Parties-tout (#pt), Comparaison (#cmp), Fois plus (#fois), Défi (#defi, en plusieurs étapes).
  Glisser une étiquette, ou la toucher puis toucher sa place. Toucher une étiquette posée la reprend.
  Contenu : fichier recherches de la banque et problèmes des séances P2 (mêmes problèmes qu'avant).
-->
<style>
:root { --encre:#17303a; --tout:#1565c0; --part:#ad1457; --ecart:#ef6c00; --fond:#f7f9fb; --ok:#2e7d32; --ko:#c62828; }
* { box-sizing:border-box; }
html,body { margin:0; height:100%; overflow:hidden; background:#10242c; font-family:"Segoe UI",Calibri,Arial,sans-serif; color:var(--encre); user-select:none; -webkit-user-select:none; touch-action:none; }
#scene { position:absolute; width:1920px; height:1080px; transform-origin:0 0; background:var(--fond); overflow:hidden; }
#barre { height:80px; display:flex; align-items:center; gap:16px; padding:0 26px; background:#17303a; color:#fff; }
#barre h1 { font-size:32px; margin:0; white-space:nowrap; }
#niveaux { display:flex; gap:8px; margin-left:14px; }
#niveaux button { font:inherit; font-size:22px; padding:7px 18px; border-radius:11px; border:2px solid #5b7480; background:#27444f; color:#eee; cursor:pointer; }
#niveaux button.on { background:#f6c018; color:#17303a; font-weight:700; border-color:#f6c018; }
#coin { margin-left:auto; font-size:22px; white-space:nowrap; } #coin b { color:#f6c018; }
#fil { display:flex; justify-content:center; gap:10px; padding:14px 0 0; font-size:24px; font-weight:600; color:#90a4ae; }
#fil span { padding:4px 18px; border-radius:20px; background:#e8edf0; } #fil span.on { background:var(--tout); color:#fff; } #fil span.fait { background:#c8e6c9; color:#1b5e20; }
#histoire { margin:14px 60px 0; background:#fff; border:2px solid #d5dde2; border-radius:18px; padding:16px 30px; font-size:40px; line-height:1.3; text-align:center; min-height:120px; }
#histoire b { color:var(--tout); } #etape { font-size:30px; font-weight:700; color:var(--part); margin-top:6px; }
#consigne { text-align:center; font-size:48px; font-weight:800; margin-top:20px; }
#schema { position:absolute; left:120px; right:120px; top:432px; height:390px; }
.barre-s { display:flex; width:100%; height:112px; }
.case-s { position:relative; flex:1; min-width:120px; display:flex; align-items:center; justify-content:center; border:5px solid; font-size:42px; font-weight:800; background:#fff; }
.case-s + .case-s { border-left:0; }
.case-s small { position:absolute; left:10px; top:2px; font-size:21px; font-weight:600; opacity:.8; }
.tout { border-color:var(--tout); background:#e3f2fd; color:var(--tout); }
.part { border-color:var(--part); background:#fce4ec; color:var(--part); }
.ecart { border-color:var(--ecart); border-style:dashed; background:#fff3e0; color:var(--ecart); }
.vide { cursor:pointer; } .vide.cible { outline:6px solid #f6c018; outline-offset:-6px; }
.pose { cursor:pointer; }
.q-s { background:#fff; color:#17303a; border-radius:12px; padding:0 22px; border:3px solid #17303a; }
.lig2 { margin-top:16px; }
.cmp-l { display:flex; gap:0; width:100%; height:112px; margin-top:16px; }
.ligne-n { margin-top:14px; font-size:28px; display:flex; align-items:center; gap:14px; justify-content:center; }
.ligne-n .case-s { flex:none; min-width:380px; padding:0 20px; height:80px; white-space:nowrap; }
#bas { position:absolute; left:40px; right:40px; top:846px; display:flex; flex-wrap:wrap; justify-content:center; gap:20px; }
#bas button { font:inherit; font-weight:800; font-size:42px; padding:16px 36px; border-radius:18px; border:4px solid #17303a; background:#fff; color:#17303a; cursor:pointer; }
#bas button.op { font-size:84px; width:136px; height:136px; padding:0; border-radius:50%; border:0; background:#17303a; color:#fff; line-height:1; box-shadow:0 6px 0 #0b1a20; }   /* Karim, 8/11 : un signe à toucher, pas une case où écrire */
.sg { position:relative; width:0; z-index:2; } .sg b { position:absolute; left:-34px; top:22px; width:68px; height:68px; border-radius:50%; background:#ff8f00; color:#fff; font-size:54px; display:flex; align-items:center; justify-content:center; box-shadow:0 3px 0 #b26a00; }
.sg + .case-s { border-left:0; }
.sg-eq b { left:-84px; background:#2e7d32; box-shadow:0 3px 0 #1b5e20; }
/* Karim, 11/11 : « la modélisation du tout est très moyenne, justifiée à gauche, les calculs ne sont pas visibles » :
   la valeur au centre de la case, l'étiquette dessous ; des largeurs qui suivent les nombres ; le calcul en grand avec son résultat ;
   à la correction, les parties connues s'effacent du tout (j'enlève) et la réponse apparaît dans la case « ? » */
.case-s { flex-direction:column; transition:flex .6s; }
.case-s small { position:static; order:2; font-size:22px; margin-top:2px; opacity:.75; }
.case-s.enl { animation:enl .7s ease forwards; } @keyframes enl { to { opacity:.28; background:repeating-linear-gradient(45deg,#fce4ec,#fce4ec 12px,#fff 12px,#fff 24px); } }
.case-s .rep { color:#2e7d32; font-size:48px; animation:pop .6s ease both; } @keyframes pop { 0% { transform:scale(.2); opacity:0; } 70% { transform:scale(1.2); opacity:1; } 100% { transform:scale(1); } }
.case-s.trouve { border-color:#2e7d32 !important; background:#e8f5e9 !important; }
#schema .calc-s { margin-top:30px; font-size:60px; } #schema .calc-s span { padding:8px 34px; } #schema .calc-s b { color:#2e7d32; }
.calc-s { margin-top:26px; text-align:center; font-size:46px; font-weight:800; color:#17303a; } .calc-s span { background:#fff8e1; border:4px solid #ff8f00; border-radius:16px; padding:6px 26px; }
#bas button.mauvais { background:#ffcdd2; }
.etiq { font-size:38px; font-weight:800; padding:14px 28px; border-radius:16px; background:#fffde7; border:4px solid #f6c018; cursor:grab; touch-action:none; }
.etiq.choisie { outline:6px solid var(--tout); }
.etiq.qq { background:#17303a; color:#fff; border-color:#17303a; }
#vol { position:absolute; z-index:9; pointer-events:none; display:none; }
#verdict { position:absolute; left:0; right:0; bottom:100px; text-align:center; font-size:36px; font-weight:700; }
#verdict.ok { color:var(--ok); } #verdict.ko { color:var(--ko); }
#suivant { position:absolute; right:150px; bottom:24px; font:inherit; font-size:32px; font-weight:800; padding:12px 34px; border-radius:16px; border:0; background:var(--tout); color:#fff; cursor:pointer; display:none; }
.rond { position:absolute; right:28px; bottom:22px; width:84px; height:84px; border-radius:50%; font-size:42px; border:3px solid #17303a; background:#fff; cursor:pointer; }
#bulle { position:absolute; right:28px; bottom:118px; width:760px; font-size:32px; line-height:1.3; background:#fffde7; border:3px solid #f6c018; border-radius:18px; padding:16px 24px; display:none; z-index:6; }
/* 11/11 — « Je comprends le tout » (Karim : « ils ne comprennent pas que la barre du haut représente les parties du bas ») ; source : guide Eduscol « La résolution de problèmes mathématiques au cours moyen », p. 110-111 (démarche concrète-imagée-abstraite : des barres épaisses pour rapprocher la représentation des objets manipulés) et p. 119 (introduire les barres progressivement au cycle 3) :
   les parties sont faites d'un carré par objet ; je les glisse dans la grande barre : elle se remplit, le tout s'écrit. Puis une partie cachée. */
#tout { position:absolute; left:40px; right:40px; top:150px; bottom:30px; background:#fff; border-radius:28px; padding:26px 40px; box-sizing:border-box; font-family:inherit; }
#tout[hidden] { display:none; }
#tHist { font-size:44px; font-weight:700; color:#2b2350; margin-bottom:10px; }
#tCons { font-size:32px; color:#5e548e; margin-bottom:80px; }
#tGrand { position:relative; height:150px; box-sizing:content-box; border:5px dashed #7c4dff; border-radius:16px; display:flex; align-items:stretch; margin-bottom:12px; }
#tGrand.plein { border-style:solid; }
#tSegs { display:flex; width:100%; }
#tLab { position:absolute; left:0; right:0; top:-54px; text-align:center; font-size:38px; font-weight:800; color:#7c4dff; }
.tseg { display:flex; flex-direction:column; flex-wrap:nowrap; align-items:center; justify-content:center; border-right:4px solid #fff; font-size:36px; font-weight:800; color:#fff; transition:all .5s; overflow:hidden; }
.tseg small { font-size:26px; margin-top:4px; } .tcar { display:inline-block; width:44px; height:44px; margin:3px; border-radius:8px; background:rgba(255,255,255,.85); }
#tParts { display:flex; gap:40px; margin-top:70px; align-items:flex-end; flex-wrap:wrap; }
.tpart { padding:14px; border-radius:16px; cursor:grab; touch-action:none; user-select:none; text-align:center; font-size:30px; font-weight:800; color:#fff; box-shadow:0 6px 0 rgba(0,0,0,.15); }
.tpart .tl { display:block; margin-top:8px; }
.tpart.posee { opacity:.15; pointer-events:none; }
.tseg.cache { background:repeating-linear-gradient(45deg,#ede7f6,#ede7f6 14px,#fff 14px,#fff 28px) !important; color:#7c4dff; font-size:64px; cursor:pointer; }
#tCalc { font-size:52px; font-weight:800; color:#2b2350; margin-top:30px; min-height:70px; }
/* 11/11 (2) — « Je cherche une partie : j'enlève » (Karim : « il ne suffit pas de dire la règle, il faut une activité ou une animation qui la montre ») ;
   source : guide Eduscol « La résolution de problèmes mathématiques au cours moyen » : p. 67 (retrouver une partie connaissant le tout est plus difficile que trouver le tout) ;
   p. 112 (la barre unique des parties-tout rend « explicites les relations d'inclusion » : « les 2,70 € n'existent pas à côté des 17,30 €, mais ils sont une partie des 17,30 € ») ;
   p. 111 (les barres épaisses rapprochent le schéma des cubes manipulés) ; p. 114 (« Partie B = Tout – Partie A »).
   Le tout est plein ; les parties connues sont DEDANS ; je les enlève du tout : ce qui reste, c'est la partie cherchée. */
.tseg.tk { cursor:grab; touch-action:none; }
.tseg.vide { background:transparent !important; border:4px dashed #b39ddb; color:#b39ddb; }
.tseg.vide span, .tseg.vide .tcar { visibility:hidden; }
.tseg.reste { background:#7c4dff !important; color:#fff; font-size:56px; }
.tenl { display:inline-flex; align-items:center; gap:10px; font-size:34px; font-weight:800; color:#fff; padding:10px 18px; border-radius:14px; }
/* Karim, 11/11 (3) : les énoncés en Belle Allure, les nombres en gras et en bleu ; « Je comprends le tout » centré (75 % de l'écran était vide) ;
   plus de consigne écrite dans « tout » et « partie » ; une validation qui se voit (avant : un petit ✅) */
@font-face { font-family:"Belle Allure"; src:url("../../Planificateur/BelleAllureCM-Fin.otf") format("opentype"); }
#histoire, #tHist, .cah-enonce { font-family:"Belle Allure", "Segoe Print", cursive; font-weight:400; }
#histoire b, #tHist b, .cah-enonce b { font-family:"Segoe UI", Calibri, Arial, sans-serif; font-weight:800; color:#1565c0;  white-space:nowrap; }
#histoire { font-size:44px; line-height:1.55; }
#tout { display:flex; flex-direction:column; align-items:center; text-align:center; }
#tHist { font-size:46px; line-height:1.5; color:#17252b; margin:10px 0 70px; }
#tCons { display:none !important; }
#tGrand { margin:0 auto 12px; }
#tParts { justify-content:center; }
#tCalc { text-align:center; }
#okGrand { position:absolute; left:50%; top:46%; width:300px; height:300px; margin:-150px 0 0 -150px; border-radius:50%; background:#2e7d32; color:#fff; font-size:200px; line-height:300px; text-align:center;
  box-shadow:0 0 0 22px rgba(46,125,50,.25), 0 20px 60px rgba(0,0,0,.25); z-index:30; pointer-events:none; opacity:0; transform:scale(.3); }
#okGrand.vu { animation:okPop 1.3s ease forwards; }
@keyframes okPop { 0% { opacity:0; transform:scale(.3); } 20% { opacity:1; transform:scale(1.12); } 35% { transform:scale(1); } 80% { opacity:1; } 100% { opacity:0; transform:scale(1); } }
/* « Dans mon cahier » : deux problèmes par niveau, à recopier et résoudre ; on corrige ensuite chacun dans l'activité */
#cahier { position:absolute; left:40px; right:40px; top:160px; bottom:24px; display:none; gap:30px; }
#cahier.on { display:flex; }
#cahier .cah-col { flex:1; background:#fff; border-radius:24px; padding:14px 26px; overflow:hidden; border:4px solid #cfd8dc; display:flex; flex-direction:column; gap:18px; }
#cahier .cah-col h2 { margin:0; font-size:40px; } #cahier .cah-col.c1 h2 { color:#1565c0; } #cahier .cah-col.c2 h2 { color:#6a1b9a; }
#cahier .cah-pb { border-top:3px dashed #cfd8dc; padding-top:14px; }
#cahier .cah-enonce { font-size:31px; line-height:1.45; color:#17252b; }
#cahier .cah-pb button { font:inherit; font-size:24px; font-weight:800; margin-top:4px; padding:6px 20px; border-radius:14px; border:0; background:var(--tout); color:#fff; cursor:pointer; }
#cahTete { position:absolute; left:0; right:0; top:100px; text-align:center; font-size:30px; font-weight:800; color:#17252b; display:none; }
#cahTete.on { display:block; }
#tSuiv { display:none; position:absolute; right:40px; bottom:30px; font-size:36px; padding:14px 30px; border-radius:20px; border:0; background:#7c4dff; color:#fff; font-weight:800; cursor:pointer; }
</style>
</head>
<body>
<div id="scene">
  <div id="barre"><h1>📊 Le schéma en barres</h1>
    <div id="niveaux"><button data-o="tout">Je comprends le tout</button><button data-o="partie">Je cherche une partie : j'enlève</button><button data-o="cahier">Dans mon cahier</button><button data-o="pt">Parties-tout</button><button data-o="cmp">Comparaison</button><button data-o="fois">Fois plus</button><button data-o="defi">Défi</button></div>
    <div id="coin">Problèmes réussis : <b id="score">0</b> · 🏆 Record : <b id="record">0</b></div></div>
  <div id="fil"><span data-p="cherche">1. Je cherche</span><span data-p="dessine">2. Je dessine</span><span data-p="place">3. Je place</span><span data-p="calcule">4. Je calcule</span></div>
  <div id="histoire"></div>
  <div id="consigne"></div>
  <div id="schema"></div>
  <div id="bas"></div>
  <div id="verdict"></div>
  <div id="tout" hidden><div id="tHist"></div><div id="tCons"></div><div id="tGrand"><div id="tSegs"></div><div id="tLab"></div></div><div id="tParts"></div><div id="tCalc"></div><button id="tSuiv">Au suivant ▶</button></div>
  <button id="suivant"></button>
  <div id="okGrand">✔</div>
  <div id="cahTete">Dans mon cahier du jour : je recopie mes deux problèmes, je fais le schéma, le calcul et la phrase réponse.</div>
  <div id="cahier"></div>
  <button class="rond" id="indice" title="Indice">💡</button>
  <div id="bulle"></div>
  <div id="vol" class="etiq"></div>
</div>
<script>
"use strict";
// les problèmes : les mêmes que dans la version d'avant ({id|texte} : un nombre de l'histoire)
var PB = {
  pt: [
    { src: "fichier recherches P1 CM1, n° 1", t: "Pour son voyage au Portugal, Maxime a dépensé {a|175 euros} pour l'avion, {b|217 euros} pour l'hôtel et {c|165 euros} pour les loisirs. Combien a-t-il dépensé au total ?", e: [{ m: "pt", parts: ["a", "b", "c"], tout: "?" }] },
    { src: "fichier recherches P1 CM1, n° 2", t: "Stella et Vivien ont ensemble {a|97 cartes} de football. Stella a {b|34 cartes}. Combien de cartes a Vivien ?", e: [{ m: "pt", parts: ["b", "?"], tout: "a" }] },
    { src: "fichier recherches P1 CM1, n° 3", t: "Isma range les {a|248 maillots} de son gymnase dans deux sacs : un vert et un jaune. Le sac vert contient {b|187 maillots}. Combien de maillots contient le sac jaune ?", e: [{ m: "pt", parts: ["b", "?"], tout: "a" }] },
    { src: "fichier recherches P1 CM1, n° 4", t: "Chloé et Enzo ont réalisé {a|488 sauts} le mois dernier. Chloé en a réalisé {b|229}. Combien de sauts a réalisés Enzo ?", e: [{ m: "pt", parts: ["b", "?"], tout: "a" }] },
    { src: "fichier recherches P1 CM1, n° 5", t: "Julie, Nina et Kélycia ont couru un relais de {a|1 896 m}. Julie et Nina ont parcouru {b|1 264 m}. Quelle est la distance parcourue par Kélycia ?", e: [{ m: "pt", parts: ["b", "?"], tout: "a" }] },
    { src: "fichier recherches P1 CM2, n° 1", t: "Pour son voyage au Cambodge, Naël a dépensé {a|1 650 euros} pour l'avion, {b|857 euros} pour l'hôtel, {c|925 euros} pour se nourrir et {d|1 548 euros} pour les loisirs. Combien a-t-il dépensé au total ?", e: [{ m: "pt", parts: ["a", "b", "c", "d"], tout: "?" }] },
    { src: "fichier recherches P1 CM2, n° 2", t: "Lucas et Zoé ont dépensé {a|643 euros} au supermarché. Lucas a dépensé {b|349 euros}. Quelle somme Zoé a-t-elle dépensée ?", e: [{ m: "pt", parts: ["b", "?"], tout: "a" }] },
    { src: "fichier recherches P1 CM2, n° 3", t: "Lors d'un match de handball entre l'équipe violette et l'équipe jaune, {a|421 points} ont été marqués. Les jaunes ont marqué {b|219 points}. Quelle équipe a gagné, et avec quel score ?", e: [{ m: "pt", parts: ["b", "?"], tout: "a" }] },
    { src: "fichier recherches P1 CM2, n° 5", t: "{a|37 654 personnes} ont assisté à la finale de la coupe du monde de rugby. {b|5 937} ont bénéficié d'une entrée gratuite. Combien de personnes ont payé leur place ?", e: [{ m: "pt", parts: ["b", "?"], tout: "a" }] },
    { src: "séance 📅 1 (mémo RECH 1)", t: "Grégoire achète des chaussures à {a|69 €} et des lunettes à {b|135 €}. Combien a-t-il dépensé en tout ?", e: [{ m: "pt", parts: ["a", "b"], tout: "?" }] },
    { src: "séance 📅 1 (Je vérifie)", t: "Emma achète un ordinateur à {a|1 325 €} et une imprimante à {b|279 €}. Combien dépense-t-elle en tout ?", e: [{ m: "pt", parts: ["a", "b"], tout: "?" }] },
    { src: "séance 📅 2 (Je vérifie)", t: "Un parking a {a|567 voitures} : des rouges, des grises et des vertes. Il y a {b|139 voitures rouges} et {c|317 grises}. Combien y a-t-il de voitures vertes ?", e: [{ m: "pt", parts: ["b", "c", "?"], tout: "a" }] }
  ],
  cmp: [
    { src: "fichier recherches P1 CM1, n° 6", t: "La salle de spectacle de Moulins peut accueillir {a|4 532 spectateurs}. C'est {e|2 318 spectateurs de plus} qu'à Bourbon-Lancy. Combien de spectateurs la salle de Bourbon-Lancy accueille-t-elle ?", e: [{ m: "cmp", grande: "a", petite: "?", ecart: "e" }] },
    { src: "fichier recherches P1 CM1, n° 7", t: "Monsieur Lunot gagne {a|1 875 euros} par mois. C'est {e|200 euros de plus} que Monsieur Yani. Combien gagne Monsieur Yani ?", e: [{ m: "cmp", grande: "a", petite: "?", ecart: "e" }] },
    { src: "fichier recherches P1 CM1, n° 8", t: "Le collège Duclos accueille {a|987 élèves}. Le collège Sarrien accueille {b|765 élèves}. Combien le collège Duclos a-t-il d'élèves de plus que le collège Sarrien ?", e: [{ m: "cmp", grande: "a", petite: "b", ecart: "?" }] },
    { src: "fichier recherches P1 CM2, n° 6", t: "Jade et Arthur collectionnent les cartes postales. Jade en a {a|2 786} et Arthur en a {b|938}. Combien de cartes postales Jade a-t-elle de plus ?", e: [{ m: "cmp", grande: "a", petite: "b", ecart: "?" }] },
    { src: "fichier recherches P1 CM2, n° 7", t: "Cette année, il y a eu {a|27 654 visiteurs} à l'exposition culinaire. On a vendu {e|5 674 billets de plus} qu'en 2023. Combien y avait-il eu de visiteurs en 2023 ?", e: [{ m: "cmp", grande: "a", petite: "?", ecart: "e" }] },
    { src: "fichier recherches P1 CM2, n° 8", t: "À La Clusaz, une piste de ski débute à l'altitude de {a|2 735 m} et se termine à l'altitude de {b|1 987 m}. Quel est le dénivelé entre le départ et l'arrivée ?", e: [{ m: "cmp", grande: "a", petite: "b", ecart: "?" }] },
