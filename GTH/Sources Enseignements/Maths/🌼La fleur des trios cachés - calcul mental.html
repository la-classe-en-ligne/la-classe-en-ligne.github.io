<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La fleur des trios cachés</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 40 V62' stroke='%232e8b3e' stroke-width='5'/%3E%3Cellipse cx='42' cy='54' rx='9' ry='4' fill='%233fae5a' transform='rotate(-30 42 54)'/%3E%3Ccircle cx='32' cy='12' r='10' fill='%23ef476f'/%3E%3Ccircle cx='48' cy='24' r='10' fill='%23f78c3b'/%3E%3Ccircle cx='42' cy='40' r='10' fill='%2306a77d'/%3E%3Ccircle cx='22' cy='40' r='10' fill='%23118ab2'/%3E%3Ccircle cx='16' cy='24' r='10' fill='%238e5bd1'/%3E%3Ccircle cx='32' cy='27' r='9' fill='%23264653'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Quicksand:wght@600;700&display=swap">
<style>
  /* Univers de ce jeu : une fleur dans un jardin. Ses 5 pétales sont des pentagones coupés en 5 triangles, un nombre par
     triangle ; dans chaque pétale, deux nombres en donnent un troisième (ou font le nombre du cœur, aux compléments).
     On les touche : le pétale se referme et son résultat va se ranger dans le triangle du cœur qui le touche.
     Les 5 rangés, on rejoue au cœur. Chaque partie a de nouveaux nombres. */
  :root{ --encre:#264653; --gris:#5c7480; --bord:#d5e3e6; --bien:#1a8f5c; --faux:#d6455d; }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0; color:var(--encre); font-family:"Quicksand",system-ui,sans-serif; overflow:hidden; height:100vh; display:flex; flex-direction:column;
    background:linear-gradient(180deg,#d8f0fb 0%,#eef8fc 60%,#cfe9b8 82%,#a9d58a 100%); user-select:none; -webkit-user-select:none; touch-action:none;}
  .barre{display:grid; grid-template-columns:1fr auto; align-items:center; gap:16px; padding:8px 22px; background:#fff; border-bottom:3px solid var(--bord);}
  .titre{display:flex; align-items:center; gap:12px;} .titre svg{width:48px; height:48px;}
  .titre h1{font-family:"Baloo 2",cursive; font-weight:800; font-size:1.9rem; margin:0;}
  .droite{display:flex; align-items:center; gap:12px;}
  .score{display:flex; flex-direction:column; align-items:center; padding:2px 12px; border-radius:12px; background:#fff; border:2px solid var(--bord); min-width:120px;}
  .score small{font-size:.75rem; font-weight:700; color:var(--gris); text-transform:uppercase; letter-spacing:.5px;}
  .score b{font-family:"Baloo 2",cursive; font-size:1.7rem; line-height:1.05;}
  .choix{display:flex; flex-direction:column; gap:4px;}
  .types,.niveaux{display:flex; gap:4px;}
  .types button,.niveaux button{font:inherit; font-weight:700; font-size:.9rem; padding:2px 12px; border-radius:999px; cursor:pointer; background:#fff; color:var(--gris); border:2px solid var(--bord);}
  .niveaux button{min-width:38px;}
  .types button.actif,.niveaux button.actif{background:var(--encre); color:#fff; border-color:var(--encre);}
  .btn-petit{font:inherit; font-weight:700; padding:8px 12px; border-radius:12px; cursor:pointer; background:#fff; border:2px solid var(--bord);}
  .consigne{display:flex; justify-content:center; padding:8px 20px 0;}
  .consigne p{margin:0; font-family:"Baloo 2",cursive; font-weight:700; font-size:2.1rem; text-align:center; background:#fff; padding:2px 22px; border-radius:16px; border:2px solid var(--bord);}

  .jeu{flex:1; min-height:0; position:relative; overflow:hidden;}
  #fleur{position:absolute; inset:0; width:100%; height:100%;}
  .tri{stroke:#fff; stroke-width:4; cursor:pointer; transition:fill .25s ease;}
  .tri.choisi{fill:#ffe08a !important;}
  .tri.vide{fill:#fffdf3; stroke:#c9b98a; stroke-dasharray:8 6;}
  .bord{fill:none; stroke-width:7; stroke-linejoin:round; pointer-events:none;}
  .nb{font-family:"Baloo 2",cursive; font-weight:800; fill:#fff; text-anchor:middle; dominant-baseline:central; pointer-events:none; paint-order:stroke; stroke:rgba(0,0,0,.18); stroke-width:3px;}
  .coeur-cible circle{fill:#fff; stroke:var(--encre); stroke-width:4;} .coeur-cible text{font-family:"Baloo 2",cursive; font-weight:800; fill:var(--encre); text-anchor:middle; dominant-baseline:central;}
  .res-grand{font-family:"Baloo 2",cursive; font-weight:800; fill:#fff; text-anchor:middle; dominant-baseline:central; pointer-events:none;}
  .res-calc{font-family:"Baloo 2",cursive; font-weight:800; fill:#fff; text-anchor:middle; pointer-events:none;}
  .ferme .tri{pointer-events:none;}
  .attente .tri{pointer-events:none;}
  .secoue{animation:secoue .4s ease;} @keyframes secoue{0%,100%{transform:none}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
  .repere .bord{stroke:#ffb300; stroke-width:12;}
  .signe{cursor:pointer;} .signe circle{fill:var(--encre);} .signe text{font-family:"Baloo 2",cursive; font-weight:800; fill:#fff; text-anchor:middle; dominant-baseline:central;}
  .arrive{animation:arrive .6s ease;} @keyframes arrive{0%{opacity:0}100%{opacity:1}}
  .fleurit{animation:fleurit 1.2s ease;} @keyframes fleurit{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}

  .bas{display:flex; align-items:center; justify-content:center; gap:18px; padding:4px 0 12px;}
  .btn-indice{font:inherit; font-weight:700; font-size:1.2rem; padding:6px 16px; border-radius:999px; cursor:pointer; background:#fff8dc; border:2px solid #f1d27a; color:#7a5b00;}
  .verdict{min-height:3rem; font-family:"Baloo 2",cursive; font-size:2.2rem; font-weight:800; text-align:center;}
  .verdict:not(:empty){background:#fff; padding:0 24px; border-radius:14px;}
  .verdict.bien{color:var(--bien);} .verdict.faux{color:var(--faux);}
  .btn-suivant{font:inherit; font-family:"Baloo 2",cursive; font-weight:800; font-size:1.8rem; padding:4px 34px; border-radius:999px; cursor:pointer; background:var(--encre); color:#fff; border:none;}
  .btn-suivant[hidden]{display:none;}

  /* la feuille papier : la fleur à remplir, deux parties par A4 (A5 × 2) */
  #papier{display:none;}
  @media print{
    @page{size:A4 portrait; margin:8mm;}
    body{display:block; height:auto; overflow:visible; background:#fff;}
    body > :not(#papier){display:none !important;}
    #papier{display:block;}
    .feuille{height:138mm; padding:1mm 3mm; page-break-inside:avoid; border-bottom:1px dashed #999;}
    .feuille:nth-child(2n){border-bottom:none; page-break-after:always;}
    .feuille h3{margin:0; font-family:"Baloo 2",cursive; font-size:14pt;}
    .feuille p{margin:0 0 1mm; font-size:10pt;}
    .deux-fleurs{display:flex; justify-content:space-between;} .deux-fleurs svg{width:94mm; height:112mm;}
  }
</style>
</head>
<body>
<div class="barre">
  <div class="titre">
    <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 40 V62" stroke="#2e8b3e" stroke-width="5"/><ellipse cx="42" cy="54" rx="9" ry="4" fill="#3fae5a" transform="rotate(-30 42 54)"/><circle cx="32" cy="12" r="10" fill="#ef476f"/><circle cx="48" cy="24" r="10" fill="#f78c3b"/><circle cx="42" cy="40" r="10" fill="#06a77d"/><circle cx="22" cy="40" r="10" fill="#118ab2"/><circle cx="16" cy="24" r="10" fill="#8e5bd1"/><circle cx="32" cy="27" r="9" fill="#264653"/></svg>
    <h1>La fleur des trios cachés</h1>
  </div>
  <div class="droite">
    <div class="score" title="Pétales trouvés du premier coup"><small>Pétales réussis</small><b id="score">0</b></div>
    <div class="score" title="Le meilleur score à ce niveau, gardé sur cet ordinateur"><small>🏆 Record</small><b id="record">0</b></div>
    <div class="choix">
      <div class="types" id="types">
        <button type="button" data-type="plus" class="actif">+</button>
        <button type="button" data-type="moins">−</button>
        <button type="button" data-type="fois">×</button>
        <button type="button" data-type="compl">Compléments</button>
        <button type="button" data-type="defi">Défi</button>
      </div>
      <div class="niveaux" id="niveaux"></div>
    </div>
    <button class="btn-petit" id="btnSon" type="button" title="Son">🔊</button>
    <button class="btn-petit" id="btnImprimer" type="button" title="Imprimer cette partie et une autre, deux par A4">🖨️ Feuille</button>
  </div>
</div>
<div class="consigne"><p id="consigne"></p></div>
<div class="jeu" id="jeu"><svg id="fleur"></svg></div>
<div class="bas">
  <button class="btn-indice" id="btnIndice" type="button">💡 Indice</button>
  <div class="verdict" id="verdict"></div>
  <button class="btn-suivant" id="btnSuivant" type="button" hidden>Nouvelle fleur ➜</button>
</div>
<div id="papier"></div>
<script>
(function () {
  // Pour chaque type, 5 niveaux ; chaque partie tire de nouveaux nombres (graine au hasard). Nombres inventés.
  // a, b : bornes des deux nombres ; pas : on prend des multiples de pas ; max : le plus grand nombre affiché ;
  // coeur : les signes du trio du cœur (si le type ne permet pas de trio avec ses propres résultats).
  var TYPES = {
    plus: { nom: "+", ops: ["+"], niv: [
      { a: [1, 6], b: [1, 6], max: 10, titre: "≤ 10" }, { a: [2, 9], b: [2, 9], max: 18, titre: "≤ 20" },
      { a: [10, 45], b: [2, 9], max: 50, titre: "≤ 50" }, { a: [11, 60], b: [11, 39], max: 100, titre: "≤ 100" },
      { a: [100, 600], b: [100, 400], pas: 10, max: 1000, titre: "≤ 1 000" } ] },
    moins: { nom: "−", ops: ["−"], niv: [
      { b: [1, 9], r: [1, 9], max: 10, titre: "≤ 10" }, { b: [2, 9], r: [2, 9], max: 18, titre: "≤ 20" },
      { b: [2, 9], r: [5, 40], max: 50, titre: "≤ 50" }, { b: [11, 39], r: [5, 60], max: 100, titre: "≤ 100" },
      { b: [100, 400], r: [50, 600], pas: 10, max: 1000, titre: "≤ 1 000" } ] },
    fois: { nom: "×", ops: ["×"], niv: [
      { a: [2, 5], b: [2, 5], coeur: ["+", "−"], titre: "tables 2 à 5" }, { a: [2, 9], b: [2, 5], coeur: ["+", "−"], titre: "× 2 à 5" },
      { a: [2, 9], b: [2, 9], titre: "tables 2 à 9" }, { a: [2, 9], b: [10, 90], pasB: 10, coeur: ["+", "−"], titre: "× 10, 20…" },
      { a: [11, 25], b: [2, 6], coeur: ["+", "−"], titre: "× grands" } ] },
    compl: { nom: "compléments", ops: ["+"], niv: [
      { cible: 10, pas: 1, titre: "à 10" }, { cible: 20, pas: 1, titre: "à 20" }, { cible: 100, pas: 10, titre: "à 100 (dizaines)" },
      { cible: 100, pas: 1, titre: "à 100" }, { cible: 1000, pas: 50, titre: "à 1 000" } ] },
    defi: { nom: "Défi", ops: ["+", "−", "×"], niv: [
      { a: [2, 9], b: [2, 9], max: 18, ops: ["+", "−"], titre: "+ −" }, { a: [2, 9], b: [2, 9], max: 81, titre: "+ − ×" },
      { a: [2, 30], b: [2, 9], max: 100, titre: "≤ 100" }, { a: [10, 60], b: [2, 12], max: 200, titre: "≤ 200" },

  };
  var COULEURS = ["#ef476f", "#f78c3b", "#06a77d", "#118ab2", "#8e5bd1"], COEUR = "#264653";
  var NS = "http://www.w3.org/2000/svg";
  var el = function (id) { return document.getElementById(id); };
  var type = "plus", niv = 0, graine = 1, score = 0, partie = null, faits = 0, etats = [], geo = null, sonActif = true;

  function alea(g) { var s = g % 2147483647; if (s <= 0) s += 2147483646; return function () { s = s * 16807 % 2147483647; return (s - 1) / 2147483646; }; }

  function melanger(r, t) { for (var i = t.length - 1; i > 0; i--) { var j = Math.floor(r() * (i + 1)), w = t[i]; t[i] = t[j]; t[j] = w; } return t; }
  var cfg = function () { return TYPES[type].niv[niv]; };
  var opsDe = function (c) { return c.ops || TYPES[type].ops; };
  // les trios d'un ensemble de nombres (8 = 3 + 5 et 5 = 8 − 3 : le même trio)
  function trios(ns, ops) {
    var t = [], vus = {};
    for (var x = 0; x < ns.length; x++) for (var y = 0; y < ns.length; y++) for (var z = 0; z < ns.length; z++) {
      if (x === y || y === z || x === z) continue;
      ops.forEach(function (op) {
        var cle = [x, y, z].sort().join("");
        if (calc(ns[x], op, ns[y]) === ns[z] && !vus[cle]) { vus[cle] = 1; t.push({ a: x, b: y, c: z, op: op }); }
      });
    }
    return t;
  }
  // compléments : les paires qui font la cible
  function paires(ns, cible) { var t = []; for (var x = 0; x < ns.length; x++) for (var y = x + 1; y < ns.length; y++) if (ns[x] + ns[y] === cible) t.push({ a: x, b: y }); return t; }

  // un calcul a op b = c tiré dans le niveau
  function tirer(r, c, op) {
    var a, b;
    if (op === "+") { a = entre(r, c.a[0], c.a[1], c.pas); b = entre(r, c.b[0], c.b[1], c.pas); if (c.max && a + b > c.max) return null; return [a, b, a + b]; }
    if (op === "−") { if (c.r) { b = entre(r, c.b[0], c.b[1], c.pas); var res = entre(r, c.r[0], c.r[1], c.pas); if (res + b > c.max) return null; return [res + b, b, res]; }
      a = entre(r, c.a[0], c.a[1], c.pas); b = entre(r, c.b[0], c.b[1], c.pas); if (a - b < 2) return null; return [a, b, a - b]; }
    a = entre(r, c.a[0], c.a[1]); b = entre(r, c.b[0], c.b[1], c.pasB); if (c.max && a * b > c.max) return null; return [a, b, a * b];
  }

    var lo = Math.min.apply(null, ns), hi = Math.max.apply(null, ns), pas = c.pas || 1;
    return entre(r, Math.max(1, Math.floor(lo * 0.7)), Math.ceil(hi * 1.15) + 2, pas);
  }
  // un pétale : 5 nombres, un seul trio (ou une seule paire qui fait la cible) ; res : le nombre qui va au cœur
  function petale(r, c, voulu) {
    var ops = opsDe(c);

      var ns, res;

      else { var op = ops[Math.floor(r() * ops.length)], t = tirer(r, c, op); if (!t || t[0] === t[1] || t[0] === t[2] || t[1] === t[2]) continue;

        if (paires(vals, c.cible).length !== 1) continue;
        for (var k = 0; k < 5 && ok; k++) { var p = petale(r, c, vals[k]); if (!p) ok = false; else ps.push(p); }
      } else {
        if (!possibles) { possibles = []; for (var e = 0; e < 600; e++) { var op = ops[Math.floor(r() * ops.length)], t = tirer(r, c, op); if (t && possibles.indexOf(t[2]) === -1) possibles.push(t[2]); } }
        var res = []; while (res.length < 5) { var v2 = possibles[Math.floor(r() * possibles.length)]; if (res.indexOf(v2) === -1) res.push(v2); }
        if (trios(res, coeurOps).length !== 1) continue;

      }

    }
    return null;
  }

  // ---------- la fleur : le cœur et les 5 pétales collés sur ses côtés, la tige et les feuilles ----------
  function geometrie(cx, cy, R) {
    var V = []; for (var k = 0; k < 5; k++) { var an = (-90 + 72 * k) * Math.PI / 180; V.push([cx + R * Math.cos(an), cy + R * Math.sin(an)]); }

  }
  function triangles(P) { var t = []; for (var i = 0; i < 5; i++) t.push([P.centre, P.sommets[i], P.sommets[(i + 1) % 5]]); return t; }

  }

    F.appendChild(svg("path", { d: "M" + cx + " " + yHaut + " C " + (cx - R * 0.15) + " " + (yHaut + (yBas - yHaut) * 0.4) + " " + (cx + R * 0.15) + " " + (yHaut + (yBas - yHaut) * 0.7) + " " + cx + " " + yBas,
      stroke: "#2e8b3e", "stroke-width": e, fill: "none", "stroke-linecap": "round" }));

    F.appendChild(svg("path", { d: "M" + cx + " " + y1 + " q " + R * 0.9 + " " + -R * 0.55 + " " + R * 1.5 + " " + -R * 0.15 + " q " + -R * 0.6 + " " + R * 0.55 + " " + -R * 1.5 + " " + R * 0.15 + " z", fill: "#3fae5a", stroke: "#2e7d32", "stroke-width": 4 }));
    F.appendChild(svg("path", { d: "M" + cx + " " + y2 + " q " + -R * 0.9 + " " + -R * 0.55 + " " + -R * 1.5 + " " + -R * 0.15 + " q " + R * 0.6 + " " + R * 0.55 + " " + R * 1.5 + " " + R * 0.15 + " z", fill: "#4cbb64", stroke: "#2e7d32", "stroke-width": 4 }));
    F.appendChild(svg("ellipse", { cx: cx, cy: yBas + 6, rx: R * 1.6, ry: R * 0.18, fill: "#7cbf5e" }));
  }

  // ---------- les sons ----------
  var ctxSon = null;
  function note(f, t0, duree, typeO, vol) {
    var o = ctxSon.createOscillator(), g = ctxSon.createGain(), t = ctxSon.currentTime + t0;

  b.addEventListener("click", function () { avant = zones().map(function (z) { return [z, z.textContent, z.className]; }); }, true);   // avant le code du jeu
  b.addEventListener("click", function () {
    setTimeout(function () {
      var txt = "";
      avant.forEach(function (a) {
        var z = a[0], neuf = z.textContent;
        if (neuf !== a[1] && neuf.trim()) { txt = neuf; z.textContent = a[1]; z.className = a[2]; }
      });
      if (!txt) return;   // le jeu montre l'indice autrement : on le laisse faire
      bulle.textContent = txt.replace(/^\s*💡\s*/, ""); bulle.style.display = "block";
      clearTimeout(minuteur); minuteur = setTimeout(function () { bulle.style.display = "none"; }, 8000);
    }, 0);
  });
  document.addEventListener("pointerdown", function (e) { if (e.target !== b && e.target !== bulle) bulle.style.display = "none"; });
})();
</script>
<!-- /INDICE-COTE -->
