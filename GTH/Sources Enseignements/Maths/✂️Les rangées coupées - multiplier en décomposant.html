<style>
  /* ✂️ Les rangées coupées (maquette validée par Karim le 23/10, à la place de la machine à calculer) : multiplier en
     décomposant, mais c'est l'élève qui choisit OÙ couper pour que le calcul soit facile (66 × 6 → 60 + 6 ; 72 × 4 → 60 + 12).
     72 × 4 : les rangées de 72 cubes s'accumulent (1, 2, 3, 4 rangées), comme dans 🎲 Les rangées de cubes. On glisse le doigt
     de haut en bas entre deux cubes : la coupe traverse toutes les rangées, les morceaux s'écartent (60 | 12). On peut recouper,
     ou toucher une coupe pour la défaire. En × 2 chiffres (CM2), on coupe aussi les rangées (glisser de gauche à droite :
     35 × 12 = 35 × 10 + 35 × 2). Puis on tape le produit de chaque morceau, puis le total (petite calculette) ; le calcul
     s'écrit à droite, ligne par ligne. Toute coupe est juste : c'est le calcul qui devient facile, ou pas.
     Karim, 7/11 : le dessin remplit sa place ; des repères disent où tombent 10, 20, 30 (et ce qui reste) ; des morceaux
     pareils s'écrivent 360 × 2 avant le résultat (× 20 : d'abord × 10, puis × 2). */
  :root{ --fond:#eef5fb; --encre:#163a5f; --gris:#5c7a99; --bleu:#1e88e5; --talbot:#1f7a8c; --bien:#2e7d32; --faux:#c62828; }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0; color:var(--encre); font-family:"Baloo 2",Arial,sans-serif; overflow:hidden; height:100vh; display:flex; flex-direction:column; user-select:none; -webkit-user-select:none; touch-action:none;
    background:var(--fond); background-image:linear-gradient(rgba(30,136,229,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(30,136,229,.06) 1px,transparent 1px); background-size:40px 40px;}
  [hidden]{display:none !important;}
  .barre{display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:20px; padding:8px 26px; background:#163a5f; color:#fff; min-height:84px;}
  .titre{display:flex; align-items:center; gap:12px;} .titre svg{width:50px; height:50px;}
  .titre h1{font-weight:800; font-size:2rem; margin:0; color:#90caf9;}
  .onglets{display:flex; gap:10px; justify-content:center;}
  .onglets button{font:inherit; font-weight:800; font-size:1.3rem; padding:4px 20px; border-radius:12px; cursor:pointer; background:#24527f; color:#fff; border:none; white-space:nowrap;}
  .onglets button.actif{background:#2bd4b4; color:#0d2a44;}
  .droite{display:flex; align-items:center; gap:12px;}
  .score{display:flex; flex-direction:column; align-items:center; padding:2px 14px; border-radius:12px; background:#1f4b75; min-width:130px;}
  .score small{font-size:.8rem; font-weight:700; color:#b3d4f0; text-transform:uppercase; letter-spacing:.5px;}
  .score b{font-size:1.7rem; line-height:1.05; color:#fff;}
  .niveaux{display:flex; gap:4px;}
  .niveaux button{font:inherit; font-weight:700; font-size:1rem; padding:3px 14px; border-radius:999px; cursor:pointer; background:#fff; color:var(--gris); border:2px solid #cfd8dc;}
  .niveaux button.actif{background:var(--encre); color:#fff; border-color:var(--encre);}
  .btn-son{width:44px; height:44px; border-radius:50%; font-size:1.2rem; cursor:pointer; background:#fff; border:2px solid #cfd8dc;}
  .consigne{display:flex; justify-content:center; padding:14px 20px 0;}
  .consigne p{margin:0; font-weight:800; font-size:2.9rem; text-align:center; line-height:1.15;}
  .consigne p b{color:var(--bleu);}
  .consigne p .res{color:var(--bien);}
  .jeu{flex:1; min-height:0; display:grid; grid-template-columns:minmax(0,1fr) minmax(460px,30%); gap:10px; padding:0 120px 0 20px;}
  #dessin{width:100%; height:100%; touch-action:none; cursor:crosshair; display:block;}
  .calcul{font-weight:800; font-size:54px; line-height:1.38; padding-top:90px; white-space:nowrap; overflow:hidden; min-width:0;}
  .calcul div{animation:ligne .35s ease;} @keyframes ligne{from{opacity:0; transform:translateY(-10px)}}
  .calcul .vu{color:var(--talbot);} .calcul .fin{color:var(--bien);} .calcul .att{color:#b0bec5;}
  .calcul .trou{display:inline-block; min-width:2.6em; border:5px dashed #78909c; border-radius:14px; text-align:center; color:#78909c; line-height:1.05; padding-top:.06em;}
  .rangee{animation:recopie .3s ease-out;} @keyframes recopie{from{transform:translateY(-40px); opacity:0}}
  .secoue{animation:secoue .4s ease;} @keyframes secoue{0%,100%{transform:none}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}

  /* ✏️ mon calcul */
  .fond-pave{position:fixed; inset:0; background:rgba(20,30,45,.45); display:flex; align-items:center; justify-content:center; z-index:60;}
  .pave{background:#fff; border-radius:26px; padding:24px 30px; box-shadow:0 20px 50px rgba(0,0,0,.3); display:flex; flex-direction:column; gap:16px; align-items:center;}
  .pave h2{margin:0; font-size:1.8rem;}
  .pave-ecran{font-weight:800; font-size:4.2rem; line-height:1; min-width:380px; text-align:center; padding:14px 20px 4px; border:5px solid var(--encre); border-radius:18px; min-height:1.3em;}
  .pave-ecran.secoue{border-color:var(--faux);}
  .touches{display:grid; grid-template-columns:repeat(3,110px); gap:12px;}
  .touches button{font:inherit; font-weight:800; font-size:2.4rem; height:84px; border-radius:18px; border:3px solid #dfe5ea; background:#f6f8fa; cursor:pointer;}
  .touches button.ok{background:var(--talbot); color:#fff; border-color:var(--talbot); font-size:2rem;}
  .pave-bas button{font:inherit; font-weight:700; font-size:1.2rem; padding:8px 22px; border-radius:999px; border:2px solid #dfe5ea; background:#fff; cursor:pointer;}

  .bas{display:flex; align-items:center; justify-content:center; gap:18px; padding:4px 0 12px; min-height:70px;}
  .btn-indice{font:inherit; font-weight:700; font-size:1.2rem; padding:6px 16px; border-radius:999px; cursor:pointer; background:#fff8dc; border:2px solid #f1d27a; color:#7a5b00;}
  .verdict{min-height:3rem; font-size:2.1rem; font-weight:800; text-align:center;}
  .verdict:not(:empty){background:#fff; padding:0 24px; border-radius:14px;}
  .verdict.bien{color:var(--bien);} .verdict.faux{color:var(--faux);} .verdict.indice{color:#7a5b00;}
  .btn-suivant{font:inherit; font-weight:800; font-size:1.8rem; padding:2px 34px; border-radius:999px; cursor:pointer; background:var(--encre); color:#fff; border:none;}
</style>

<script>
/* 🧮 La calculette (Karim, 21/10) : pour répondre par un nombre, l'élève touche les touches d'une petite calculette posée sur le côté
   (plus d'étiquettes-réponses à glisser). Ce qu'il tape s'écrit dans la case du jeu ; dès que le nombre ne peut plus devenir la
   réponse, c'est faux ; dès qu'il est juste, le jeu continue. Installé par injecter.py.
   Calculette.ouvrir({ cible: élément, bon: 42, format: f, siBon: function () {}, siFaux: function (tapé) {} }) ; Calculette.fermer(). */
(function () {
  var st = document.createElement("style");
  st.textContent =
    "#calculette{position:fixed; right:110px; bottom:28px; display:none; flex-direction:column; gap:6px; padding:8px; background:#eceff1; border:2px solid #cfd8dc; border-radius:14px; z-index:55; opacity:.9}" +
    "#calculette .ecr{display:none}" +
    "#calculette .tou{display:grid; grid-template-columns:repeat(3,46px); gap:5px}" +
    "#calculette button{height:38px; border:1px solid #cfd8dc; border-radius:8px; background:#fff; color:#607d8b; font:700 19px 'Baloo 2',Arial,sans-serif; cursor:pointer}" +
    "#calculette button:active{transform:translateY(2px); box-shadow:none}" +
    "#calculette button.eff{color:#c62828}";
  document.head.appendChild(st);
  var box = document.createElement("div"); box.id = "calculette";
  box.innerHTML = '<div class="ecr"></div><div class="tou"></div>';
  document.addEventListener("DOMContentLoaded", function () { document.body.appendChild(box); });
  if (document.body) document.body.appendChild(box);
  var o = null, tape = "", texteAvant = "";
  ["7", "8", "9", "4", "5", "6", "1", "2", "3", "", "0", "⌫"].forEach(function (k) {
    var b = document.createElement("button"); b.type = "button"; b.textContent = k; if (!k) b.style.visibility = "hidden"; if (k === "⌫") b.className = "eff";
    b.addEventListener("click", function () { touche(k); }); box.querySelector(".tou").appendChild(b);
  });
  function montre() {
    box.querySelector(".ecr").textContent = tape;
    if (o && o.cible) o.cible.textContent = tape ? (o.format ? o.format(+tape) : tape) : texteAvant;
  }
  function touche(k) {
    if (!o || !k) return;
    if (k === "⌫") tape = tape.slice(0, -1); else if (tape.length < 7) tape += k;
    montre();
    var juste = String(o.bon);
    if (tape === juste) { var f = o.siBon; o = null; tape = ""; box.style.display = "none"; f(+juste); return; }
    if (tape && juste.indexOf(tape) !== 0) {
      var t = tape; if (o.siFaux) o.siFaux(+t);
      setTimeout(function () { tape = ""; montre(); }, 700);
    }
  }
  document.addEventListener("keydown", function (e) { if (!o) return; if (/^[0-9]$/.test(e.key)) touche(e.key); else if (e.key === "Backspace") touche("⌫"); });
  // si le jeu passe à autre chose (sa case disparaît), la calculette se range
  setInterval(function () { if (o && o.cible && !document.body.contains(o.cible)) window.Calculette.fermer(); }, 400);
  window.Calculette = {
    ouvrir: function (opt) { o = opt; tape = ""; texteAvant = opt.cible ? opt.cible.textContent : ""; box.style.display = "flex"; montre(); },
    fermer: function () { o = null; tape = ""; box.style.display = "none"; }
  };
})();
</script>
<!-- /CALCULETTE -->
<script>
(function () {
  // [nombre, nombre de rangées]. ≤ 100 : séances P2 de calcul mental (📅 4 : × 4, × 8 ; 📅 7 : 23 × 4, 51 × 8) et d'opérations,
  // plus 72 × 4 et 66 × 6 (exemples de Karim). Centaines : opérations 📅 1-4 (108 × 4, 125 × 4, 125 × 8, répertoire de 136),
  // 110 × 5 (banque) ; 145 × 4 et 115 × 6 ajoutés par moi. × 2 chiffres (CM2) : répertoires ERMEL de 25, 35 et 68 (📅 2),
  // 36 × 20 (calcul mental 📅 2) ; 24 × 15, 21 × 13, 18 × 12 et 16 × 14 ajoutés par moi.
  var LISTES = {
    "1chiffre-100": [[72, 4], [66, 6], [27, 4], [36, 4], [28, 4], [62, 4], [78, 4], [17, 8], [23, 8], [43, 8], [51, 8], [96, 8], [27, 6], [45, 7], [43, 6], [71, 6], [24, 4], [16, 8]],
    "1chiffre-centaines": [[108, 4], [125, 4], [136, 3], [136, 4], [136, 5], [136, 6], [125, 8], [110, 5], [145, 4], [115, 6]],
    "dizaines": [[36, 20], [8, 20], [7, 20], [25, 20], [12, 20], [9, 30], [6, 30], [15, 30], [7, 40], [8, 30], [45, 20], [23, 30]],   // Karim, 7/11 : × 20 = deux paquets de 10 rangées
    "2chiffres": [[35, 12], [25, 12], [68, 12], [35, 14], [36, 20], [25, 16], [68, 11], [35, 21], [24, 15], [21, 13], [18, 12], [16, 14]]
  };
  var el = function (id) { return document.getElementById(id); };
  var NS = "http://www.w3.org/2000/svg";
  var onglet = "1chiffre", niveau = "100", idx = 0, score = 0, sonActif = true, ctx = null;
  var N = 0, M = 0, vc = [], hc = [], blocs = [], iBloc = 0, etape = "", erreurs = 0, total = 0, reste = [], lignes = [], minuteurs = [];
  function n(x) { return String(x).replace(/\B(?=(\d{3})+(?!\d))/g, " "); }
  function son(type) {
    if (!sonActif) return;
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      var t = ctx.currentTime, notes = type === "bien" ? [[784, 0, .3], [988, .08, .3], [1175, .16, .45]] : type === "coupe" ? [[1800, 0, .05, "square"], [900, .04, .06, "square"]]
        : type === "pose" ? [[523, 0, .12], [659, .08, .2]] : type === "rangee" ? [[440, 0, .06]] : [[300, 0, .35, "sine", 140]];
      notes.forEach(function (q) { var o = ctx.createOscillator(), g = ctx.createGain(); o.type = q[3] || "triangle"; o.frequency.setValueAtTime(q[0], t + q[1]);
        if (q[4]) o.frequency.exponentialRampToValueAtTime(q[4], t + q[1] + q[2]);
        o.connect(g); g.connect(ctx.destination); g.gain.setValueAtTime(.0001, t + q[1]); g.gain.exponentialRampToValueAtTime(type === "rangee" ? .04 : .12, t + q[1] + .01);
        g.gain.exponentialRampToValueAtTime(.0001, t + q[1] + q[2]); o.start(t + q[1]); o.stop(t + q[1] + q[2] + .05); });
    } catch (e) {}
  }
  function cle() { return onglet !== "1chiffre" ? onglet : "1chiffre-" + niveau; }
  function majScore() {
    var r = 0, k = "rangees-coupees-record-" + cle(); try { r = parseInt(localStorage.getItem(k), 10) || 0; } catch (e) {}
    if (score > r) { r = score; try { localStorage.setItem(k, String(r)); } catch (e) {} }
    el("score").textContent = score; el("record").textContent = r;
  }
  function verdict(t, c) { el("verdict").textContent = t; el("verdict").className = "verdict" + (c ? " " + c : ""); }
  function consigne(h) { el("consigne").innerHTML = h; }

  // ---------- la géométrie : cubes, paquets de 10, écarts aux coupes ----------
  var W = 1120, X0 = 120, Y0 = 92, HMAX = 470, ECART = 34, G = {};
  function geo() {
    var paquets = Math.floor((N - 1) / 10), lignesPaquets = Math.floor((M - 1) / 10);
    // la hauteur disponible suit la forme de l'écran : les rangées s'étirent au lieu de laisser le bas vide
    var bx = el("dessin").getBoundingClientRect(), ratio = bx.width > 100 && bx.height > 100 ? bx.height / bx.width : 0.6;
    var hmax = Math.max(HMAX, Math.min(1000, ratio * (W + 120) - 300));
    var c = Math.min(46, (W - X0 - 3 * ECART) / (N + 0.35 * paquets));
    var h = Math.min(c * 6, 92, (hmax - 2 * ECART) / (M * 1.18 + 0.25 * lignesPaquets));
    G = { c: c, h: h, g: c * 0.35, gl: h * 0.18, gp: h * 0.25 };
    cadrer();
  }
  function cadrer() {   // le cadre serre les cubes, leurs repères et les produits : le dessin remplit sa place
    var x0 = X0 - (M <= 10 && !hc.length ? 160 : 110), x1 = xCol(N - 1) + G.c + (M > 10 ? 90 : 60), y0 = Y0 - 115, y1 = yRang(M - 1) + G.h + (hc.length ? 40 : 190);
    el("dessin").setAttribute("viewBox", [x0, y0, x1 - x0, y1 - y0].join(" "));
  }
  function avant(t, k) { var a = 0; t.forEach(function (x) { if (x <= k) a++; }); return a; }
  function xCol(i) { return X0 + i * G.c + Math.floor(i / 10) * G.g + avant(vc, i) * ECART; }
  function yRang(r) { return Y0 + r * G.h * 1.18 + Math.floor(r / 10) * G.gp + avant(hc, r) * ECART; }
  function segs(cuts, tot) { var b = [0].concat(cuts.slice().sort(function (a, c) { return a - c; })).concat([tot]), s = []; for (var i = 0; i < b.length - 1; i++) s.push([b[i], b[i + 1]]); return s; }
  var COUL = [["#2bd4b4", "#13907a"], ["#ffb74d", "#e08a00"], ["#9575cd", "#5e35b1"], ["#f06292", "#c2185b"], ["#4fc3f7", "#0288d1"], ["#aed581", "#689f38"]];

  // ---------- le dessin ----------
  function S(t, a, txt) { var e = document.createElementNS(NS, t); for (var k in a) e.setAttribute(k, a[k]); if (txt !== undefined) e.textContent = txt; return e; }
  function dessiner(nbRangees) {
    var svg = el("dessin"); svg.innerHTML = "";
    var R = nbRangees === undefined ? M : nbRangees, cs = segs(vc, N), rs = segs(hc, M);
    // les rangées : une à la fois
    for (var r = 0; r < R; r++) {
      var g = S("g", { "class": r === R - 1 && nbRangees !== undefined ? "rangee" : "" }), y = yRang(r), ri = rs.findIndex(function (s) { return r >= s[0] && r < s[1]; });
      for (var i = 0; i < N; i++) {
        var ci = cs.findIndex(function (s) { return i >= s[0] && i < s[1]; }), k = (ci + ri * 2) % COUL.length;
        g.appendChild(S("rect", { x: xCol(i) + .5, y: y, width: Math.max(G.c - 1.6, 1), height: G.h, rx: Math.min(3, G.c / 4), fill: COUL[k][0], stroke: COUL[k][1], "stroke-width": G.c > 6 ? 1.4 : .6 }));
      }
      if (M <= 10 && !hc.length) g.appendChild(S("text", { x: X0 - 14, y: y + G.h / 2 + 10, "text-anchor": "end", "font-size": 28, "font-weight": 700, fill: "#5c7a99" }, n(N) + " × " + (r + 1)));
      svg.appendChild(g);
    }
    if (nbRangees !== undefined) return;
    // les paquets de 10 : un trait gris au-dessus de chaque dizaine complète
    for (var b = 0; b + 10 <= N; b += 10) {
      var xa = xCol(b), xb = xCol(b + 9) + G.c - 1.6;
      if (avant(vc, b + 9) !== avant(vc, b)) continue;
      svg.appendChild(S("line", { x1: xa + 1, y1: Y0 - 12, x2: xb - 1, y2: Y0 - 12, stroke: "#90a4ae", "stroke-width": 4, "stroke-linecap": "round" }));
    }
    // les repères (Karim, 7/11) : où tombent 10, 20, 30, et la fin ; ce qui reste après la dernière dizaine se voit
    var marques = function (tot) { var L = []; for (var v = 10; v < tot; v += 10) L.push(v); L.push(tot); return L; };
    if (N > 10) marques(N).forEach(function (v) {
      var x = v >= N ? xCol(N - 1) + G.c : (xCol(v - 1) + G.c + xCol(v)) / 2, fin = v === N, coul = fin ? "#163a5f" : "#5c7a99";

    ".menu-btn.fixe{position:fixed; top:10px; right:12px; z-index:150; box-shadow:0 4px 14px rgba(0,0,0,.15);}" +

    ".menu-panneau{position:fixed; top:76px; right:16px; z-index:200; background:#fff; color:#1f2a33; border-radius:18px; box-shadow:0 18px 50px rgba(0,0,0,.28); padding:16px 18px;" +
    "  display:flex; flex-direction:column; align-items:flex-start; gap:12px; max-width:min(620px, 92vw); max-height:80vh; overflow:auto;}" +
    ".menu-panneau[hidden]{display:none !important;}" +
    ".menu-panneau h4{margin:0; font-family:sans-serif; font-size:.85rem; text-transform:uppercase; letter-spacing:.6px; color:#6d7a85;}" +
    ".menu-panneau > *{position:static !important; margin:0 !important;}" +
    ".menu-panneau > div,.menu-panneau > nav{display:flex; flex-wrap:wrap; gap:8px;}";
  document.head.appendChild(st);
  function installer() {
    var autres = [];
    if (CONF.cacher) CONF.cacher.forEach(function (s) { document.querySelectorAll(s).forEach(function (e) { if (autres.indexOf(e) === -1) autres.push(e); }); });
    else { var d = document.querySelector(".barre .droite"); if (d) autres = Array.prototype.filter.call(d.children, function (e) { return !e.classList.contains("score"); }); }
    if (!autres.length) return;
    var btn = document.createElement("button"); btn.type = "button"; btn.className = "menu-btn"; btn.title = "Niveaux et réglages"; btn.textContent = "☰";
    var pan = document.createElement("div"); pan.className = "menu-panneau"; pan.hidden = true;
    var t = document.createElement("h4"); t.textContent = "Niveaux et réglages"; pan.appendChild(t);
    autres.forEach(function (e) { pan.appendChild(e); });
    var ancre = document.querySelector(CONF.ancre || ".barre .droite");
    if (ancre) ancre.appendChild(btn); else { btn.classList.add("fixe"); document.body.appendChild(btn); }
    document.body.appendChild(pan);
    function ouvrir(o) { pan.hidden = !o; btn.classList.toggle("ouvert", o); }
    btn.addEventListener("click", function (e) { e.stopPropagation(); ouvrir(pan.hidden); });
    // un niveau choisi, ou une fenêtre ouverte (✏️, 🖨️) : le menu se referme ; on garde le menu ouvert pour choisir un type de jeu
    pan.addEventListener("click", function (e) { var b = e.target.closest("button"); if (b && !b.closest(CONF.garderOuvert || ".types")) setTimeout(function () { ouvrir(false); }, 120); });
    document.addEventListener("pointerdown", function (e) { if (!pan.hidden && !pan.contains(e.target) && e.target !== btn) ouvrir(false); });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", installer); else installer();
})();
</script>
<!-- /MENU -->
<!-- INDICE-COTE -->
<script>
/* 💡 sur le côté (Karim, 21/10) : dans les jeux qui ont un bouton « 💡 Indice » (.btn-indice), le bouton devient une ampoule seule,
   collée au bord droit de l'écran, à mi-hauteur ; l'indice s'ouvre dans une bulle à côté d'elle, jamais sous le jeu.
   Le jeu garde son propre code : au toucher, on regarde quel texte il vient d'écrire (zone #indice, ou la ligne de message),
   on le reprend dans la bulle et on remet la zone comme avant. Installé par injecter.py. */
(function () {
  var b = document.querySelector(".btn-indice"); if (!b) return;
  var st = document.createElement("style");
  st.textContent =
    ".btn-indice.cote{position:fixed !important; right:18px; top:50%; transform:translateY(-50%); width:76px; height:76px; padding:0 !important; border-radius:50% !important;" +
    " font-size:40px !important; line-height:1; z-index:60; margin:0 !important; display:flex; align-items:center; justify-content:center}" +
    "#bulle-cote{position:fixed; right:110px; top:50%; transform:translateY(-50%); max-width:520px; background:#fff8c4; border:2px solid #d4b106; border-radius:18px;" +
    " padding:16px 22px; font-size:26px; line-height:1.35; z-index:60; box-shadow:0 6px 18px rgba(0,0,0,.15); display:none}" +
    "#bulle-cote::after{content:''; position:absolute; right:-14px; top:50%; margin-top:-12px; border:12px solid transparent; border-left:14px solid #d4b106; border-right:none}";
  document.head.appendChild(st);
  b.classList.add("cote"); b.textContent = "💡"; b.title = "Indice"; document.body.appendChild(b);
  var bulle = document.createElement("div"); bulle.id = "bulle-cote"; document.body.appendChild(bulle);
  var zones = function () { return Array.prototype.slice.call(document.querySelectorAll("#indice, .indice, #message, .message, #verdict, .verdict, #consigne-aide")); };
  var avant = [], minuteur = null;
  b.addEventListener("click", function () { avant = zones().map(function (z) { return [z, z.textContent, z.className]; }); }, true);   // avant le code du jeu
  b.addEventListener("click", function () {
    setTimeout(function () {
      var txt = "";
      avant.forEach(function (a) {
        var z = a[0], neuf = z.textContent;
        if (neuf !== a[1] && neuf.trim()) { txt = neuf; z.textContent = a[1]; z.className = a[2]; }
      });
      if (!txt) return;   // le jeu montre l'indice autrement : on le laisse faire
      bulle.textContent = txt.replace(/^\s*💡\s*/, ""); bulle.style.display = "block";
      clearTimeout(minuteur); minuteur = setTimeout(function () { bulle.style.display = "none"; }, 8000);
    }, 0);
  });
  document.addEventListener("pointerdown", function (e) { if (e.target !== b && e.target !== bulle) bulle.style.display = "none"; });
})();
</script>
<!-- /INDICE-COTE -->
