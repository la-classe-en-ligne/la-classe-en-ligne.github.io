<!--
  🌱 Le groupe nominal qui grandit — le groupe nominal et ses expansions, P2 📅 4, 5 et 6 (GTH v2 : donnees/seances/francais/fr-s4-grammaire.js,
  fr-s5-grammaire.js, fr-s6-orthographe.js). Maquette validée par Karim le 28/10 (Rapports/Jeux de la P2 — ce qui existe, ce qui manque.md, C n° 4).
  Termes du guide Eduscol (Terminologie grammaticale, p. 19 et 94) et des séances : groupe nominal, nom noyau, déterminant, adjectif, complément du nom.
  Univers : la serre. Le déterminant = le pot, le nom noyau = la tige, l'adjectif = une feuille, le complément du nom = une branche. La plante
  grandit avec les expansions ; on peut la tailler (enlever adjectifs et compléments du nom) : il reste un groupe nominal minimal ; sans la tige
  ou sans le pot, ce n'est plus un groupe nominal.
  Gestes (glisser, ou toucher puis toucher) : l'arrosoir sur le nom noyau ; les étiquettes sous les mots ; la feuille accordée sur la plante ;
  les mots au compost (tailler).
  Onglets : Le noyau (#noyau), D, N, Adj (#dna), J'accroche un adjectif (#adjectif : choisir la forme accordée parmi 4), Le complément du nom
  (#cdn : feuille ou branche ?), Défi (#defi : tailler jusqu'au groupe nominal minimal). Le défi « faire pousser jusqu'au modèle » de la
  maquette n'est pas fait : J'accroche un adjectif le couvre en partie.
  Contenu : manuel P2 p. 65-66, 72-73, 78-79, 84 (= exercices différenciés P2) et séances 📅 4-5 ; pour J'accroche un adjectif, la banque
  donne les noms (« enrichis ») mais pas les adjectifs : les adjectifs sont de moi (marqués). Hors ligne (ENI, Chromebook). Sans son.
-->

const NATURE = { D: "déterminant", N: "nom", A: "adjectif", C: "complément du nom" };
const ICONE = {   // le pot, la tige, la feuille, la branche
  D: '<svg viewBox="0 0 64 64"><path d="M12 22h40l-6 34H18z" fill="#d84315"/><rect x="8" y="16" width="48" height="10" rx="3" fill="#bf360c"/></svg>',
  N: '<svg viewBox="0 0 64 64"><path d="M32 60V8" stroke="#388e3c" stroke-width="8" stroke-linecap="round"/><circle cx="32" cy="8" r="6" fill="#81c784"/></svg>',
  A: '<svg viewBox="0 0 64 64"><path d="M8 40C20 10 50 8 58 12 54 30 36 52 8 40z" fill="#66bb6a" stroke="#2e7d32" stroke-width="3"/><path d="M10 40L50 16" stroke="#2e7d32" stroke-width="3"/></svg>',
  C: '<svg viewBox="0 0 64 64"><path d="M6 50C24 44 40 30 58 10" stroke="#8d6e63" stroke-width="7" fill="none" stroke-linecap="round"/><ellipse cx="34" cy="26" rx="9" ry="5" fill="#81c784" transform="rotate(-40 34 26)"/><ellipse cx="50" cy="16" rx="8" ry="4" fill="#81c784" transform="rotate(-30 50 16)"/></svg>',
  arrosoir: '<svg viewBox="0 0 64 64"><path d="M14 26h28v28H14z" fill="#4fc3f7" stroke="#0277bd" stroke-width="3"/><path d="M42 32l16-12" stroke="#0277bd" stroke-width="5"/><circle cx="58" cy="20" r="4" fill="#0277bd"/><path d="M18 26c0-12 20-12 20 0" stroke="#0277bd" stroke-width="4" fill="none"/></svg>'
};
const lire = s => s.split("|").map((b, i) => ({ id: "b" + i, r: b[0], t: b.slice(2) }));
const etat = { o: "noyau", i: 0, score: 0, blocs: [], lab: {}, taille: {}, fini: false };
window.SERRE = etat;
const $ = id => document.getElementById(id);
const mem = { lire(k) { try { return +localStorage.getItem(k) || 0; } catch (e) { return 0; } }, ecrire(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const cleRecord = () => "serre-record-" + etat.o;
function afficheScore() { $("score").textContent = etat.score; $("record").textContent = mem.lire(cleRecord()); }
function marque() { etat.score++; if (etat.score > mem.lire(cleRecord())) mem.ecrire(cleRecord(), etat.score); afficheScore(); }
function verdict(t, cls) { const v = $("verdict"); v.textContent = t; v.className = cls || ""; }
function consigne(h) { $("consigne").innerHTML = "<span>" + h + "</span>"; }
function bulle(t) { const b = $("bulle"); b.textContent = t; b.style.display = "block"; clearTimeout(bulle.t); bulle.t = setTimeout(() => b.style.display = "none", 8000); }
let minuteur = 0; const plusTard = (f, ms) => { clearTimeout(minuteur); minuteur = setTimeout(f, ms || 2000); };
const ex = () => L[etat.o][etat.i % L[etat.o].length];
const echelle = () => +($("scene").dataset.ech || 1);
const gnTexte = bs => bs.map(b => b.t).join(" ").replace(/' /g, "'").replace(/^de ([aeéèiouyh])/i, "d'$1");

// ---------- la plante : un pot, une tige, une feuille par adjectif, une branche par complément du nom ----------
function dessinePlante(nA, nC, avecN, avecD, tombe) {
  let s = "";
  const h = 200 + (nA + nC) * 70, haut = 560 - h;
  if (avecD !== false) s += '<path d="M150 560h220l-30 90H180z" fill="#d84315"/><ellipse cx="260" cy="541" rx="116" ry="10" fill="#4e342e"/><rect x="134" y="540" width="252" height="34" rx="8" fill="#bf360c"/>';
  if (avecN !== false) {
    s += '<path d="M260 548C' + (tombe ? '330 520 420 540 470 600' : '262 460 256 380 260 ' + haut) + '" stroke="#388e3c" stroke-width="16" fill="none" stroke-linecap="round"/>';
    if (!tombe) { let k = 0;
      for (let j = 0; j < nA + nC; j++) {
        const y = 520 - (j + 1) * (h - 60) / (nA + nC + .5), cote = j % 2 ? 1 : -1;
        if (j < nA) s += '<path d="M260 ' + y + 'C' + (260 + cote * 60) + ' ' + (y - 70) + ' ' + (260 + cote * 150) + ' ' + (y - 50) + ' ' + (260 + cote * 170) + ' ' + (y - 40) + 'C' + (260 + cote * 130) + ' ' + (y + 10) + ' ' + (260 + cote * 60) + ' ' + (y + 20) + ' 260 ' + y + 'z" fill="#66bb6a" stroke="#2e7d32" stroke-width="3"/>';
        else { s += '<path d="M260 ' + y + 'Q' + (260 + cote * 90) + ' ' + (y - 30) + ' ' + (260 + cote * 200) + ' ' + (y - 90) + '" stroke="#8d6e63" stroke-width="10" fill="none" stroke-linecap="round"/>';
          s += '<ellipse cx="' + (260 + cote * 150) + '" cy="' + (y - 68) + '" rx="22" ry="11" fill="#81c784"/><ellipse cx="' + (260 + cote * 200) + '" cy="' + (y - 92) + '" rx="20" ry="10" fill="#81c784"/>'; }
        k++;
      }
      s += '<circle cx="260" cy="' + haut + '" r="14" fill="#81c784"/>';
    }
  }
  $("plante").innerHTML = s;
}
function plante() {   // la plante dit ce qui est trouvé (ou présent) dans le groupe nominal
  const bs = etat.blocs.filter(b => !etat.taille[b.id]);
  const vu = etat.o === "noyau" ? (etat.fini ? bs : bs.filter(b => b.r !== "A" && b.r !== "C")) : bs;
  dessinePlante(vu.filter(b => b.r === "A").length, vu.filter(b => b.r === "C").length, true, true, false);
}
// ---------- un groupe nominal ----------
function nouvel() {
  clearTimeout(minuteur); verdict(""); etat.fini = false; etat.lab = {}; etat.taille = {};
  const E = ex(); etat.blocs = lire(E[0]);
  $("compost").style.display = etat.o === "defi" ? "flex" : "none"; $("outils").style.display = etat.o === "defi" ? "none" : "flex";
  const O = $("outils");
  if (etat.o === "noyau") O.innerHTML = outil("arrosoir", "L'arrosoir", ICONE.arrosoir);
  else if (etat.o === "dna") O.innerHTML = outil("D", "Déterminant (le pot)", ICONE.D) + outil("N", "Nom (la tige)", ICONE.N) + outil("A", "Adjectif (la feuille)", ICONE.A);
  else if (etat.o === "cdn") { O.innerHTML = outil("A", "Adjectif (la feuille)", ICONE.A) + outil("C", "Complément du nom (la branche)", ICONE.C); etat.blocs.forEach(b => { if (b.r === "D" || b.r === "N") etat.lab[b.id] = b.r; }); }
  else if (etat.o === "adjectif") { const F = E[1], formes = [...new Set(F)]; O.innerHTML = formes.sort(() => Math.random() - .5).map(f => outil("forme:" + f, f, ICONE.A, "feuille-adj")).join(""); }
  const c = { noyau: "Arrose le <span class=\"q\">nom noyau</span>", dna: "Pose déterminant, nom ou adjectif sur chaque mot", adjectif: "Accroche la feuille qui <span class=\"q\">s'accorde</span> avec le nom", cdn: "Adjectif ou complément du nom ? Pose la feuille ou la branche", defi: "Taille la plante : garde un <span class=\"q\">groupe nominal minimal</span>" };
  consigne(c[etat.o]); dessiner();
}
function outil(k, t, ic, cl) { return '<div class="outil ' + (cl || "") + '" data-k="' + k + '">' + ic + '<span>' + t + '</span></div>'; }
function dessiner() {
  const bs = etat.blocs.filter(b => !etat.taille[b.id]);
  $("gn").innerHTML = bs.map(b => '<div class="mot' + (etat.o === "noyau" && etat.fini && b.r === "N" ? " noyau" : "") + '" data-id="' + b.id + '">' + b.t
    + (etat.lab[b.id] ? '<div class="lab">' + ICONE[etat.lab[b.id]] + '</div><div class="nature">' + NATURE[etat.lab[b.id]] + '</div>' : "") + '</div>').join("");
  $("lecture").textContent = gnTexte(bs);
  const w = $("gn").scrollWidth; $("gn").style.scale = w > 1260 ? String(1260 / w) : "1";
  plante();
}
// ---------- les gestes ----------
let tient = null, choix = null;
const source = el => el && el.closest && el.closest(etat.o === "defi" ? ".mot" : ".outil");
function choisir(e) { if (choix) choix.classList.remove("choisi"); choix = e; if (e) e.classList.add("choisi"); }
document.addEventListener("pointerdown", ev => { const s = source(ev.target); if (!s || etat.fini) return; ev.preventDefault(); tient = { el: s, x: ev.clientX, y: ev.clientY, vole: null }; });
document.addEventListener("pointermove", ev => {
  if (!tient) return;
  if (!tient.vole && Math.hypot(ev.clientX - tient.x, ev.clientY - tient.y) > 12) {
    const r = tient.el.getBoundingClientRect(), v = tient.el.cloneNode(true); v.classList.add("vole"); v.classList.remove("choisi");
    v.style.transform = "scale(" + (r.width / tient.el.offsetWidth) + ")"; document.body.appendChild(v); tient.vole = v; tient.dx = ev.clientX - r.left; tient.dy = ev.clientY - r.top; choisir(null);
  }
  if (tient.vole) { tient.vole.style.left = (ev.clientX - tient.dx) + "px"; tient.vole.style.top = (ev.clientY - tient.dy) + "px"; }
});
document.addEventListener("pointerup", ev => {
  const t = tient; tient = null;
  if (t && t.vole) { t.vole.remove(); return deposer(t.el, document.elementFromPoint(ev.clientX, ev.clientY)); }
  if (t) { choisir(choix === t.el ? null : t.el); return; }
  if (choix) { const c = choix; choisir(null); deposer(c, ev.target); }
});
function deposer(src, cible) {
  if (!cible || etat.fini) return;
  if (etat.o === "defi") { if (cible.closest("#compost")) tailler(src.dataset.id); return; }
  const k = src.dataset.k, m = cible.closest(".mot");
  if (etat.o === "adjectif") { if (cible.closest("#plante") || cible.closest("#gn") || m) accroche(k.slice(6), src); return; }
  if (!m) return;
  const b = etat.blocs.find(x => x.id === m.dataset.id);
  if (etat.o === "noyau") return arroser(b, m);
  return etiqueter(b, k, m);
}
const non = (m, msg) => { verdict(msg, "ko"); if (m) { m.classList.add("ko"); setTimeout(() => m.classList.remove("ko"), 1000); } };
// ---------- les actions ----------
function arroser(b, m) {
  if (b.r !== "N") {
    const sans = gnTexte(etat.blocs.filter(x => x.id !== b.id));
    return non(m, b.r === "D" ? "🤪 « " + b.t + " » est le pot : un déterminant, pas le nom." : "🤪 Sans « " + b.t + " », il reste « " + sans + " » : ce n'est pas le noyau.");
  }
  etat.fini = true; dessiner(); marque();
  verdict("✅ « " + b.t + " » est le nom noyau : tout le groupe nominal pousse autour de lui.", "ok"); suite();
}
function etiqueter(b, k, m) {
  if (etat.lab[b.id]) return;
  if (b.r !== k) return non(m, etat.o === "cdn" ? (k === "A" ? "🤪 « " + b.t + " » commence par une préposition : c'est une branche." : "🤪 « " + b.t + " » est un seul mot qui s'accorde avec le nom : c'est une feuille.") : "🤪 « " + b.t + " » n'est pas " + (k === "A" ? "un adjectif" : k === "N" ? "un nom" : "un déterminant") + ".");
  etat.lab[b.id] = k; verdict(""); dessiner();
  if (etat.blocs.every(x => etat.lab[x.id])) { etat.fini = true; marque(); verdict("✅ Chaque mot a sa nature.", "ok"); suite(); }
}
function accroche(forme, el) {
  const E = ex(), F = E[1], col = { ms: 0, fs: 1, mp: 2, fp: 3 }[E[3]];
  const bonnes = []; for (let j = col; j < F.length; j += 4) bonnes.push(F[j]);
  const N = etat.blocs.find(b => b.r === "N");
  if (!bonnes.includes(forme)) { el.classList.add("fane"); setTimeout(() => el.classList.remove("fane"), 1000); return non(null, "🤪 La feuille fane : « " + forme + " » ne s'accorde pas avec « " + N.t + " »."); }
  const A = { id: "adj", r: "A", t: forme }, k = etat.blocs.indexOf(N);
  etat.blocs.splice(E[2] === "avant" ? k : k + 1, 0, A);
  etat.fini = true; dessiner(); marque();
  verdict("✅ « " + gnTexte(etat.blocs) + " » : l'adjectif s'accorde avec le nom.", "ok"); suite();
}
function tailler(id) {
  const b = etat.blocs.find(x => x.id === id), m = document.querySelector('.mot[data-id="' + id + '"]');
  if (b.r === "N" || b.r === "D") { dessinePlante(0, 0, b.r !== "N", b.r !== "D", b.r === "N"); setTimeout(plante, 1200);
    return non(m, b.r === "N" ? "🤪 Sans la tige, la plante tombe : sans le nom noyau, plus de groupe nominal." : "🤪 Sans le pot, la plante ne tient pas : il faut le déterminant."); }
  etat.taille[id] = true; verdict(""); dessiner();
  if (etat.blocs.every(x => etat.taille[x.id] || x.r === "N" || x.r === "D")) { etat.fini = true; marque(); verdict("✅ « " + gnTexte(etat.blocs.filter(x => !etat.taille[x.id])) + " » : le groupe nominal minimal, un déterminant et un nom.", "ok"); suite(); }
}
function suite() { consigne("Bravo !"); plusTard(() => { etat.i++; nouvel(); }, 2400); }
// l'indice donne la méthode de la classe, jamais la réponse
$("indice").onclick = () => {
  const c = {
    noyau: "J'enlève les mots un par un : si le groupe nominal reste un groupe nominal, ce n'était pas le noyau. Le nom noyau, on ne peut pas l'enlever ; on peut mettre « un » ou « le » devant.",
    dna: "Le déterminant est devant le nom (un, le, ce, mon…). Le nom : je peux mettre « un » ou « le » devant. L'adjectif dit comment est le nom, et il s'accorde avec lui.",
    adjectif: "Je dis le genre et le nombre du nom (masculin ou féminin, singulier ou pluriel), puis je choisis la forme de l'adjectif qui va avec.",
    cdn: "L'adjectif est un seul mot qui s'accorde avec le nom. Le complément du nom commence par une préposition (de, à, en, sans…) et ne s'accorde pas.",
    defi: "Je peux enlever les adjectifs et les compléments du nom : il reste un groupe nominal. Le déterminant et le nom noyau restent toujours."
  };
  bulle(c[etat.o]);
};
// ---------- démarrer ----------
function ouvre(o) {
  etat.o = o; etat.i = 0; etat.score = 0; choisir(null);
  document.querySelectorAll(".onglets button").forEach(b => b.classList.toggle("on", b.dataset.o === o));
  history.replaceState(null, "", "#" + o);
  afficheScore(); $("bulle").style.display = "none"; nouvel();
}
document.querySelectorAll(".onglets button").forEach(b => b.onclick = () => ouvre(b.dataset.o));
function ajuste() {
  const e = Math.min(innerWidth / 1920, innerHeight / 1080), s = $("scene");
  s.style.transform = "scale(" + e + ")"; s.style.left = ((innerWidth - 1920 * e) / 2) + "px"; s.style.top = ((innerHeight - 1080 * e) / 2) + "px"; s.dataset.ech = e;
}
addEventListener("resize", ajuste); ajuste();
function depuisLien() { const m = location.hash.slice(1); ouvre(L[m] ? m : "noyau"); }
addEventListener("hashchange", depuisLien);
depuisLien();
window.SERRE_API = { L, lire, ex };
