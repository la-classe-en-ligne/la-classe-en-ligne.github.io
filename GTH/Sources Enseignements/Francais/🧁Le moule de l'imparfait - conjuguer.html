<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le moule de l'imparfait</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M14 34h36l-5 24H19z' fill='%23f48fb1'/%3E%3Cpath d='M12 34c0-12 8-20 20-20s20 8 20 20z' fill='%23fff3e0' stroke='%23e0a050' stroke-width='3'/%3E%3Ccircle cx='32' cy='12' r='5' fill='%23e53935'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap">
<style>
  /* 🧁 Le moule de l'imparfait (maquette validée par Karim le 23/10 : « mets un univers de pâtisserie »). La pâtisserie : mur carrelé,
     plan de travail, la recette du jour, le bol de pâte, un moule de 6 caissettes (une par personne), le four, les cupcakes.
     Je fabrique : « nous mangeons » → couper -ons : la pâte = le radical (mange-) ; poser chaque terminaison dans la caissette de sa
     personne (ais, ais, ait, ions, iez, aient) ; verser la pâte ; au four ; les cupcakes sortent avec le verbe écrit dessus.
     La méthode de la classe (séance 📅 6) : « je dis nous au présent, j'enlève -ons, j'ajoute -ais, -ais, -ait, -ions, -iez, -aient ».
     Je reconnais (📅 3) : poser sur le présentoir le cupcake à l'imparfait (marque -ai- / -i-). Les pièges (📅 4-5) : -ger, -cer, -ier,
     -yer, être (ét-), avoir. Défi (📅 7) : présent ou imparfait selon le moment de la phrase.
     Verbes et formes : séances de conjugaison 📅 3 à 7 (fiches P2 p. 4, 8, 9, 15, 18-19, 24-25 ; mémo CONJ 6 à 9 ; révisions). Les autres
     formes des cupcakes de « Je reconnais » (présent, futur) et 8 phrases du Défi sont écrites par moi. */
  :root{ --encre:#4e342e; --gris:#8d6e63; --rose:#f48fb1; --rose-f:#c2185b; --creme:#fff3e0; --pate:#f6c27a; --pate-f:#c27c2c; --rouge:#c62828; --bien:#2e7d32; --faux:#c62828; }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0; color:var(--encre); font-family:"Baloo 2",system-ui,sans-serif; overflow:hidden; height:100vh; display:flex; flex-direction:column; user-select:none; -webkit-user-select:none; touch-action:none;
    background:#fdeef3; background-image:linear-gradient(rgba(255,255,255,.75) 3px,transparent 3px),linear-gradient(90deg,rgba(255,255,255,.75) 3px,transparent 3px); background-size:70px 70px;}
  [hidden]{display:none !important;}
  .barre{display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:20px; padding:8px 26px; background:#fff; border-bottom:3px solid #f8d7e3;}
  .titre{display:flex; align-items:center; gap:12px;} .titre svg{width:50px; height:50px;}
  .titre h1{font-weight:800; font-size:1.9rem; margin:0;}
  .onglets{display:flex; gap:10px; justify-content:center;}
  .onglets button{font:inherit; font-weight:800; font-size:1.35rem; padding:3px 22px; border-radius:999px; cursor:pointer; background:#fce4ec; color:var(--encre); border:none;}
  .onglets button.actif{background:var(--rose-f); color:#fff;}
  .droite{display:flex; align-items:center; gap:12px;}
  .score{display:flex; flex-direction:column; align-items:center; padding:2px 14px; border-radius:12px; background:#fff; border:2px solid #f8d7e3; min-width:130px;}
  .score small{font-size:.8rem; font-weight:700; color:var(--gris); text-transform:uppercase; letter-spacing:.5px;}
  .score b{font-size:1.7rem; line-height:1.05;}
  .niveaux{display:flex; gap:4px;}
  .niveaux button{font:inherit; font-weight:700; font-size:1rem; padding:3px 14px; border-radius:999px; cursor:pointer; background:#fff; color:var(--gris); border:2px solid #f8d7e3;}
  .niveaux button.actif{background:var(--encre); color:#fff; border-color:var(--encre);}
  .btn-son{width:44px; height:44px; border-radius:50%; font-size:1.2rem; cursor:pointer; background:#fff; border:2px solid #f8d7e3;}
  .consigne{display:flex; justify-content:center; padding:14px 20px 0;}
  .consigne p{margin:0; font-weight:800; font-size:2.6rem; text-align:center; background:#fff; padding:0 34px; border-radius:16px;}
  .jeu{flex:1; min-height:0; position:relative;}
  /* le plan de travail */
  .plan{position:absolute; left:0; right:0; bottom:0; height:250px; background:linear-gradient(#f5e6d3,#e8d2b6); border-top:12px solid #d7b48a;}
  /* la recette (le verbe) et le bol */
  .recette{position:absolute; left:150px; top:16px; width:720px; min-height:150px; background:#fffdf7; border:4px solid #e0c9a6; border-radius:18px; padding:10px 26px; box-shadow:0 6px 0 rgba(141,110,99,.18);}
  .recette small{display:block; font-size:1.6rem; color:var(--gris); font-weight:700;}
  .recette .nous{font-size:4rem; font-weight:800; line-height:1.1; white-space:nowrap;}
  .recette .nous .l{display:inline-block; cursor:col-resize;}
  .recette .nous .enleve{color:#cfd8dc; text-decoration:line-through;}
  .bol{position:absolute; left:960px; top:10px; width:380px; height:170px; display:flex; align-items:center; justify-content:center; touch-action:none;}
  .bol svg{position:absolute; inset:0; width:100%; height:100%;}
  .bol b{position:relative; font-size:3.6rem; color:#6d3e10; margin-top:30px;}
  .bol.pret{cursor:grab;}
  .bol.vide{opacity:.35;}
  .choix-bols{position:absolute; left:960px; top:10px; display:flex; gap:20px;}
  .choix-bols .bol{position:relative; left:auto; top:auto; width:240px; height:150px; cursor:pointer;}
  .choix-bols .bol b{font-size:3rem;}
  /* le four */
  .four{position:absolute; right:150px; top:6px; width:330px; height:190px; border-radius:18px; background:#90a4ae; border:6px solid #546e7a;}
  .four .vitre{position:absolute; left:24px; right:24px; top:44px; bottom:20px; border-radius:12px; background:#37474f; transition:background .3s, box-shadow .3s;}
  .four.chaud .vitre{background:#ff8f00; box-shadow:0 0 40px 10px rgba(255,143,0,.7);}
  .four .boutons{position:absolute; left:24px; top:10px; display:flex; gap:12px;} .four .boutons i{width:22px; height:22px; border-radius:50%; background:#eceff1; border:3px solid #546e7a;}
  .four .mot{position:absolute; left:0; right:0; top:80px; text-align:center; font-size:2.2rem; font-weight:800; color:#fff; opacity:0;} .four.chaud .mot{opacity:1;}
  /* le moule : 6 caissettes */
  .moule{position:absolute; left:150px; right:150px; top:220px; height:300px; border-radius:30px; background:linear-gradient(#eceff1,#b0bec5); border:6px solid #90a4ae; display:flex; justify-content:space-around; align-items:flex-end; padding:0 20px 26px;}
  .moule.cuit{animation:cuit 1.2s ease;} @keyframes cuit{30%{filter:brightness(1.25) sepia(.3)} 100%{filter:none}}
  .case{position:relative; width:220px; height:250px; display:flex; flex-direction:column; align-items:center; justify-content:flex-end;}
  .case .pers{position:absolute; top:0; font-size:2rem; font-weight:800; color:#546e7a;}
  .case .caissette{width:190px; height:120px; border-radius:0 0 30px 30px; background:repeating-linear-gradient(90deg,#f8bbd0 0 12px,#f48fb1 12px 24px); clip-path:polygon(0 0,100% 0,88% 100%,12% 100%); display:flex; align-items:flex-start; justify-content:center; padding-top:16px;}
  .case.cible .caissette{outline:6px solid #ffca28; outline-offset:4px;}
  .case .gateau{position:absolute; bottom:110px; width:200px; height:100px; border-radius:100px 100px 18px 18px; background:var(--creme); border:4px solid #e0a050; display:none; align-items:center; justify-content:center;}
  .case .gateau::before{content:""; position:absolute; top:-12px; width:22px; height:22px; border-radius:50%; background:#e53935;}
  .case.cuite .gateau{display:flex; animation:monte .6s ease;} @keyframes monte{from{transform:translateY(30px) scale(.6); opacity:0}}
  .case .forme{position:absolute; bottom:6px; left:50%; transform:translateX(-50%); text-align:center; font-size:1.7rem; font-weight:800; color:var(--encre); display:none; white-space:nowrap; background:#fff; border-radius:12px; padding:2px 12px 0; box-shadow:0 2px 0 rgba(0,0,0,.1);}
  .case.cuite .forme{display:block;}
  .forme .r{color:var(--rouge);} .forme .p{color:#1565c0; text-decoration:underline;}
  .term{display:inline-flex; align-items:center; justify-content:center; min-width:120px; height:66px; padding:4px 18px 0; border-radius:16px; background:#fff; border:4px solid var(--rouge); color:var(--rouge); font-size:2.6rem; font-weight:800; cursor:grab; touch-action:none;}
  .case .term{cursor:default; border-width:3px; height:58px; min-width:110px; font-size:2.3rem;}
  .term.choisie{outline:6px solid #1f7a8c; outline-offset:3px;}
  .term.parti{visibility:hidden;}
  .plaques{position:absolute; left:150px; right:150px; bottom:40px; display:flex; justify-content:center; gap:30px; height:90px; align-items:center;}
  /* Je reconnais / Défi : le présentoir, les cupcakes à choisir, la phrase */
  .presentoir{position:absolute; left:50%; top:150px; transform:translateX(-50%); width:520px; height:230px; display:flex; flex-direction:column; align-items:center; justify-content:flex-end;}
  .presentoir .plateau{width:520px; height:24px; border-radius:12px; background:#fff; border:5px solid #f8bbd0;} .presentoir .pied{width:40px; height:70px; background:#f8bbd0;}
  .presentoir .titre-p{position:absolute; top:0; font-size:2.4rem; font-weight:800; color:var(--rose-f);}
  .presentoir.cible .plateau{border-color:#ffca28; box-shadow:0 0 0 8px rgba(255,202,40,.35);}
  .presentoir .pose{position:absolute; bottom:94px;}
  .phrase{position:absolute; left:150px; right:150px; top:30px; background:#fffdf7; border:4px solid #e0c9a6; border-radius:18px; padding:16px 30px; font-size:3.4rem; font-weight:700; text-align:center; line-height:1.3;}
  .phrase .trou{display:inline-block; min-width:240px; height:1em; border-bottom:6px dashed var(--rose-f); vertical-align:-.1em;}
  .phrase .trou.cible{background:#fff8e1;}
  .phrase .trou.plein{border:none; color:var(--bien); min-width:0;}
  .phrase .temps{display:block; font-size:1.6rem; color:var(--gris);}
  .cupcakes{position:absolute; left:150px; right:150px; bottom:30px; display:flex; justify-content:center; gap:90px;}
  .cupcake{position:relative; width:260px; height:230px; cursor:grab; touch-action:none;}
  .cupcake svg{position:absolute; inset:0; width:100%; height:100%;}
  .cupcake .plaque{position:absolute; left:10px; right:10px; top:58px; text-align:center; font-size:2.1rem; font-weight:800; color:var(--encre); line-height:1.05; background:rgba(255,255,255,.88); border-radius:12px; padding:4px 4px 0;}
  .cupcake.parti{visibility:hidden;}
  .cupcake.tombe{animation:tombe .55s ease;} @keyframes tombe{30%{transform:translateY(-30px) rotate(-8deg)} 100%{transform:none}}
  .secoue{animation:secoue .45s ease;} @keyframes secoue{0%,100%{transform:none}25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}
  .en-vol{position:fixed !important; z-index:50; pointer-events:none; margin:0 !important; transform:rotate(-5deg) scale(1.04);}
  .note{position:absolute; right:150px; bottom:150px; width:640px; background:#fff; border-radius:18px; border:3px solid #f8d7e3; padding:10px 22px; font-size:1.7rem; line-height:1.3; font-weight:700;}
  .note:empty{display:none;} .note .r{color:var(--rouge);}
  .bas{display:flex; align-items:center; justify-content:center; gap:18px; padding:4px 0 12px; min-height:70px; background:#e8d2b6;}
  .btn-indice{font:inherit; font-weight:700; font-size:1.2rem; padding:6px 16px; border-radius:999px; cursor:pointer; background:#fff8dc; border:2px solid #f1d27a; color:#7a5b00;}
  .verdict{min-height:3rem; font-size:2rem; font-weight:800; text-align:center;}
  .verdict:not(:empty){background:#fff; padding:0 24px; border-radius:14px;}
  .verdict.bien{color:var(--bien);} .verdict.faux{color:var(--faux);} .verdict.indice{color:#7a5b00;}
  .btn-suivant{font:inherit; font-weight:800; font-size:1.8rem; padding:2px 34px; border-radius:999px; cursor:pointer; background:var(--encre); color:#fff; border:none;}
</style>
</head>
<body>
<div class="barre">
  <div class="titre">
    <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M14 34h36l-5 24H19z" fill="#f48fb1"/><path d="M12 34c0-12 8-20 20-20s20 8 20 20z" fill="#fff3e0" stroke="#e0a050" stroke-width="3"/><circle cx="32" cy="12" r="5" fill="#e53935"/></svg>
    <h1>Le moule de l'imparfait</h1>
  </div>
  <div class="onglets" id="onglets">
    <button type="button" data-onglet="reconnais">Je reconnais</button>
    <button type="button" data-onglet="fabrique" class="actif">Je fabrique</button>
    <button type="button" data-onglet="pieges">Les pièges</button>
    <button type="button" data-onglet="defi">Défi</button>
  </div>
  <div class="droite">
    <div class="score"><small>Verbes moulés</small><b id="score">0</b></div>
    <div class="score" title="Le meilleur score dans cet onglet, gardé sur cet ordinateur"><small>🏆 Record</small><b id="record">0</b></div>
    <div class="niveaux" id="niveaux">
      <button type="button" data-niveau="1er" class="actif">1er groupe</button>
      <button type="button" data-niveau="2e">2e groupe</button>
      <button type="button" data-niveau="irr">Irréguliers</button>
      <button type="button" data-niveau="tout">Tout</button>
    </div>
    <button class="btn-son" id="btnSon" type="button" title="Son">🔊</button>
  </div>
</div>
<div class="consigne"><p id="consigne"></p></div>
<div class="jeu" id="jeu">
  <div class="plan"></div>
  <div id="scene"></div>
  <div class="note" id="note"></div>
</div>
<div class="bas">
  <button class="btn-indice" id="btnIndice" type="button">💡 Indice</button>
  <div class="verdict" id="verdict"></div>
  <button class="btn-suivant" id="btnSuivant" type="button" hidden>➜</button>
</div>
<script>
(function () {
  var PERS = ["je", "tu", "il, elle", "nous", "vous", "ils, elles"], TERM = ["ais", "ais", "ait", "ions", "iez", "aient"];
  // Je fabrique : [infinitif, « nous » au présent]. 1er groupe : fiches P2 p. 4 et 8 ; 2e groupe : séance 📅 4 et fiche p. 15 ; irréguliers : fiches p. 24-25 (mémo CONJ 9)
  var FABRIQUE = {
    "1er": [["chanter", "chantons"], ["regarder", "regardons"], ["dessiner", "dessinons"], ["marcher", "marchons"], ["parler", "parlons"], ["rêver", "rêvons"],
      ["arriver", "arrivons"], ["distribuer", "distribuons"], ["visiter", "visitons"], ["jouer", "jouons"], ["danser", "dansons"], ["écouter", "écoutons"]],
    "2e": [["finir", "finissons"], ["choisir", "choisissons"], ["grandir", "grandissons"], ["guérir", "guérissons"], ["bâtir", "bâtissons"], ["nourrir", "nourrissons"],
      ["punir", "punissons"], ["réfléchir", "réfléchissons"], ["réussir", "réussissons"], ["rougir", "rougissons"]],
    "irr": [["faire", "faisons"], ["dire", "disons"], ["aller", "allons"], ["venir", "venons"], ["prendre", "prenons"], ["voir", "voyons"],
      ["vouloir", "voulons"], ["pouvoir", "pouvons"], ["avoir", "avons"], ["faire", "faisons"]]
  };
  FABRIQUE.irr.pop();
  FABRIQUE.tout = FABRIQUE["1er"].concat(FABRIQUE["2e"], FABRIQUE.irr);
  // Les pièges : fiche P2 p. 9 (-ger, -cer, -ier, -yer), fiches p. 18-19 (être, avoir) : [infinitif, « nous » au présent, piège]
  var PIEGES = [["manger", "mangeons", "ger"], ["changer", "changeons", "ger"], ["nager", "nageons", "ger"], ["arranger", "arrangeons", "ger"], ["juger", "jugeons", "ger"],
    ["lancer", "lançons", "cer"], ["balancer", "balançons", "cer"], ["bercer", "berçons", "cer"], ["tracer", "traçons", "cer"],
    ["crier", "crions", "ier"], ["associer", "associons", "ier"], ["déplier", "déplions", "ier"], ["nettoyer", "nettoyons", "yer"], ["être", "sommes", "etre"], ["avoir", "avons", "avoir"]];
  // Je reconnais : [la forme à l'imparfait (séance 📅 3 : fiche p. 4, ex. 1 à 3, défi du mémo), deux autres formes du même verbe écrites par moi]
  var RECONNAIS = [["il regardait", "il regarde", "il regardera"], ["nous avancions", "nous avançons", "nous avancerons"], ["j'entendais", "j'entends", "j'entendrai"],
    ["elles remuaient", "elles remuent", "elles remueront"], ["tu criais", "tu cries", "tu crieras"], ["vous nettoyiez", "vous nettoyez", "vous nettoierez"],
    ["vous aimiez", "vous aimez", "vous aimerez"], ["nous donnions", "nous donnons", "nous donnerons"], ["ils écoutaient", "ils écoutent", "ils écouteront"],
    ["il dessinait", "il dessine", "il dessinera"], ["je visitais", "je visite", "je visiterai"], ["ils parlaient", "ils parlent", "ils parleront"],
    ["il jouait", "il joue", "il jouera"], ["tu lançais", "tu lances", "tu lanceras"], ["nous payions", "nous payons", "nous paierons"], ["ils dansaient", "ils dansent", "ils danseront"]];
  // Défi : [phrase (« _ » = le verbe), infinitif, présent, imparfait, le bon temps]. Les 4 premières : séance 📅 7 ; les autres sont écrites par moi avec les verbes des séances.
  var DEFI = [["Aujourd'hui, Persée _ les Gorgones.", "affronter", "affronte", "affrontait", "présent"], ["Autrefois, les Grecs _ aux dieux.", "croire", "croient", "croyaient", "imparfait"],
    ["Maintenant, nous _ la période.", "finir", "finissons", "finissions", "présent"], ["Hier soir, tu _ fatigué.", "être", "es", "étais", "imparfait"],
    ["Avant, les enfants _ à l'école à pied.", "aller", "vont", "allaient", "imparfait"], ["Aujourd'hui, je _ un gâteau.", "faire", "fais", "faisais", "présent"],
    ["Hier, nous _ des crêpes.", "manger", "mangeons", "mangions", "imparfait"], ["Autrefois, le boulanger _ avant le jour.", "se lever", "se lève", "se levait", "imparfait"],
    ["Hier, tu _ un rhume.", "avoir", "as", "avais", "imparfait"], ["Maintenant, elle _ ses devoirs.", "finir", "finit", "finissait", "présent"],
    ["Avant, nous _ des contes le soir.", "dire", "disons", "disions", "imparfait"], ["En ce moment, ils _ la mer.", "voir", "voient", "voyaient", "présent"]];
  var el = function (id) { return document.getElementById(id); };
  var onglet = "fabrique", niveau = "1er", liste = [], idx = 0, score = 0, erreurs = 0, item = null, fini = false, etape = "", poses = [], sonActif = true, ctx = null, choisie = null;
  function son(type) {
    if (!sonActif) return;
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      var t = ctx.currentTime, notes = type === "bien" ? [[523, 0, .15], [659, .1, .15], [784, .2, .35]] : type === "coupe" ? [[1800, 0, .05, "square"], [900, .04, .06, "square"]]
        : type === "pose" ? [[660, 0, .08], [880, .06, .1]] : type === "verse" ? [[300, 0, .5, "sine", 150]] : type === "ding" ? [[1320, 0, .5, "sine"], [1760, .12, .6, "sine"]] : [[200, 0, .3, "sawtooth", 120]];
      notes.forEach(function (q) { var o = ctx.createOscillator(), g = ctx.createGain(); o.type = q[3] || "triangle"; o.frequency.setValueAtTime(q[0], t + q[1]);
        if (q[4]) o.frequency.exponentialRampToValueAtTime(q[4], t + q[1] + q[2]);
        o.connect(g); g.connect(ctx.destination); g.gain.setValueAtTime(.0001, t + q[1]); g.gain.exponentialRampToValueAtTime(.12, t + q[1] + .01);
        g.gain.exponentialRampToValueAtTime(.0001, t + q[1] + q[2]); o.start(t + q[1]); o.stop(t + q[1] + q[2] + .05); });
    } catch (e) {}
  }
  function cleRecord() { return "moule-imparfait-record-" + onglet + (onglet === "fabrique" ? "-" + niveau : ""); }
  function majScore() {
    var r = 0; try { r = parseInt(localStorage.getItem(cleRecord()), 10) || 0; } catch (e) {}
    if (score > r) { r = score; try { localStorage.setItem(cleRecord(), String(r)); } catch (e) {} }
    el("score").textContent = score; el("record").textContent = r;
  }
  function verdict(t, c) { el("verdict").textContent = t; el("verdict").className = "verdict" + (c ? " " + c : ""); }
  function consigne(t) { el("consigne").textContent = t; }
  function secoue(x) { x.classList.remove("secoue"); void x.offsetWidth; x.classList.add("secoue"); }
  function melange(t) { for (var i = t.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), w = t[i]; t[i] = t[j]; t[j] = w; } return t; }
  function H(tag, cls, html) { var d = document.createElement(tag); if (cls) d.className = cls; if (html !== undefined) d.innerHTML = html; return d; }
  function bravo(note) { fini = true; son("bien"); score++; majScore(); verdict(erreurs ? "✅" : "✅ Bravo !", "bien"); el("btnSuivant").hidden = false; if (note) el("note").innerHTML = note; }

  // ---------- glisser (ou toucher) ----------
  function glissable(d, cibles, poser, siTouche) {
    d.addEventListener("pointerdown", function (ev) {
      if (fini) return; ev.preventDefault();

  var zones = function () { return Array.prototype.slice.call(document.querySelectorAll("#indice, .indice, #message, .message, #verdict, .verdict, #consigne-aide")); };
  var avant = [], minuteur = null;
  b.addEventListener("click", function () { avant = zones().map(function (z) { return [z, z.textContent, z.className]; }); }, true);   // avant le code du jeu
  b.addEventListener("click", function () {
    setTimeout(function () {
      var txt = "";
      avant.forEach(function (a) {
        var z = a[0], neuf = z.textContent;
        if (neuf !== a[1] && neuf.trim()) { txt = neuf; z.textContent = a[1]; z.className = a[2]; }
      });
      if (!txt) return;   // le jeu montre l'indice autrement : on le laisse faire
      bulle.textContent = txt.replace(/^\s*💡\s*/, ""); bulle.style.display = "block";
      clearTimeout(minuteur); minuteur = setTimeout(function () { bulle.style.display = "none"; }, 8000);
    }, 0);
  });
  document.addEventListener("pointerdown", function (e) { if (e.target !== b && e.target !== bulle) bulle.style.display = "none"; });
})();
</script>
<!-- /INDICE-COTE -->
