     Je trouve : on passe le doigt sur le sujet ; la grue le soulève hors de la phrase, il devient une BRIQUE.
     Je trie : 4 bennes sans nom ; une benne ne prend qu'une sorte de brique et recrache les autres : on découvre les critères.
     Je nomme : on visse les plaques (groupe nominal, plusieurs groupes nominaux, pronom personnel, nom propre), puis on reprend
     toutes les phrases et on jette chaque sujet dans sa benne. Défi : sujets éloignés du verbe, inversés, sujets de plusieurs verbes.
     Le verbe n'est jamais marqué à l'écran. */

  :root{ --encre:#2b2620; --gris:#6f655a; --bord:#e2d3b5; --sable:#f3e7cf; --jaune:#f2b705; --bien:#1a8f5c; --faux:#d6455d; --talbot:#1f7a8c;
    --brique:#f1b48f; --brique-bord:#a4472c; --fr:#c62828; }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0; color:var(--encre); font-family:"Quicksand",system-ui,sans-serif; overflow:hidden; height:100vh; display:flex; flex-direction:column;
    background:var(--sable) radial-gradient(circle at 20% 110%, rgba(184,134,11,.18), transparent 45%); user-select:none; -webkit-user-select:none; touch-action:none;}
  [hidden]{display:none !important;}

  /* 1) la barre du haut */
  .barre{display:grid; grid-template-columns:1fr auto; align-items:center; gap:16px; padding:8px 26px; background:#fff; border-bottom:6px solid var(--jaune);}
  .titre{display:flex; align-items:center; gap:12px;} .titre svg{width:56px; height:56px;}
  .titre h1{font-family:"Baloo 2",cursive; font-weight:800; font-size:1.9rem; margin:0;}
  .droite{display:flex; align-items:center; gap:12px;}
  .score{display:flex; flex-direction:column; align-items:center; padding:2px 14px; border-radius:12px; background:#fff; border:2px solid var(--bord); min-width:130px;}
  .score small{font-size:.8rem; font-weight:700; color:var(--gris); text-transform:uppercase; letter-spacing:.5px;}
  .score b{font-family:"Baloo 2",cursive; font-size:1.8rem; line-height:1.05;}
  .niveaux{display:flex; gap:4px;}
  .niveaux button{font:inherit; font-weight:700; font-size:.95rem; padding:3px 14px; border-radius:999px; cursor:pointer; background:#fff; color:var(--gris); border:2px solid var(--bord);}
  .niveaux button.actif{background:var(--encre); color:#fff; border-color:var(--encre);}
  .btn-son{width:44px; height:44px; border-radius:50%; font-size:1.2rem; cursor:pointer; background:#fff; border:2px solid var(--bord);}

  /* 2) la consigne */
  .consigne{display:flex; justify-content:center; padding:10px 20px 0;}
  .consigne p{margin:0; font-family:"Baloo 2",cursive; font-weight:700; font-size:2.1rem; text-align:center; background:#fff; padding:2px 22px; border-radius:16px; border:2px solid var(--bord);}

  /* 3) le jeu */
  .jeu{flex:1; min-height:0; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:space-evenly; gap:14px; padding:46px 40px 6px;}
  /* la flèche de la grue, en haut du jeu */
  .fleche{position:absolute; left:0; right:0; top:4px; height:26px; border-top:5px solid #c99a00; border-bottom:5px solid #c99a00;
    background:repeating-linear-gradient(60deg, transparent 0 14px, var(--jaune) 14px 20px, transparent 20px 34px), repeating-linear-gradient(-60deg, transparent 0 14px, var(--jaune) 14px 20px, transparent 20px 34px);}
  .crochet{position:fixed; z-index:40; width:46px; pointer-events:none; transition:left .45s ease, top .45s ease; display:flex; flex-direction:column; align-items:center;}
  .crochet .cable{width:4px; background:#3b3b3b; transition:height .45s ease;}
  .crochet svg{width:46px; height:46px; margin-top:-2px;}

  /* la phrase, sur un panneau de chantier */
  .panneau{max-width:1760px; width:100%; background:#fff; border-radius:24px; border:5px solid var(--encre); padding:34px 40px; box-shadow:0 10px 0 rgba(43,38,32,.15);
    display:flex; justify-content:center;}
  .phrase{display:flex; flex-wrap:wrap; justify-content:center; align-items:baseline; row-gap:18px;}
  .mot{font-family:"Belle Allure CM","Quicksand",cursive; font-size:3.6rem; line-height:1.25; padding:2px 6px; margin-left:.42em; border-radius:10px; cursor:pointer; position:relative;}
  .mot:first-child, .mot.colle{margin-left:0;}
  .mot.ponct{cursor:default; padding-left:0;}
  .mot.sel{background:#ffe36e; box-shadow:0 0 0 4px #ffe36e;}
  .mot.depart{outline:6px solid var(--talbot); outline-offset:2px;}
  .mot.vide{color:transparent; background:repeating-linear-gradient(90deg, rgba(164,71,44,.18) 0 10px, transparent 10px 16px); border-radius:6px;}
  .secoue{animation:secoue .4s ease;} @keyframes secoue{0%,100%{transform:none}25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}

  /* les briques */
  .brique{display:inline-flex; align-items:center; justify-content:center; text-align:center; font-family:"Belle Allure CM","Quicksand",cursive; font-size:2.1rem; line-height:1.55;
    padding:8px 22px 4px; white-space:nowrap; border-radius:6px; background:var(--brique); color:#3a1b10; border:4px solid var(--brique-bord); cursor:grab; touch-action:none;
    box-shadow:inset 0 -6px 0 rgba(164,71,44,.25), 0 5px 0 rgba(0,0,0,.18); max-width:100%;}
  .brique.long{white-space:normal; line-height:1.35; padding-bottom:6px;}
  .brique.choisi{outline:7px solid var(--talbot); outline-offset:4px;}
  .brique.parti{visibility:hidden;}
  .brique.volante{position:fixed; z-index:45; margin:0; transition:left .55s ease, top .55s ease, transform .55s ease; pointer-events:none;}
  .en-vol{position:fixed !important; z-index:50; pointer-events:none; margin:0 !important; transform:rotate(-4deg) scale(1.05);}

  /* Je trouve : la pile de briques */
  .pile{display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:14px 24px; width:100%; max-width:1760px;}
  .pile .case{min-height:74px; border:3px dashed rgba(164,71,44,.35); border-radius:8px; display:flex; align-items:center; justify-content:center;}
  .pile .brique{font-size:1.6rem; padding:4px 16px 0; cursor:default;}

  /* le tas (Je trie) et l'accroche (la brique soulevée qui attend sa benne) */
  .tas{display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:16px 22px; width:100%; max-width:1760px; min-height:96px;}

  /* les plaques */
  .plaques{display:flex; justify-content:center; gap:28px; flex-wrap:wrap;}

<script>
(function () {

    { n: "plgn", s: "[Les couleurs et les formes] *ont* *donné* de la vie à ce tableau .", ref: "livret de dictées" },

    var a = depart; depart = null; repondre(Math.min(a, g.a), Math.max(a, g.a));
  });
  function repondre(a, b) {

  }

  // ---------- la grue soulève le sujet : il devient une brique ----------
  function souleve() {

    for (var i = p.a; i <= p.b; i++) { var q = mots[i].getBoundingClientRect(); r = r ? { l: Math.min(r.l, q.left), t: Math.min(r.t, q.top), rr: Math.max(r.rr, q.right), b: Math.max(r.b, q.bottom) } : { l: q.left, t: q.top, rr: q.right, b: q.bottom }; }

  function poserBrique(volante) {

        else { son("fin"); verdict("✅ 12 briques sur le chantier !", "bien"); consigne("Bravo !"); suivant("Je trie ➜", function () { choisirNiveau("trier"); }); }
      }, 600);
    } else {   // Je nomme (2e partie) et Défi : la brique attend sous la grue, on la glisse dans sa benne
      volante.remove(); el("tas").innerHTML = "";

  // ---------- glisser (ou toucher, puis toucher la benne) ----------

<script>
/* ==== LE MENU ☰ (GTH, 10/10) : interface épurée — à l'écran, seulement le titre, le score, la consigne et l'activité ====
   Tout le reste (niveaux, onglets de méthode, ✏️, 🔊, 🖨️, aide…) part dans un menu ☰, ouvert d'un toucher.
   Réglage par outil (CONF, posé par l'injecteur) : ancre = où mettre le bouton ☰ (sinon en haut à droite de l'écran) ;
   cacher = ce qui part dans le menu (sinon : tout ce qui, dans « .barre .droite », n'est pas un score).

(function () {
  var CONF = {};
  var st = document.createElement("style");
  st.textContent =
    ".menu-btn{width:58px; height:58px; border-radius:16px; border:2px solid rgba(0,0,0,.15); background:#fff; color:#1f2a33; font-size:2rem; line-height:1; cursor:pointer; flex:none; padding:0;}" +
    ".menu-btn.fixe{position:fixed; top:10px; right:12px; z-index:150; box-shadow:0 4px 14px rgba(0,0,0,.15);}" +
    ".menu-btn.ouvert{background:#1f2a33; color:#fff;}" +
    ".menu-panneau{position:fixed; top:76px; right:16px; z-index:200; background:#fff; color:#1f2a33; border-radius:18px; box-shadow:0 18px 50px rgba(0,0,0,.28); padding:16px 18px;" +
    "  display:flex; flex-direction:column; align-items:flex-start; gap:12px; max-width:min(620px, 92vw); max-height:80vh; overflow:auto;}" +
    ".menu-panneau[hidden]{display:none !important;}" +

    ".menu-panneau > *{position:static !important; margin:0 !important;}" +
    ".menu-panneau > div,.menu-panneau > nav{display:flex; flex-wrap:wrap; gap:8px;}";
  document.head.appendChild(st);
  function installer() {
    var autres = [];
    if (CONF.cacher) CONF.cacher.forEach(function (s) { document.querySelectorAll(s).forEach(function (e) { if (autres.indexOf(e) === -1) autres.push(e); }); });
    else { var d = document.querySelector(".barre .droite"); if (d) autres = Array.prototype.filter.call(d.children, function (e) { return !e.classList.contains("score"); }); }

<script>
/* 💡 sur le côté (Karim, 21/10) : dans les jeux qui ont un bouton « 💡 Indice » (.btn-indice), le bouton devient une ampoule seule,
   collée au bord droit de l'écran, à mi-hauteur ; l'indice s'ouvre dans une bulle à côté d'elle, jamais sous le jeu.

(function () {

    "#bulle-cote{position:fixed; right:110px; top:50%; transform:translateY(-50%); max-width:520px; background:#fff8c4; border:2px solid #d4b106; border-radius:18px;" +
    " padding:16px 22px; font-size:26px; line-height:1.35; z-index:60; box-shadow:0 6px 18px rgba(0,0,0,.15); display:none}" +
