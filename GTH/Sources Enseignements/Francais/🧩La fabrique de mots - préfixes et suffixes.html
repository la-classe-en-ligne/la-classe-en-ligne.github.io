<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La fabrique de mots</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M4 58V30l14-10v10l14-10v10l14-10V8h10v50z' fill='%235c6570'/%3E%3Crect x='10' y='40' width='12' height='12' fill='%23f08a12'/%3E%3Crect x='26' y='40' width='12' height='12' fill='%232f86d6'/%3E%3Crect x='42' y='40' width='12' height='12' fill='%2346a34a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap">
<style>
  /* 🏭 La fabrique de mots, l'usine (maquette validée par Karim le 23/10 : « une usine avec deux bras robots qui travaillent sur le mot,
     le découpent au laser… »). Le mot arrive sur un tapis roulant, une plaque d'acier par lettre ; la couleur dit la règle une fois
     le mot coupé ou soudé (préfixe orange, radical bleu, suffixe vert) ; les robots sont gris pour ne pas se confondre avec elles.
     Je coupe : faire glisser le laser (le portique du plafond) entre deux lettres, il tire en se posant ; on peut aussi passer le doigt
     sur le mot (fiche P2 p. 5 : re|démarrage, mal|chance…). Les morceaux tombent dans les caisses Préfixes / Radicaux.
     J'assemble : prendre un suffixe dans le casier, le portique l'apporte contre le radical, le bras au sol le soude ; si le mot n'existe
     pas, la soudure lâche et la pièce tombe (fiche P2 p. 16 : chant- + eur, beau- + té…). Le sens : ranger le mot dans la caisse
     de ce que veut dire le préfixe (mémo VOC 3). Défi : deux coups de laser, préfixe ET suffixe (ir|respect|ueux, mémo VOC 4).
     Les sens des mots fabriqués (« celui qui chante ») sont écrits par moi. La scène fait 1920 × 840 et se met à l'échelle. */
  :root{ --encre:#2c3540; --gris:#6b747f; --bord:#e1e5ea; --bien:#2e7d32; --faux:#c62828;
    --riv:radial-gradient(circle at 9px 11px, rgba(0,0,0,.25) 2.5px, transparent 3.5px), radial-gradient(circle at calc(100% - 9px) 11px, rgba(0,0,0,.25) 2.5px, transparent 3.5px),
      radial-gradient(circle at 9px calc(100% - 11px), rgba(0,0,0,.25) 2.5px, transparent 3.5px), radial-gradient(circle at calc(100% - 9px) calc(100% - 11px), rgba(0,0,0,.25) 2.5px, transparent 3.5px); }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0; color:var(--encre); font-family:"Baloo 2",system-ui,sans-serif; overflow:hidden; height:100vh; display:flex; flex-direction:column; background:#eef1f4; user-select:none; -webkit-user-select:none; touch-action:none;}
  [hidden]{display:none !important;}
  .barre{display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:20px; padding:8px 26px; background:#fff; border-bottom:3px solid var(--bord);}
  .titre{display:flex; align-items:center; gap:12px;} .titre svg{width:50px; height:50px;}
  .titre h1{font-weight:800; font-size:1.9rem; margin:0;}
  .onglets{display:flex; gap:10px; justify-content:center;}
  .onglets button{font:inherit; font-weight:800; font-size:1.35rem; padding:3px 22px; border-radius:999px; cursor:pointer; background:#eceff2; color:var(--encre); border:none;}
  .onglets button.actif{background:#c62828; color:#fff;}
  .droite{display:flex; align-items:center; gap:12px;}
  .score{display:flex; flex-direction:column; align-items:center; padding:2px 14px; border-radius:12px; background:#fff; border:2px solid var(--bord); min-width:130px;}
  .score small{font-size:.8rem; font-weight:700; color:var(--gris); text-transform:uppercase; letter-spacing:.5px;}
  .score b{font-size:1.7rem; line-height:1.05;}
  .btn-son{width:44px; height:44px; border-radius:50%; font-size:1.2rem; cursor:pointer; background:#fff; border:2px solid var(--bord);}
  .consigne{display:flex; justify-content:center; padding:14px 20px 0;}
  .consigne p{margin:0; font-weight:800; font-size:2.7rem; text-align:center; background:#fff; padding:0 34px; border-radius:16px; border:3px solid var(--bord);}
  .jeu{flex:1; min-height:0; position:relative; overflow:hidden;}
  /* la scène de l'usine */
  .scene{position:absolute; left:0; top:0; width:1920px; height:840px; transform-origin:0 0;}
  .decor,.robots{position:absolute; left:0; top:0; width:1920px; height:840px; pointer-events:none;}
  .calque{position:absolute; left:0; top:0; width:1920px; height:840px; pointer-events:none;} .calque > *{pointer-events:auto;}
  #caisses{z-index:2;} #bac{z-index:3;} #poste{z-index:4;} .robots{z-index:5;}
  .tapis{position:absolute; left:110px; top:555px; width:1700px; height:34px; border-radius:17px; z-index:1;
    background:radial-gradient(circle at 30px 17px, #6b747f 9px, #3c434b 10px 12px, transparent 13px) 0 0 / 60px 34px repeat-x, #4d5560;}
  .tapis.roule{animation:roule .22s linear infinite;} @keyframes roule{to{background-position:60px 0, 0 0}}
  /* les plaques : une par lettre */
  .piece{position:absolute; top:420px; display:flex; gap:6px; touch-action:none;}
  .piece .l{width:66px; height:128px; border:4px solid; border-radius:8px; display:flex; align-items:center; justify-content:center; padding-top:12px;
    font-weight:800; font-size:84px; line-height:1; color:#fff; text-shadow:0 2px 0 rgba(0,0,0,.18);}
  .acier .l{color:var(--encre); text-shadow:none; border-color:#98a3ae; background:var(--riv), linear-gradient(#f3f5f7, #d9dfe5 50%, #c3cbd3);}
  .prefixe .l{border-color:#c96a00; background:var(--riv), linear-gradient(#ffc067, #f08a12);}
  .radical .l{border-color:#1d64a8; background:var(--riv), linear-gradient(#6fb6f5, #2f86d6);}
  .suffixe .l{border-color:#2e7d32; background:var(--riv), linear-gradient(#8fd48f, #46a34a);}
  .piece.coupable{cursor:col-resize;}
  .piece.petite{display:flex; align-items:center; justify-content:center; width:136px; height:84px; padding-top:8px; border:4px solid #2e7d32; border-radius:10px;
    font-weight:800; font-size:48px; line-height:1; color:#fff; text-shadow:0 2px 0 rgba(0,0,0,.18); background:var(--riv), linear-gradient(#8fd48f, #46a34a); cursor:grab;}
  .piece.porte{z-index:3; cursor:grabbing;}
  .groupe{position:absolute; top:420px; display:flex; gap:14px; transform-origin:50% 0; cursor:grab; touch-action:none;}
  .groupe .piece{position:static;} .groupe.porte{transform:scale(.5);}
  .arrive{animation:arrive .7s ease-out;} @keyframes arrive{from{transform:translateX(-1500px)}}
  .secoue{animation:secoue .45s ease;} @keyframes secoue{0%,100%{transform:none}25%{transform:translateX(-14px)}75%{transform:translateX(14px)}}
  /* le casier des suffixes */
  .casier{position:absolute; left:1310px; top:74px; width:500px; height:252px; background:#a9b3bd; border:5px solid #6f7983; border-radius:10px;}
  .case{position:absolute; width:152px; height:112px; background:#e6eaee; border:4px solid #6f7983; border-radius:8px;}
  /* les caisses */
  .caisse{position:absolute; top:650px; height:130px; border:5px solid #8a6232; border-radius:8px;
    background:repeating-linear-gradient(#c99b62 0 38px, #a57a43 38px 42px);}
  .caisse .etiq{position:absolute; left:50%; top:30px; transform:translateX(-50%); background:#fff; border:4px solid; border-radius:10px; padding:2px 18px 0;
    font-size:34px; font-weight:800; white-space:nowrap;}
  .caisse .minis{position:absolute; left:-20px; right:-20px; top:-50px; display:flex; justify-content:center; z-index:-1;}
  .mini{font-size:26px; font-weight:800; color:#fff; padding:4px 12px 0; border-radius:6px; border:3px solid; white-space:nowrap; transform:rotate(-5deg);}
  .mini + .mini{margin-left:8px; transform:rotate(4deg);}
  .m-pre{background:#f5a03c; border-color:#c96a00;} .m-rad{background:#4a9de4; border-color:#1d64a8;} .m-suf{background:#5fb862; border-color:#2e7d32;}
  .m-acier{background:#e4e9ee; border-color:#98a3ae; color:var(--encre);} .m-mot{background:#fff; border-color:#2e7d32; color:#1d64a8;}
  .boite{cursor:pointer;} .boite.cible{outline:6px solid #ffca28; outline-offset:4px;}
  .boite.bonne .etiq{border-color:var(--bien) !important; color:var(--bien) !important; background:#e8f5e9;}
  /* le laser, sa visée, les étincelles */
  .poignee{position:absolute; top:0; width:200px; margin-left:-100px; cursor:grab; z-index:7;}
  .mire{position:absolute; top:344px; height:72px; width:0; margin-left:-2px; border-left:4px dashed rgba(229,57,53,.85); z-index:6; pointer-events:none;}
  .rayon{position:absolute; width:8px; margin-left:-4px; border-radius:4px; background:#ff3b3b; box-shadow:0 0 18px 8px rgba(255,50,50,.45); z-index:6; pointer-events:none;}
  .pof{position:absolute; width:100px; height:100px; margin:-50px 0 0 -50px; z-index:7; pointer-events:none; animation:pof .5s ease-out forwards;}
  @keyframes pof{from{transform:scale(.3); opacity:1} to{transform:scale(1.3); opacity:0}}
  /* ce que veut dire le mot */
  .sens{position:absolute; top:280px; transform:translateX(-50%); z-index:6; background:#fff; border:3px solid #d5dbe1; border-radius:18px; padding:8px 28px 6px;
    font-size:40px; font-weight:700; line-height:1.25; white-space:nowrap; box-shadow:0 6px 18px rgba(0,0,0,.08); pointer-events:none;}
  .sens:empty{display:none;}
  .sens b{color:#1d64a8;} .sens small{display:block; font-size:26px; color:var(--gris); font-weight:700;}
  .bas{display:flex; align-items:center; justify-content:center; gap:18px; padding:4px 0 12px; min-height:70px;}
  .btn-indice{font:inherit; font-weight:700; font-size:1.2rem; padding:6px 16px; border-radius:999px; cursor:pointer; background:#fff8dc; border:2px solid #f1d27a; color:#7a5b00;}
  .verdict{min-height:3rem; font-size:2rem; font-weight:800; text-align:center;}
  .verdict:not(:empty){background:#fff; padding:0 24px; border-radius:14px;}
  .verdict.bien{color:var(--bien);} .verdict.faux{color:var(--faux);} .verdict.indice{color:#7a5b00;}
  .btn-suivant{font:inherit; font-weight:800; font-size:1.8rem; padding:2px 34px; border-radius:999px; cursor:pointer; background:var(--encre); color:#fff; border:none;}
</style>
</head>
<body>
<div class="barre">
  <div class="titre">
    <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M4 58V30l14-10v10l14-10v10l14-10V8h10v50z" fill="#5c6570"/><rect x="10" y="40" width="12" height="12" fill="#f08a12"/><rect x="26" y="40" width="12" height="12" fill="#2f86d6"/><rect x="42" y="40" width="12" height="12" fill="#46a34a"/></svg>
    <h1>La fabrique de mots</h1>
  </div>

</div>

</div>
<script>
(function () {

  var COUPE = [["redémarrage", 2], ["désavantage", 3], ["malchance", 3], ["impatience", 2], ["découragement", 2], ["surmonter", 3], ["réorganisation", 2],

    ["maladresse", 3], ["inactivité", 2], ["imprévu", 2], ["désaccord", 3], ["prévoyance", 3], ["surentraînement", 3], ["désorganisation", 3],

    ["lect", "eur", "lecteur", "celui qui lit"], ["simplici", "té", "simplicité", "le fait d'être simple"], ["gentill", "esse", "gentillesse", "le fait d'être gentil"],
    ["explor", "ation", "exploration", "le fait d'explorer"], ["jeun", "esse", "jeunesse", "le fait d'être jeune"], ["cultur", "elle", "culturelle", "qui concerne la culture"],

  // Le sens : mémo VOC 3 (tableau des préfixes) et mots de la fiche p. 5 : [préfixe, radical, sens, ce que veut dire le mot]
  var SENS_LISTE = ["le contraire", "avec", "trois", "répétition", "contre", "de soi-même", "plusieurs"];
  var SENS = [["dis", "paraître", "le contraire", "le contraire de paraître"], ["co", "équipier", "avec", "un équipier qui joue avec moi"], ["im", "possible", "le contraire", "le contraire de possible"],
    ["ir", "réel", "le contraire", "le contraire de réel"], ["tri", "angle", "trois", "une figure à trois angles"], ["r", "envoyer", "répétition", "envoyer encore"],
    ["re", "partir", "répétition", "partir encore"], ["anti", "vol", "contre", "contre le vol"], ["auto", "biographie", "de soi-même", "la biographie de soi-même"],
    ["multi", "nationale", "plusieurs", "dans plusieurs nations"], ["im", "patience", "le contraire", "le contraire de la patience"], ["in", "attention", "le contraire", "le contraire de l'attention"],
    ["re", "lecture", "répétition", "lire encore"], ["ré", "apparition", "répétition", "apparaître encore"], ["in", "sécurité", "le contraire", "le contraire de la sécurité"],
    ["in", "activité", "le contraire", "le contraire de l'activité"]];
  // Défi : mémo VOC 4 (ir / respect / ueux) et mots de la fiche p. 5 : [mot, longueur du préfixe, débuts de suffixe acceptés]
  var DEFI = [["irrespectueux", 2, [9]], ["redémarrage", 2, [8]], ["découragement", 2, [9, 8]], ["déchargement", 2, [8, 7]], ["réorganisation", 2, [10, 9]],
    ["impatience", 2, [6, 5]], ["préchauffage", 3, [9]], ["dévalorisation", 2, [10, 9]], ["surévaluation", 3, [9, 8]], ["relecture", 2, [6]], ["réapparition", 2, [7, 8]]];
  var el = function (id) { return document.getElementById(id); }, scene = el("scene");
  var onglet = "coupe", liste = [], idx = 0, score = 0, erreurs = 0, item = null, fini = false, coupes = [], sonActif = true, ctx = null, fabriques = [];
  var occupe = false, S = 1, contenu = {}, gaucheMot = 0, finMot = 0, depart = null;
  var LARG = 72, RAD_FIN = 1000, CENTRE = 820;   // une plaque tous les 72 px ; J'assemble : le radical finit en 1000, la soudure se fait là
  var G = { x: 1750, y: 170, outil: "rien" };      // le portique du plafond : laser ou aimant
  var A = { outil: "repos", x: 0, y: 0, feu: false }; // le bras au sol : pince (il tient le mot) ou chalumeau
  function largeur(n) { return n * LARG - 6; }
  function son(type) {

        : type === "soudure" ? [[90, 0, .06, "square"], [140, .09, .06, "square"], [110, .18, .06, "square"], [160, .27, .06, "square"]] : [[200, 0, .3, "sawtooth", 120]];
      notes.forEach(function (q) { var o = ctx.createOscillator(), g = ctx.createGain(); o.type = q[3] || "triangle"; o.frequency.setValueAtTime(q[0], t + q[1]);

        g.gain.exponentialRampToValueAtTime(.0001, t + q[1] + q[2]); o.start(t + q[1]); o.stop(t + q[1] + q[2] + .05); });
    } catch (e) {}
  }
  function majScore() {
    var r = 0, k = "fabrique-mots-record-" + onglet; try { r = parseInt(localStorage.getItem(k), 10) || 0; } catch (e) {}

  }

  function pt(e) { var r = scene.getBoundingClientRect(); return { x: (e.clientX - r.left) / S, y: (e.clientY - r.top) / S }; }
  function ajuster() { var j = el("jeu"), w = j.clientWidth, h = j.clientHeight; S = Math.min(w / 1920, h / 840) || 1;
    scene.style.transform = "scale(" + S + ")"; scene.style.left = ((w - 1920 * S) / 2) + "px"; scene.style.top = Math.max(0, (h - 840 * S) / 2) + "px"; }
  function piece(txt, cls, lettres, debut) {

    if (lettres) txt.split("").forEach(function (c, j) { var s = document.createElement("div"); s.className = "l"; s.textContent = c; s.dataset.i = (debut || 0) + j; d.appendChild(s); }); else d.textContent = txt;
    return d;
  }

  function carte(html, cx) { el("sens").innerHTML = html; el("sens").style.left = cx + "px"; }
  function pof(x, y) {   // une gerbe d'étincelles

    for (var i = 0; i < 12; i++) { var a = i / 12 * Math.PI * 2 + Math.random() * .4, l = 26 + (i % 3) * 12; h += '<line x1="50" y1="50" x2="' + (50 + Math.cos(a) * l) + '" y2="' + (50 + Math.sin(a) * l) + '" stroke="' + (i % 2 ? "#ffd23f" : "#ff8a1f") + '" stroke-width="4" stroke-linecap="round"/>'; }

  }

  // ---------- le décor : mur, fenêtres d'usine, rail du plafond, sol, pieds du tapis ----------
  (function () {

    tween(320, function (e) { poserA(g, l0 + (l1 - l0) * e, t0 + (t1 - t0) * e); }, function () {
      [].forEach.call(document.querySelectorAll(".boite"), function (x) { x.classList.remove("cible"); });
      if (c.dataset.sens === item[2]) {
        c.classList.add("bonne"); consigne(item[0] + "- veut dire : " + item[2]);
        g.style.transition = "transform .4s ease-in, opacity .4s ease-in"; g.style.transform = "translateY(150px) scale(.25)"; g.style.opacity = "0";
        var mot = item[0] + item[1]; setTimeout(function () { g.remove(); deposer(c.dataset.cle, mot, "acier"); }, 420);
        occupe = false; fabriques.push(mot); bravo("✅ <b>" + mot + "</b> : " + item[3] + "<small>" + item[0] + "- : " + item[2] + "</small>", CENTRE); garer();
      } else {
        erreurs++; son("non"); secoue(c); verdict("🤪 " + item[0] + "- ne veut pas dire « " + c.dataset.sens + " ».", "faux"); retour(g);
      }
    });
  }

  // ---------- un nouveau mot arrive sur le tapis ----------
  function bravo(html, cx) { fini = true; son("bien"); score++; majScore(); verdict(erreurs ? "✅" : "✅ Bravo !", "bien"); el("btnSuivant").hidden = false; carte(html, cx); dessinerRobots(); }
  function nouveau() {
    item = liste[idx % liste.length]; fini = false; erreurs = 0; coupes = []; gen++;
    el("poste").innerHTML = ""; el("bac").innerHTML = ""; carte("", CENTRE); verdict(""); el("btnSuivant").hidden = true; mire(null);
    if (onglet === "coupe" || onglet === "defi") { consigne(onglet === "coupe" ? "Coupe le préfixe." : "Coupe le préfixe et le suffixe."); dessinerCoupe(); G.outil = "laser"; G.x = gaucheMot - 70; G.y = 340; }
    else if (onglet === "assemble") { consigne("Fabrique un mot."); dessinerAssemble(); }
    else { consigne("Que veut dire le préfixe ?"); dessinerSens(); }
    occupe = true; var outil = A.outil; A.outil = "repos"; dessinerRobots();
    var ps = [].slice.call(el("poste").children); ps.forEach(function (p) { p.classList.add("arrive"); }); el("tapis").classList.add("roule");
    setTimeout(function () { el("tapis").classList.remove("roule"); ps.forEach(function (p) { p.classList.remove("arrive"); }); A.outil = outil; dessinerRobots(); occupe = false; }, 720);
  }
  el("btnSuivant").addEventListener("click", function () {
    if (occupe) return;
    if (onglet === "coupe" || onglet === "defi") [].forEach.call(el("poste").querySelectorAll(".piece"), function (p) {
      var c = p.classList.contains("prefixe") ? "pre" : p.classList.contains("suffixe") ? "suf" : "rad"; jeter(p, c, c, p.textContent); });
    else if (onglet === "assemble") [].forEach.call(el("poste").querySelectorAll(".piece"), function (p, i) { jeter(p, "mots", "mot", i ? "" : fabriques[fabriques.length - 1]); });
    idx++; nouveau();
  });
  el("btnIndice").addEventListener("click", function () {
    var t = onglet === "coupe" ? "Cherche le mot de départ caché dans le mot : ce qui est devant, c'est le préfixe."
      : onglet === "defi" ? "Le préfixe est devant le radical, le suffixe est derrière (ir | respect | ueux)."
      : onglet === "assemble" ? "Dis le mot à voix haute avec chaque pièce : lequel existe ?"
      : "Pense à un autre mot avec le même préfixe (re- : refaire, revenir…).";
    verdict("💡 " + t, "indice");
  });
  el("btnSon").addEventListener("click", function () { sonActif = !sonActif; el("btnSon").textContent = sonActif ? "🔊" : "🔇"; });
  function lancer() {
    score = 0; idx = 0; fabriques = []; contenu = {};
    document.querySelectorAll("#onglets button").forEach(function (b) { b.classList.toggle("actif", b.dataset.onglet === onglet); });
    liste = melange((onglet === "coupe" ? COUPE : onglet === "defi" ? DEFI : onglet === "assemble" ? ASSEMBLE : SENS).slice());
    caisses(onglet === "coupe" ? [{ cle: "pre", titre: "préfixes", x: 200, w: 360 }, { cle: "rad", titre: "radicaux", x: 980, w: 360 }]
      : onglet === "defi" ? [{ cle: "pre", titre: "préfixes", x: 150, w: 330 }, { cle: "rad", titre: "radicaux", x: 590, w: 330 }, { cle: "suf", titre: "suffixes", x: 1030, w: 330 }]
      : onglet === "assemble" ? [{ cle: "mots", titre: "mots fabriqués", x: 200, w: 440 }] : []);
    majScore(); nouveau();
  }
  document.querySelectorAll("#onglets button").forEach(function (b) { b.addEventListener("click", function () { if (!occupe) { onglet = b.dataset.onglet; lancer(); } }); });
  function lireHash() { var h = decodeURIComponent(location.hash.slice(1)); if (["coupe", "assemble", "sens", "defi"].indexOf(h) !== -1) onglet = h; lancer(); }
  window.addEventListener("hashchange", lireHash); window.addEventListener("resize", ajuster);
  ajuster(); if (document.fonts) document.fonts.ready.then(ajuster);
  lireHash();
  window.__fabrique = { etat: function () { return { onglet: onglet, item: item, fini: fini, occupe: occupe, coupes: coupes.slice(), score: score, n: liste.length, verdict: el("verdict").textContent,
    poste: [].map.call(el("poste").querySelectorAll(".piece"), function (p) { return [p.textContent, p.className]; }), fait: fabriques.slice(), listes: { coupe: COUPE, assemble: ASSEMBLE, sens: SENS, defi: DEFI } }; },
    borne: function (k) {   // position à l'écran de la frontière avant la lettre k (pour les tests)
      var a = el("poste").querySelector('.piece.coupable .l[data-i="' + (k - 1) + '"]'), b = el("poste").querySelector('.piece.coupable .l[data-i="' + k + '"]');
      if (!a || !b || a.parentNode !== b.parentNode) return null; var ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect(); return { x: (ra.right + rb.left) / 2, y1: ra.top + 10, y2: ra.bottom - 10 }; },
    laser: function () { var r = el("poignee").getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height - 60 }; } };
})();

<!-- MENU -->
<script>
/* ==== LE MENU ☰ (GTH, 10/10) : interface épurée — à l'écran, seulement le titre, le score, la consigne et l'activité ====
   Tout le reste (niveaux, onglets de méthode, ✏️, 🔊, 🖨️, aide…) part dans un menu ☰, ouvert d'un toucher.
   Réglage par outil (CONF, posé par l'injecteur) : ancre = où mettre le bouton ☰ (sinon en haut à droite de l'écran) ;
   cacher = ce qui part dans le menu (sinon : tout ce qui, dans « .barre .droite », n'est pas un score).
   Installé par .claude/outils/menu-outil/injecter.py ; ne pas modifier dans l'outil, mais dans ce fichier. */
(function () {
  var CONF = {};
  var st = document.createElement("style");
  st.textContent =
    ".menu-btn{width:58px; height:58px; border-radius:16px; border:2px solid rgba(0,0,0,.15); background:#fff; color:#1f2a33; font-size:2rem; line-height:1; cursor:pointer; flex:none; padding:0;}" +
    ".menu-btn.fixe{position:fixed; top:10px; right:12px; z-index:150; box-shadow:0 4px 14px rgba(0,0,0,.15);}" +
    ".menu-btn.ouvert{background:#1f2a33; color:#fff;}" +
    ".menu-panneau{position:fixed; top:76px; right:16px; z-index:200; background:#fff; color:#1f2a33; border-radius:18px; box-shadow:0 18px 50px rgba(0,0,0,.28); padding:16px 18px;" +
    "  display:flex; flex-direction:column; align-items:flex-start; gap:12px; max-width:min(620px, 92vw); max-height:80vh; overflow:auto;}" +
    ".menu-panneau[hidden]{display:none !important;}" +
    ".menu-panneau h4{margin:0; font-family:sans-serif; font-size:.85rem; text-transform:uppercase; letter-spacing:.6px; color:#6d7a85;}" +
    ".menu-panneau > *{position:static !important; margin:0 !important;}" +
    ".menu-panneau > div,.menu-panneau > nav{display:flex; flex-wrap:wrap; gap:8px;}";
  document.head.appendChild(st);
  function installer() {
    var autres = [];
    if (CONF.cacher) CONF.cacher.forEach(function (s) { document.querySelectorAll(s).forEach(function (e) { if (autres.indexOf(e) === -1) autres.push(e); }); });
    else { var d = document.querySelector(".barre .droite"); if (d) autres = Array.prototype.filter.call(d.children, function (e) { return !e.classList.contains("score"); }); }
    if (!autres.length) return;
    var btn = document.createElement("button"); btn.type = "button"; btn.className = "menu-btn"; btn.title = "Niveaux et réglages"; btn.textContent = "☰";
    var pan = document.createElement("div"); pan.className = "menu-panneau"; pan.hidden = true;
    var t = document.createElement("h4"); t.textContent = "Niveaux et réglages"; pan.appendChild(t);
    autres.forEach(function (e) { pan.appendChild(e); });
    var ancre = document.querySelector(CONF.ancre || ".barre .droite");
    if (ancre) ancre.appendChild(btn); else { btn.classList.add("fixe"); document.body.appendChild(btn); }
    document.body.appendChild(pan);
    function ouvrir(o) { pan.hidden = !o; btn.classList.toggle("ouvert", o); }
    btn.addEventListener("click", function (e) { e.stopPropagation(); ouvrir(pan.hidden); });
    // un niveau choisi, ou une fenêtre ouverte (✏️, 🖨️) : le menu se referme ; on garde le menu ouvert pour choisir un type de jeu
    pan.addEventListener("click", function (e) { var b = e.target.closest("button"); if (b && !b.closest(CONF.garderOuvert || ".types")) setTimeout(function () { ouvrir(false); }, 120); });
    document.addEventListener("pointerdown", function (e) { if (!pan.hidden && !pan.contains(e.target) && e.target !== btn) ouvrir(false); });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", installer); else installer();
})();
</script>
<!-- /MENU -->
<!-- INDICE-COTE -->
<script>
/* 💡 sur le côté (Karim, 21/10) : dans les jeux qui ont un bouton « 💡 Indice » (.btn-indice), le bouton devient une ampoule seule,
   collée au bord droit de l'écran, à mi-hauteur ; l'indice s'ouvre dans une bulle à côté d'elle, jamais sous le jeu.
   Le jeu garde son propre code : au toucher, on regarde quel texte il vient d'écrire (zone #indice, ou la ligne de message),
   on le reprend dans la bulle et on remet la zone comme avant. Installé par injecter.py. */
(function () {
  var b = document.querySelector(".btn-indice"); if (!b) return;
  var st = document.createElement("style");
  st.textContent =
    ".btn-indice.cote{position:fixed !important; right:18px; top:50%; transform:translateY(-50%); width:76px; height:76px; padding:0 !important; border-radius:50% !important;" +
    " font-size:40px !important; line-height:1; z-index:60; margin:0 !important; display:flex; align-items:center; justify-content:center}" +
    "#bulle-cote{position:fixed; right:110px; top:50%; transform:translateY(-50%); max-width:520px; background:#fff8c4; border:2px solid #d4b106; border-radius:18px;" +
    " padding:16px 22px; font-size:26px; line-height:1.35; z-index:60; box-shadow:0 6px 18px rgba(0,0,0,.15); display:none}" +
    "#bulle-cote::after{content:''; position:absolute; right:-14px; top:50%; margin-top:-12px; border:12px solid transparent; border-left:14px solid #d4b106; border-right:none}";
  document.head.appendChild(st);
  b.classList.add("cote"); b.textContent = "💡"; b.title = "Indice"; document.body.appendChild(b);
  var bulle = document.createElement("div"); bulle.id = "bulle-cote"; document.body.appendChild(bulle);
  var zones = function () { return Array.prototype.slice.call(document.querySelectorAll("#indice, .indice, #message, .message, #verdict, .verdict, #consigne-aide")); };
  var avant = [], minuteur = null;
  b.addEventListener("click", function () { avant = zones().map(function (z) { return [z, z.textContent, z.className]; }); }, true);   // avant le code du jeu
  b.addEventListener("click", function () {
    setTimeout(function () {
      var txt = "";
      avant.forEach(function (a) {
        var z = a[0], neuf = z.textContent;
        if (neuf !== a[1] && neuf.trim()) { txt = neuf; z.textContent = a[1]; z.className = a[2]; }
      });
      if (!txt) return;   // le jeu montre l'indice autrement : on le laisse faire
      bulle.textContent = txt.replace(/^\s*💡\s*/, ""); bulle.style.display = "block";
      clearTimeout(minuteur); minuteur = setTimeout(function () { bulle.style.display = "none"; }, 8000);
    }, 0);
  });
  document.addEventListener("pointerdown", function (e) { if (e.target !== b && e.target !== bulle) bulle.style.display = "none"; });
})();
</script>
<!-- /INDICE-COTE -->
