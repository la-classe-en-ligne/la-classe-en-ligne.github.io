<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La dictée caméléon</title>
<!--
  26/11 (Karim), 3e version de la correction : « les groupes sont beaucoup trop grands ; la phrase à corriger doit être ce qu'on voit d'abord ; les groupes
  doivent apparaître plus petits, à droite du verbe, pour coller : d'abord les 3 groupes en petit ; quand on a choisi le groupe, ça s'agrandit un peu et ça colle
  la bonne terminaison » ; « certains élèves utilisent des roues de conjugaison (un cercle avec une fente) ».
  Avant : 1 caméléon vert = singulier, 2 orange = pluriel ; une flèche qui choisit le groupe puis la terminaison.
  Les étapes (▶ ou un toucher sur la phrase) :
    0. les deux phrases, en grand ; le verbe du pluriel a un trou ;
    1. ▶ Le groupe : l'infinitif sous le verbe, et les 3 groupes en petit à côté ; une flèche va au bon groupe, les deux autres pâlissent ;
    2. ▶ La personne : le groupe choisi devient sa roue de conjugaison ; la fente tourne jusqu'à la personne du sujet ;
    3. ▶ La terminaison : elle sort de la fente et vient se coller au verbe.
  Le 3e groupe : les 8 verbes du programme (-s, -s, -t ou -d, -ons, -ez, -ent ; programme 2025, CM1, p. 18) ; il ne sert pas dans les dictées n° 3 et n° 4.
-->
<style>
:root { --encre:#17252b; --gris:#607d8b; --fond:#f7faf6; --sg:#2e7d32; --pl:#e65100; }
html,body { margin:0; height:100%; background:var(--fond); color:var(--encre); font-family:"Segoe UI",Calibri,Arial,sans-serif; user-select:none; -webkit-user-select:none; overflow:hidden; }
#haut { position:absolute; left:28px; right:28px; top:10px; display:flex; align-items:center; gap:18px; z-index:3; }
#haut h1 { margin:0; font-size:28px; font-weight:600; }
#cam-titre .cameleon { font-size:46px; }
.ong { margin-left:auto; display:flex; gap:18px; }
.ong button { font:inherit; font-size:20px; background:none; border:0; border-bottom:3px solid transparent; color:var(--gris); cursor:pointer; padding:4px 2px; }
.ong button.on { color:var(--encre); border-bottom-color:#1f7a8c; }
/* les deux phrases, en grand : c'est ce qu'on voit d'abord */
#phrases { position:absolute; left:0; right:0; top:120px; display:grid; gap:10px; justify-content:center; cursor:pointer; }
.ph { display:flex; align-items:center; gap:22px; font-size:80px; font-weight:600; white-space:nowrap; }
.ph .cams { width:240px; display:flex; justify-content:flex-end; }
.ph .cams .cameleon { font-size:62px; }
.ph .suj { padding:0 4px; border-bottom:8px solid currentColor; }
.ph.sg .suj, .ph.sg .fin { color:var(--sg); } .ph.pl .suj, .ph.pl .fin { color:var(--pl); }
.ph .trou { display:inline-block; min-width:130px; border-bottom:6px dashed #b0bec5; color:transparent; }
.ph .fin.pose { display:inline-block; animation:pose .5s ease; }
@keyframes pose { 0%{transform:scale(1.6)} 100%{transform:none} }
.ph .pers { font-size:26px; font-weight:400; }
/* sous le verbe : l'infinitif, les 3 groupes en petit, puis la roue */
#outil { position:fixed; left:0; top:0; width:100vw; height:100vh; pointer-events:none; }
#inf { position:absolute; font-size:36px; padding:2px 18px; border-radius:12px; background:#fff; border:3px solid #cfd8dc; white-space:nowrap; transform:translateX(-50%); }
#inf b { color:var(--gc); }
.gp { position:absolute; width:180px; padding:8px 10px; border-radius:14px; background:#fff; border:4px solid var(--c); text-align:center; transition:all .6s ease; }
.gp b { display:block; color:var(--c); font-size:24px; } .gp span { display:block; font-size:17px; color:var(--gris); line-height:1.2; }
.gp.pale { opacity:.18; transform:scale(.9); } .gp.choisi { box-shadow:0 0 0 6px rgba(0,0,0,.08), 0 8px 18px rgba(0,0,0,.15); transform:scale(1.08); }
.gp.parti { opacity:0; transform:scale(.6); pointer-events:none; }
#roue { position:absolute; width:330px; height:330px; transition:opacity .5s, transform .6s; }
#roue.cache { opacity:0; transform:scale(.4); }
#roue .fente { transition:transform 1.1s cubic-bezier(.5,.1,.2,1); transform-origin:165px 165px; }
#fleches { position:fixed; left:0; top:0; width:100vw; height:100vh; pointer-events:none; z-index:5; overflow:visible; }
#fleches path { fill:none; stroke-width:7; stroke-linecap:round; }
#fleches path.trace { stroke-dasharray:var(--L); stroke-dashoffset:var(--L); animation:trace .8s ease forwards; }
@keyframes trace { to { stroke-dashoffset:0; } }
.vole { position:fixed; z-index:9; font-weight:700; color:var(--pl); transition:all 1s cubic-bezier(.4,.1,.2,1); pointer-events:none; }
#bas { position:absolute; left:0; right:0; bottom:14px; display:flex; justify-content:center; align-items:center; gap:26px; }
#bas button { font:inherit; font-size:30px; padding:8px 26px; border-radius:12px; border:2px solid #cfd8dc; background:#fff; cursor:pointer; }
#bas #go { background:#1f7a8c; border-color:#1f7a8c; color:#fff; min-width:300px; }
.points { display:flex; gap:8px; } .points span { width:16px; height:16px; border-radius:50%; background:#cfd8dc; } .points span.ici { background:#1f7a8c; }
.cameleon.vert .cc { animation:none; fill:#43a047; } .cameleon.vert .cq { animation:none; stroke:#43a047; }
.cameleon.orange .cc { animation:none; fill:#fb8c00; } .cameleon.orange .cq { animation:none; stroke:#fb8c00; }
</style>
</head>
<body>
<div id="haut"><span id="cam-titre"></span><h1>La dictée caméléon</h1>
  <div class="ong"><button data-o="n4-ardoise">À l'ardoise</button><button data-o="n4-cahier">Au cahier du jour</button><button data-o="n3">Jeudi 26</button></div></div>
<div id="phrases"></div>
<div id="outil"></div>
<div id="bas"><button id="avant">◀</button><div class="points" id="points"></div><button id="go">▶ Le groupe</button><button id="apres">▶▶</button></div>
<svg id="fleches"></svg>
<script>
// 🦎 → un caméléon dessiné en style émoji (Karim, 26/11 : « applique-toi sur le caméléon, il ne change même pas de couleur et on dirait un serpent ou un lézard
// banal » ; puis : « pas assez gros, le style n'est pas bon, ça ne fait pas émoji ; pour la couleur c'est bien »).
// Formes rondes et pleines, sans contour, reflet clair en haut, ombre en bas, gros œil brillant en tourelle, queue enroulée épaisse, casque.
// Le corps change lentement de couleur (vert, jaune, orange, rouge, violet, bleu) : la couleur est dessous, reflets et ombres restent par-dessus.
// Utilisé par Classe (l'icône de la dictée, l'écran-titre de la dictée caméléon) et par l'activité 🦎 La dictée caméléon (copie du même dessin).
(function () {
  const SVG = '<svg class="cameleon" viewBox="0 0 128 112" aria-hidden="true">'
    + '<defs><radialGradient id="cam-reflet" cx=".38" cy=".25" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset=".45" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>'
    + '<linearGradient id="cam-ombre" x1="0" y1="0" x2="0" y2="1"><stop offset=".45" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".32"/></linearGradient></defs>'
    // la queue enroulée, épaisse
    + '<path class="cq" d="M38 78 C20 88 2 78 3 57 C4 36 28 30 36 46 C42 58 32 68 22 62 C15 57 19 48 26 50" fill="none" stroke-width="10" stroke-linecap="round"/>'
    + '<path d="M38 78 C20 88 2 78 3 57 C4 36 28 30 36 46 C42 58 32 68 22 62 C15 57 19 48 26 50" fill="none" stroke="url(#cam-ombre)" stroke-width="10" stroke-linecap="round"/>'
    // les pattes, courtes et rondes
    + '<path class="cq" d="M54 84 L51 96 M90 84 L93 96" fill="none" stroke-width="13" stroke-linecap="round"/>'
    + '<ellipse class="cc" cx="49" cy="99" rx="9" ry="6"/><ellipse class="cc" cx="95" cy="99" rx="9" ry="6"/>'
    + '<path d="M54 84 L51 96 M90 84 L93 96" fill="none" stroke="#000" stroke-opacity=".16" stroke-width="13" stroke-linecap="round"/>'
    // la crête : des bosses rondes sur le dos
    + '<circle class="cc" cx="50" cy="44" r="7"/><circle class="cc" cx="62" cy="39" r="7.5"/><circle class="cc" cx="75" cy="38" r="7.5"/><circle class="cc" cx="87" cy="41" r="7"/>'
    + '<circle cx="50" cy="44" r="7" fill="#000" fill-opacity=".13"/><circle cx="62" cy="39" r="7.5" fill="#000" fill-opacity=".13"/><circle cx="75" cy="38" r="7.5" fill="#000" fill-opacity=".13"/><circle cx="87" cy="41" r="7" fill="#000" fill-opacity=".13"/>'
    // le corps, dodu
    + '<path class="cc" d="M36 72 C34 52 52 42 72 42 C92 42 106 54 104 72 C102 92 40 94 36 72 Z"/>'
    // le ventre plus clair, les rayures
    + '<path d="M44 80 C58 90 88 90 100 78 C96 92 46 94 44 80 Z" fill="#fff" fill-opacity=".35"/>'
    + '<path d="M54 50 C52 60 53 72 57 82 M70 46 C68 58 69 72 72 86 M86 48 C84 58 85 70 88 82" fill="none" stroke="#000" stroke-opacity=".14" stroke-width="5" stroke-linecap="round"/>'
    // la tête, ronde, avec son casque
    + '<path class="cc" d="M92 52 C94 34 106 22 114 22 C120 36 124 50 122 64 C120 78 104 82 96 74 C92 70 91 60 92 52 Z"/>'
    // reflet et ombre sur le corps et la tête
    + '<path d="M36 72 C34 52 52 42 72 42 C92 42 106 54 104 72 C102 92 40 94 36 72 Z" fill="url(#cam-reflet)"/>'
    + '<path d="M36 72 C34 52 52 42 72 42 C92 42 106 54 104 72 C102 92 40 94 36 72 Z" fill="url(#cam-ombre)"/>'
    + '<path d="M92 52 C94 34 106 22 114 22 C120 36 124 50 122 64 C120 78 104 82 96 74 C92 70 91 60 92 52 Z" fill="url(#cam-reflet)"/>'
    + '<path d="M92 52 C94 34 106 22 114 22 C120 36 124 50 122 64 C120 78 104 82 96 74 C92 70 91 60 92 52 Z" fill="url(#cam-ombre)"/>'
    // l'œil en tourelle, gros et brillant
    + '<circle class="cc" cx="108" cy="54" r="14"/><circle cx="108" cy="54" r="14" fill="#000" fill-opacity=".12"/>'
    + '<circle cx="109" cy="53" r="9" fill="#fff"/><circle class="pup" cx="111" cy="53" r="5.2" fill="#1a1a1a"/><circle cx="113" cy="50.5" r="2" fill="#fff"/>'
    // le sourire et la joue
    + '<path d="M101 70 Q112 74 121 66" fill="none" stroke="#000" stroke-opacity=".45" stroke-width="2.6" stroke-linecap="round"/>'
    + '<ellipse cx="104" cy="67" rx="4" ry="2.6" fill="#ff6f91" fill-opacity=".45"/>'
    + '</svg>';
  const CSS = '.cameleon{width:2.3em;height:2em;vertical-align:-.6em;overflow:visible}'
    + '.cameleon .cc{animation:cam-fill 14s linear infinite}'
    + '.cameleon .cq{animation:cam-stroke 14s linear infinite}'
    + '.cameleon .pup{animation:cam-oeil 5s ease-in-out infinite;transform-box:fill-box}'
    + '@keyframes cam-fill{0%,100%{fill:#43a047}17%{fill:#9ccc65}33%{fill:#fdd835}50%{fill:#fb8c00}66%{fill:#e53935}83%{fill:#8e24aa}92%{fill:#1e88e5}}'
    + '@keyframes cam-stroke{0%,100%{stroke:#43a047}17%{stroke:#9ccc65}33%{stroke:#fdd835}50%{stroke:#fb8c00}66%{stroke:#e53935}83%{stroke:#8e24aa}92%{stroke:#1e88e5}}'
    + '@keyframes cam-oeil{0%,40%,100%{transform:translate(0,0)}50%,80%{transform:translate(-4px,1px)}}';
  window.CAMELEON_SVG = SVG;
  if (typeof document !== "undefined") {
    const st = document.createElement("style"); st.textContent = CSS; (document.head || document.documentElement).appendChild(st);
  }
})();

document.getElementById("cam-titre").innerHTML = CAMELEON_SVG;
const C = (couleur, n) => Array.from({ length: n }, () => CAMELEON_SVG.replace('class="cameleon"', 'class="cameleon ' + couleur + '"')).join("");
const PERS = ["je", "tu", "il, elle", "nous", "vous", "ils, elles"];
const GROUPES = [
  { nom: "1er groupe", aide: "-er", c: "#1565c0", t: ["e", "es", "e", "ons", "ez", "ent"] },
  { nom: "2e groupe", aide: "-ir, nous …issons", c: "#6a1b9a", t: ["is", "is", "it", "issons", "issez", "issent"] },
  { nom: "3e groupe", aide: "prendre, venir, voir…", c: "#00796b", t: ["s", "s", "t (d)", "ons", "ez", "ent"] }
];
const NOM_P = ["1re personne du singulier", "2e personne du singulier", "3e personne du singulier", "1re personne du pluriel", "2e personne du pluriel", "3e personne du pluriel"];
// une paire : [avant, sujet 1, radical, fin 1, suite, sujet 2, fin 2, infinitif, groupe (0, 1, 2), personne 1, personne 2]
const P = {
  "n4-ardoise": [
    ["", "Il", "chant", "e", ".", "Ils", "ent", "chanter", 0, 2, 5],
    ["", "Elle", "grand", "it", ".", "Elles", "issent", "grandir", 1, 2, 5]
  ],
  "n4-cahier": [
    ["", "Papa", "coup", "e", " le pain.", "Papa et maman", "ent", "couper", 0, 2, 5],
    ["", "Je", "roug", "is", ".", "Nous", "issons", "rougir", 1, 0, 3],
    ["", "Tu", "lanc", "es", " le ballon.", "Vous", "ez", "lancer", 0, 1, 4],
    ["Défi · ", "Nina", "obé", "it", ".", "Nina et Léo", "issent", "obéir", 1, 2, 5]
  ],
  "n3": [
    ["", "Le chat", "mang", "e", ".", "Le chat et le chien", "ent", "manger", 0, 2, 5],
    ["", "Je", "parl", "e", ".", "Nous", "ons", "parler", 0, 0, 3],
    ["", "Léo", "chois", "it", " un livre.", "Léo et Tom", "issent", "choisir", 1, 2, 5],
    ["Défi · ", "Tu", "rempl", "is", " le verre.", "Vous", "issez", "remplir", 1, 1, 4]
  ]
};
let o = "n4-ardoise", i = 0, etape = 0, ctx = null;
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;");
const pron = (s, p) => /^(je|tu|il|elle|nous|vous|ils|elles)$/i.test(s) ? "" : "= " + ["je", "tu", "il", "nous", "vous", "ils"][p] + " · ";
function son(f) { try { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); const t = ctx.currentTime;
  (f || [[523, 0], [659, .09], [784, .18]]).forEach(([fr, d]) => { const os = ctx.createOscillator(), g = ctx.createGain(); os.type = "triangle"; os.frequency.value = fr; os.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(.0001, t + d); g.gain.exponentialRampToValueAtTime(.12, t + d + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d + .3); os.start(t + d); os.stop(t + d + .35); }); } catch (e) {} }
function fleche(de, a, couleur) {
  const [x1, y1] = de, [x2, y2] = a, d = "M" + x1 + " " + y1 + " Q" + ((x1 + x2) / 2) + " " + (Math.max(y1, y2) + 40) + " " + x2 + " " + y2;
  const S = $("fleches"), p = document.createElementNS("http://www.w3.org/2000/svg", "path");
  p.setAttribute("d", d); p.setAttribute("stroke", couleur); S.appendChild(p);
  const L = p.getTotalLength(); p.style.setProperty("--L", L); p.classList.add("trace");
  const pt = p.getPointAtLength(L), av = p.getPointAtLength(Math.max(0, L - 20)), ang = Math.atan2(pt.y - av.y, pt.x - av.x), k = 20;
  const h = document.createElementNS("http://www.w3.org/2000/svg", "path");
  h.setAttribute("d", "M" + (pt.x - k * Math.cos(ang - .45)) + " " + (pt.y - k * Math.sin(ang - .45)) + " L" + pt.x + " " + pt.y + " L" + (pt.x - k * Math.cos(ang + .45)) + " " + (pt.y - k * Math.sin(ang + .45)));
  h.setAttribute("stroke", couleur); h.style.opacity = 0; h.style.transition = "opacity .2s .7s"; S.appendChild(h); requestAnimationFrame(() => h.style.opacity = 1);
}
// la roue de conjugaison d'un groupe : 6 parts (la personne dehors, la terminaison dedans) ; la fente, un cadre orange qui tourne jusqu'à la personne
function roue(G, p1) {
  const R = 160, cx = 165, cy = 165, A = k => (k * 60 - 90 - 30) * Math.PI / 180, pt = (a, r) => [cx + r * Math.cos(a), cy + r * Math.sin(a)];
  let s = '<svg viewBox="0 0 330 330"><circle cx="165" cy="165" r="' + R + '" fill="#fff" stroke="' + G.c + '" stroke-width="6"/>';
  for (let k = 0; k < 6; k++) {
    const [x, y] = pt(A(k), R), m = A(k) + Math.PI / 6, [px, py] = pt(m, 122), [tx, ty] = pt(m, 76), lg = G.t[k].replace(" (d)", "").length;
    s += '<line x1="165" y1="165" x2="' + x + '" y2="' + y + '" stroke="' + G.c + '" stroke-opacity=".35" stroke-width="2"/>'
      + '<text x="' + px + '" y="' + (py + 8) + '" font-size="21" text-anchor="middle" fill="#607d8b">' + PERS[k].split(",")[0] + (k === 2 || k === 5 ? "…" : "") + '</text>'
      + '<text id="rt' + k + '" x="' + tx + '" y="' + (ty + 11) + '" font-size="' + (lg > 4 ? 23 : lg > 2 ? 27 : 32) + '" font-weight="700" text-anchor="middle" fill="' + (k === p1 ? "#2e7d32" : G.c) + '">-' + G.t[k].replace(" (d)", "") + '</text>';
  }
  s += '<circle cx="165" cy="165" r="22" fill="' + G.c + '"/>';
  // la fente : la part du haut (personne 0), qui tournera
  const [a1x, a1y] = pt(A(0), R + 4), [a2x, a2y] = pt(A(1), R + 4);
  s += '<path class="fente" id="fente" d="M165 165 L' + a1x + ' ' + a1y + ' A' + (R + 4) + ' ' + (R + 4) + ' 0 0 1 ' + a2x + ' ' + a2y + ' Z" fill="#e65100" fill-opacity=".14" stroke="#e65100" stroke-width="7" stroke-linejoin="round"/>';
  return s + '</svg>';
}
function dessiner() {
  document.querySelectorAll(".ong button").forEach(b => b.classList.toggle("on", b.dataset.o === o));
  $("fleches").innerHTML = ""; $("outil").innerHTML = "";
  const L = P[o], [av, s1, rad, f1, suite, s2, f2, inf, g, p1, p2] = L[i];
  const n2 = /^(nous|vous|ils|elles)$/i.test(s2) || / et /.test(s2) ? 2 : 1;
  $("phrases").innerHTML =
    '<div class="ph sg"><span class="cams">' + C("vert", 1) + '</span><span>' + esc(av) + '<span class="suj" id="suj1">' + esc(s1) + '</span> ' + esc(rad) + '<span class="fin">' + esc(f1) + '</span>' + esc(suite) + '</span>'
    + '</div>'
    + '<div class="ph pl"><span class="cams">' + C("orange", n2) + '</span><span>' + esc(av) + '<span class="suj" id="suj2">' + esc(s2) + '</span> ' + esc(rad)
    + (etape >= 3 ? '<span class="fin" id="fin2">' + esc(f2) + '</span>' : '<span class="trou" id="trou">' + esc(f2) + '</span>') + esc(suite) + '</span>'
    + '</div>';
  $("points").innerHTML = L.map((_, k) => '<span class="' + (k === i ? "ici" : "") + '"></span>').join("");
  $("go").textContent = ["▶ Le groupe", "▶ La personne", "▶ La terminaison", "▶ Paire suivante"][etape];
  if (etape === 0) return;
  // sous le verbe : l'infinitif, puis les groupes en petit, à droite
  const r = ($("trou") || $("fin2")).getBoundingClientRect(), x0 = r.left + r.width / 2, y0 = r.bottom + 26;
  const G = GROUPES[g], out = $("outil");
  out.insertAdjacentHTML("beforeend", '<div id="inf" style="left:' + x0 + 'px;top:' + y0 + 'px;--gc:' + G.c + '">' + esc(inf.slice(0, -2)) + '<b>' + esc(inf.slice(-2)) + '</b></div>');
  const gx = Math.max(20, Math.min(x0 - 290, innerWidth - 620)), gy = y0 + 80;
  GROUPES.forEach((H, k) => out.insertAdjacentHTML("beforeend", '<div class="gp' + (etape === 1 ? (k === g ? " choisi" : " pale") : " parti") + '" id="gp' + k + '" style="--c:' + H.c + ';left:' + (gx + k * 196) + 'px;top:' + gy + 'px"><b>' + H.nom + '</b><span>' + H.aide + '</span></div>'));
  if (etape >= 2) {
    const rx = Math.max(20, Math.min(x0 - 165, innerWidth - 360));
    out.insertAdjacentHTML("beforeend", '<div id="roue" class="cache" style="left:' + rx + 'px;top:' + (gy - 10) + 'px">' + roue(G, p1) + '</div>'
      + '<div style="position:absolute;' + (rx + 350 + 560 < innerWidth ? 'left:' + (rx + 350) + 'px' : 'right:' + (innerWidth - rx + 20) + 'px;text-align:right') + ';top:' + (gy + 110) + 'px;font-size:30px;line-height:1.5;white-space:nowrap"><div style="color:var(--pl);font-weight:700">« ' + esc(s2) + ' » ' + pron(s2, p2) + NOM_P[p2] + '</div><div style="color:var(--sg)">« ' + esc(s1) + ' » ' + pron(s1, p1) + NOM_P[p1] + '</div></div>');
    requestAnimationFrame(() => { $("roue").classList.remove("cache"); setTimeout(() => { const f = $("fente"); if (f) f.style.transform = "rotate(" + (p2 * 60) + "deg)"; }, etape === 2 ? 500 : 0); });
    if (etape >= 3) { const f = $("fente"); f.style.transition = "none"; f.style.transform = "rotate(" + (p2 * 60) + "deg)"; }
  }
  requestAnimationFrame(() => {
    const c = (el, cote) => { const q = el.getBoundingClientRect(); return cote === "droite" ? [q.right, q.top + q.height / 2] : [q.left + q.width / 2, q.top]; };
    if (etape === 1) { const a = $("inf").getBoundingClientRect(), b = $("gp" + g).getBoundingClientRect(); fleche([a.left + a.width / 2, a.bottom], [b.left + b.width / 2, b.top - 4], G.c); }
  });
}
function avancer() {
  if (etape < 3) {
    etape++;
