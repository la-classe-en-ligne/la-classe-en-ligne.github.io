<style>
  :root{
    --bg-deep:#0a1f2e; --bg-panel:#123246; --panel-border:#2d6079;
    --ink:#eaf6ff; --ink-soft:#a9c7d6; --moon:#ffe9a8; --good:#5be08a;
    --culture:#e0a86a; --culture-fond:#3a2614; /* marron du Réveil culturel dans Class Flow */
    --tile:#173b52;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0; color:var(--ink); font-family:"Quicksand",ui-sans-serif,system-ui,sans-serif;
    background:radial-gradient(circle at 88% 6%, rgba(255,233,168,0.18), transparent 42%),
      radial-gradient(1.5px 1.5px at 12% 22%, rgba(255,255,255,0.7), transparent),
      radial-gradient(1.2px 1.2px at 40% 12%, rgba(255,255,255,0.5), transparent), var(--bg-deep);
    background-size:auto,220px 200px,220px 200px,auto;
    padding:14px 16px; display:flex; justify-content:center; user-select:none; -webkit-user-select:none; touch-action:manipulation;}
  .page{width:100%; max-width:1400px; display:flex; flex-direction:column; gap:10px; min-height:calc(100vh - 28px);}
  .haut{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;}
  h1{font-family:"Baloo 2",cursive; font-size:clamp(1.5rem,3.4vw,2.2rem); margin:0; display:flex; align-items:center; gap:10px; color:var(--culture);}
  h1 svg{width:48px; height:48px;}
  .nav{display:flex; align-items:center; gap:10px;}
  .btn{font:inherit; font-weight:700; border-radius:999px; border:2px solid var(--panel-border); background:var(--tile); color:var(--ink);
    padding:8px 16px; cursor:pointer; font-size:1.2rem; min-width:52px; min-height:48px;}
  .btn:disabled{opacity:.3; cursor:default;}
  .date{font-family:"Baloo 2",cursive; font-size:clamp(1.1rem,2.4vw,1.5rem); min-width:15em; text-align:center; color:var(--moon);}
  [hidden]{display:none !important;}

  .scene{flex:1; display:flex; align-items:center; justify-content:center; min-height:0; border-radius:20px; background:#08192a;
    border:2px solid var(--panel-border); padding:10px; position:relative;}
  .scene img{max-width:100%; max-height:calc(100vh - 300px); object-fit:contain; border-radius:8px; box-shadow:0 10px 30px rgba(0,0,0,.5); cursor:zoom-in;}
  .absent{font-size:7rem; opacity:.5;}
  /* Son : gros bouton lecture + barre + ondes */
  .lecteur{display:flex; flex-direction:column; align-items:center; gap:22px; width:min(760px,90%); padding:20px 0;}
  .gros{width:170px; height:170px; border-radius:50%; border:none; background:var(--culture); color:#2a1606; font-size:4.6rem; cursor:pointer;
    box-shadow:0 0 0 10px rgba(224,168,106,.18), 0 12px 30px rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; padding:0 0 0 10px;}
  .gros.lecture{padding:0;}
  .barre{width:100%; height:18px; border-radius:999px; background:#1d3b52; cursor:pointer; overflow:hidden;}
  .barre div{height:100%; width:0; background:linear-gradient(90deg,var(--culture),var(--moon));}
  .ondes{display:flex; gap:8px; align-items:flex-end; height:70px;}
  .ondes span{width:12px; border-radius:6px; background:var(--culture); height:12px; opacity:.6;}
  .ondes.joue span{animation:onde 1s ease-in-out infinite;}
  .ondes span:nth-child(2){animation-delay:.15s} .ondes span:nth-child(3){animation-delay:.3s} .ondes span:nth-child(4){animation-delay:.45s}
  .ondes span:nth-child(5){animation-delay:.6s} .ondes span:nth-child(6){animation-delay:.75s} .ondes span:nth-child(7){animation-delay:.9s}
  @keyframes onde{0%,100%{height:12px}50%{height:66px}}

  .fiche{display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap;}
  .titre{font-family:"Baloo 2",cursive; font-style:italic; font-size:clamp(1.8rem,4vw,3rem); line-height:1.05; margin:0;}
  .auteur{font-size:clamp(1.2rem,2.6vw,1.8rem); font-weight:700; color:var(--ink-soft); margin-top:4px;}
  .auteur b{color:var(--moon);}
  .puces{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;}
  .puce{border-radius:999px; padding:4px 14px; background:var(--culture-fond); border:2px solid var(--culture); color:#ffdcb3; font-weight:700; font-size:1.05rem;}
  .boutons{display:flex; gap:12px;}
  .boutons .btn{font-size:2rem; width:78px; height:78px; padding:0; border-color:var(--culture); background:var(--culture-fond);}

  .boutons .btn.maitre { border-color: var(--panel-border); background: var(--tile); width: 60px; height: 60px; font-size: 1.6rem; align-self: flex-end; }
  .fiche-maitre { background: #fbf6ea; color: #2b2010; border-radius: 16px; padding: 22px 30px; max-width: 1000px; max-height: 90vh; overflow: auto;
    font-size: 1.15rem; line-height: 1.5; text-align: left; cursor: default; }
  .fiche-maitre h2 { font-family: "Baloo 2", cursive; margin: 0 0 6px; color: #7a4a14; font-size: 1.7rem; }
  .fiche-maitre h3 { margin: 16px 0 6px; font-size: 1.05rem; text-transform: uppercase; letter-spacing: .06em; color: #1f7a8c; }
  .fiche-maitre ul { margin: 0; padding-left: 22px; } .fiche-maitre li { margin: 3px 0; }
  .fiche-maitre .ra { color: #b0560c; }
  /* Réveil v2 (03/10) : thème de la semaine, 🔧 comment, 🔢 chiffre, 🖼️ galerie */
  .theme{align-self:center; font-family:"Baloo 2",cursive; font-size:clamp(1.1rem,2.4vw,1.6rem); color:#2a1606; background:var(--culture);
    border-radius:999px; padding:2px 22px; box-shadow:0 4px 14px rgba(0,0,0,.35);}
  .comment{width:min(1300px,94vw); display:flex; flex-direction:column; align-items:center; gap:24px; cursor:pointer;}
  .comment .grand{font-size:clamp(1.6rem,3.4vw,2.8rem);}
  .comment .imgs{display:flex; gap:18px; justify-content:center; flex-wrap:wrap;}
  .comment .imgs img{max-height:46vh; max-width:44vw; border-radius:10px; background:#fff;}
  .chiffre{display:flex; flex-direction:column; align-items:center; gap:14px; text-align:center; cursor:pointer;}
  .chiffre b{font-family:"Baloo 2",cursive; font-size:clamp(4rem,13vw,10rem); line-height:1; color:var(--moon);}
  .chiffre span{font-size:clamp(1.6rem,3.6vw,3rem); font-weight:700; max-width:1100px;}
  .galerie{position:fixed; inset:0; z-index:45; background:#02080d; display:flex; align-items:center; justify-content:center; touch-action:none;}
  .galerie img{max-width:100vw; max-height:100vh; object-fit:contain; transition:transform .25s ease, opacity .25s ease;}
  .galerie .legende{position:fixed; left:0; right:0; bottom:0; padding:16px 120px 20px 28px; background:linear-gradient(transparent, rgba(0,0,0,.85) 35%);
    font-size:clamp(1.2rem,2.4vw,1.9rem); font-weight:700; color:#fff; text-shadow:0 2px 6px #000;}
  .galerie .fleche{position:fixed; top:50%; margin-top:-44px; width:72px; height:88px; border:0; border-radius:18px; background:rgba(255,255,255,.12);
    color:#fff; font-size:2.6rem; cursor:pointer;}
  .galerie .fleche.g{left:14px;} .galerie .fleche.d{right:14px;}
  .galerie .fermer{position:fixed; top:14px; right:14px; width:60px; height:60px; border:0; border-radius:50%; background:var(--culture); color:#2a1606; font-size:1.8rem; cursor:pointer;}
  .galerie .points{position:fixed; top:22px; left:50%; transform:translateX(-50%); display:flex; gap:10px;}
  .galerie .points i{width:14px; height:14px; border-radius:50%; background:rgba(255,255,255,.35);} .galerie .points i.actif{background:var(--moon);}
  /* Surimpressions */
  .voile{position:fixed; inset:0; z-index:40; background:rgba(4,14,22,.94); display:flex; align-items:center; justify-content:center; padding:4vh 5vw; cursor:pointer;}
  .voile .grand{font-size:clamp(2rem,4.6vw,3.6rem); font-weight:700; line-height:1.35; text-align:center; max-width:1300px;}
  .voile .grand.ecrit{font-family:"Belle Allure CM","Quicksand",cursive; font-weight:400; background:#f3e7c4; color:#2b2010; border-radius:18px; padding:20px 40px 34px;
    border:6px solid #7a5a2a; font-size:clamp(2.4rem,5vw,4rem); line-height:1.9;}
  .voile img{max-width:96vw; max-height:94vh; object-fit:contain;}
  .ouquand{width:min(1300px,96vw); display:flex; flex-direction:column; gap:26px; align-items:center; cursor:pointer;}
  .carte{width:100%; background:#0f3550; border-radius:16px; border:2px solid var(--panel-border);}
  .carte path.terres{fill:#2f6e5a; stroke:#1b4a3c; stroke-width:.3;}
  .point{fill:#ff5a4f; stroke:#fff; stroke-width:.8;}
  .halo{fill:none; stroke:#ff5a4f; stroke-width:1.2; animation:halo 1.6s ease-out infinite; transform-box:fill-box; transform-origin:center;}
  @keyframes halo{0%{transform:scale(.4); opacity:1}100%{transform:scale(3.2); opacity:0}}
  .lieu{font-family:"Baloo 2",cursive; font-size:clamp(1.4rem,3vw,2.2rem); color:var(--moon); text-align:center;}
  .frise{width:100%; display:grid; grid-template-columns:repeat(5,1fr); gap:6px; position:relative; padding-top:64px;}
  .periode{text-align:center; padding:12px 6px; border-radius:10px; background:#1a3a50; color:var(--ink-soft); font-weight:700; font-size:clamp(.9rem,1.8vw,1.25rem); position:relative;}
  .periode.active{background:var(--culture); color:#2a1606;}
  .repere{position:absolute; top:0; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center;}
  .repere span{font-family:"Baloo 2",cursive; font-size:clamp(1.2rem,2.4vw,1.7rem); color:var(--moon); white-space:nowrap; background:#0a1f2e; border:2px solid var(--moon); border-radius:10px; padding:0 12px;}
  .repere i{width:4px; height:22px; background:var(--moon);}
</style>
</head>
<body>
<div class="page">
  <div class="haut">
    <h1><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 6C17 6 5 17 5 31c0 12 9 21 20 21 5 0 6-3 6-6s-2-5 1-7 9 0 14 0c7 0 13-5 13-12C59 15 47 6 32 6z" fill="#e0a86a"/><circle cx="18" cy="26" r="4.5" fill="#e8554e"/><circle cx="28" cy="16" r="4.5" fill="#f4c542"/><circle cx="41" cy="17" r="4.5" fill="#4fb0e8"/><circle cx="48" cy="29" r="4.5" fill="#5bd08a"/><circle cx="25" cy="40" r="5" fill="#0a1f2e"/></svg>Réveil culturel</h1>
    <div class="nav">
      <button class="btn" id="precedent" type="button" title="Jour précédent">◀</button>
      <span class="date" id="date"></span>
      <button class="btn" id="suivant" type="button" title="Jour suivant">▶</button>
      <button class="btn" id="aujourdhui" type="button" title="Aujourd'hui">📅</button>
    </div>
  </div>

  <div class="theme" id="theme"></div>
  <div class="scene" id="scene"></div>

  <div class="fiche">
    <div>
      <p class="titre" id="titre"></p>
      <div class="auteur" id="auteur"></div>
      <div class="puces" id="puces"></div>
    </div>
    <div class="boutons">
      <button class="btn" id="bGalerie" type="button" title="Illustrer : d'autres images">🖼️</button>
      <button class="btn" id="bComment" type="button" title="Comment ?">🔧</button>
      <button class="btn" id="bChiffre" type="button" title="Un chiffre">🔢</button>
      <button class="btn" id="bAnecdote" type="button" title="Anecdote">💡</button>
      <button class="btn" id="bCopie" type="button" title="Phrase à copier">✍️</button>
      <button class="btn" id="bOuQuand" type="button" title="Où et quand">🗺️</button>
      <button class="btn" id="bLien" type="button" title="Voir ou écouter en ligne">🔗</button>
      <button class="btn maitre" id="bMaitre" type="button" title="Pour moi : quoi dire, quoi montrer, quelles questions">👨‍🏫</button>
    </div>
  </div>
</div>
<div class="voile" id="voile" hidden></div>
<audio id="audio" preload="metadata"></audio>

<script src="Réveil culturel/donnees.js"></script>
<script>
(function () {
  var R = window.REVEILS || [], el = function (id) { return document.getElementById(id); };
  var i = 0, audio = el("audio");
  var JOURS = ["dimanche", "lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi"];
  var MOIS = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
  function iso(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function dateLisible(s) {
    var d = new Date(s + "T12:00:00");
    var j = JOURS[d.getDay()]; return j.charAt(0).toUpperCase() + j.slice(1) + " " + (d.getDate() === 1 ? "1er" : d.getDate()) + " " + MOIS[d.getMonth()] + " " + d.getFullYear();
  }
  // Le jour de classe du jour, ou le suivant (week-end, vacances) ; après la fin de l'année, le dernier.
  function indexDuJour(s) {
    for (var k = 0; k < R.length; k++) if (R[k].d >= s) return k;
    return R.length - 1;
  }

  // Frise des périodes du programme (chaque période a la même largeur ; l'année est placée à l'intérieur).
  var PERIODES = [
    { nom: "Préhistoire", de: -40000, a: -3000 }, { nom: "Antiquité", de: -3000, a: 476 }, { nom: "Moyen Âge", de: 476, a: 1492 },
    { nom: "Temps modernes", de: 1492, a: 1789 }, { nom: "Époque contemporaine", de: 1789, a: 2030 }
  ];

  function afficher() {
    var r = R[i];
    arreter();
    el("date").textContent = dateLisible(r.d);
    el("precedent").disabled = i === 0; el("suivant").disabled = i === R.length - 1;
    var sc = el("scene"); sc.innerHTML = "";
    if (r.m && r.son) {
      audio.src = encodeURI("Réveil culturel/" + r.m);
      sc.innerHTML = '<div class="lecteur"><button class="gros" id="jouer" type="button" title="Écouter">▶</button>' +
        '<div class="ondes" id="ondes"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>' +
        '<div class="barre" id="barre"><div id="avance"></div></div></div>';
      el("jouer").addEventListener("click", function () { if (audio.paused) audio.play(); else audio.pause(); });
      el("barre").addEventListener("click", function (e) {
        var b = el("barre").getBoundingClientRect(); if (audio.duration) audio.currentTime = duree() * (e.clientX - b.left) / b.width;
      });
    } else if (r.m) {
      audio.removeAttribute("src");
      var img = new Image(); img.src = encodeURI("Réveil culturel/" + r.m); img.alt = r.t; img.id = "oeuvre";
      img.addEventListener("click", function () { ouvrir('<img src="' + img.src + '" alt="">'); });
      sc.appendChild(img);
    } else {
      audio.removeAttribute("src");
      sc.innerHTML = '<span class="absent">' + r.e + '</span>';
    }
    el("titre").textContent = r.t; el("titre").title = r.oral;
    el("auteur").innerHTML = "<b></b> · <span></span>";
    el("auteur").firstChild.textContent = r.a; el("auteur").lastChild.textContent = r.y;
    var p = el("puces"); p.innerHTML = "";
    [r.g, r.l, r.c].forEach(function (x) { if (x) { var s = document.createElement("span"); s.className = "puce"; s.textContent = x; p.appendChild(s); } });
    el("bCopie").hidden = !r.copie;
    el("bGalerie").hidden = !(r.galerie && r.galerie.length);
    el("bComment").hidden = !r.comment;
    el("bChiffre").hidden = !r.chiffre;
    var th = r.theme || ["🎨", "Une œuvre d'art"];
    el("theme").textContent = th[0] + " " + th[1];
    el("bMaitre").hidden = !r.maitre;
    // 🔗 seulement s'il manque quelque chose en local : pas de média, ou une musique dont on n'a que l'image.
    el("bLien").hidden = !(!r.m && r.lien) && !(!r.son && r.ecoute);
  }

  function arreter() { audio.pause(); var o = el("ondes"); if (o) o.classList.remove("joue"); }
  audio.addEventListener("play", function () { var b = el("jouer"); if (b) { b.textContent = "⏸"; b.classList.add("lecture"); } el("ondes") && el("ondes").classList.add("joue"); });
  audio.addEventListener("pause", function () { var b = el("jouer"); if (b) { b.textContent = "▶"; b.classList.remove("lecture"); } el("ondes") && el("ondes").classList.remove("joue"); });
  // 2 minutes d'écoute suffisent : la barre couvre ces 2 minutes, puis la musique s'arrête et revient au début.
  var MAX = 120;
  function duree() { return Math.min(audio.duration || MAX, MAX); }
  audio.addEventListener("timeupdate", function () {
    var a = el("avance"); if (a) a.style.width = Math.min(100, 100 * audio.currentTime / duree()) + "%";
    if (audio.currentTime >= MAX) { audio.pause(); audio.currentTime = 0; }
  });
  audio.addEventListener("ended", function () { audio.currentTime = 0; });

  function ouvrir(html) { var v = el("voile"); v.innerHTML = html; v.hidden = false; }
  el("voile").addEventListener("click", function () { el("voile").hidden = true; el("voile").innerHTML = ""; });
  function echapper(t) { var d = document.createElement("div"); d.textContent = t; return d.innerHTML; }

  el("bMaitre").addEventListener("click", function () {
    var r = R[i], m = r.maitre, h = '<div class="fiche-maitre"><h2>' + echapper(r.t) + ' — ' + echapper(r.a) + ' (' + echapper(r.y) + ')</h2>';
    h += '<h3>En deux mots</h3><p>' + echapper(m.quoi) + '</p>';
    h += '<h3>Ce que je montre</h3><ul>' + m.regarder.map(function (x) { return '<li>' + echapper(x) + '</li>'; }).join("") + '</ul>';
    h += '<h3>Les questions que je pose</h3><ul>' + m.questions.map(function (q) { return '<li><b>' + echapper(q[0]) + '</b><br><span class="ra">R.A. : ' + echapper(q[1]) + '</span></li>'; }).join("") + '</ul>';
    h += '<h3>Les mots à apprendre</h3><ul>' + m.mots.map(function (x) { return '<li>' + echapper(x) + '</li>'; }).join("") + '</ul>';
    if (m.plus) h += '<h3>Pour aller plus loin</h3><p>' + echapper(m.plus) + '</p>';
    ouvrir(h + '</div>');
  });
  el("bComment").addEventListener("click", function () {
    var r = R[i], h = '<div class="comment"><div class="grand">' + echapper(r.comment) + '</div>';
    if (r.comment_img && r.comment_img.length) h += '<div class="imgs">' + r.comment_img.map(function (m) { return '<img src="' + encodeURI("Réveil culturel/" + m) + '" alt="">'; }).join("") + '</div>';
    ouvrir(h + '</div>');
  });
  el("bChiffre").addEventListener("click", function () {
    var c = R[i].chiffre; ouvrir('<div class="chiffre"><b>' + echapper(c[0]) + '</b><span>' + echapper(c[1]) + '</span></div>');
  });

  // 🖼️ Galerie plein écran : glisser au doigt (ou ◀ ▶ / flèches du clavier), légende en bas ; ✕ pour revenir.
  var gal = null;
  function galerieAfficher() {
    var g = R[i].galerie, x = g[gal.k];
    gal.img.src = encodeURI("Réveil culturel/" + x.m); gal.img.alt = x.l;
    gal.leg.textContent = x.l;
    gal.points.innerHTML = g.map(function (_, k) { return '<i class="' + (k === gal.k ? "actif" : "") + '"></i>'; }).join("");
    gal.g.hidden = gal.k === 0; gal.d.hidden = gal.k === g.length - 1;
  }
  function galerieAller(k) { var n = R[i].galerie.length; gal.k = Math.max(0, Math.min(n - 1, k)); galerieAfficher(); }
  function galerieFermer() { if (gal) { gal.el.remove(); gal = null; } }
  el("bGalerie").addEventListener("click", function () {
    galerieFermer();
    var d = document.createElement("div"); d.className = "galerie";
    d.innerHTML = '<img alt=""><div class="points"></div><div class="legende"></div>' +
      '<button class="fleche g" type="button" title="Image précédente">◀</button><button class="fleche d" type="button" title="Image suivante">▶</button>' +
      '<button class="fermer" type="button" title="Fermer">✕</button>';
    document.body.appendChild(d);
    gal = { el: d, k: 0, img: d.querySelector("img"), leg: d.querySelector(".legende"), points: d.querySelector(".points"),
      g: d.querySelector(".fleche.g"), d: d.querySelector(".fleche.d") };
    gal.g.addEventListener("click", function () { galerieAller(gal.k - 1); });
    gal.d.addEventListener("click", function () { galerieAller(gal.k + 1); });
    var btF = d.querySelector(".fermer");   // au toucher, on ferme dès que le doigt se lève (le clic peut ne pas suivre un glissement)
    btF.addEventListener("pointerup", function (e) { e.stopPropagation(); galerieFermer(); });
    btF.addEventListener("click", galerieFermer);
    var x0 = null;
    d.addEventListener("pointerdown", function (e) { if (e.target.tagName !== "BUTTON") x0 = e.clientX; });
    d.addEventListener("pointerup", function (e) {
      if (x0 === null) return; var dx = e.clientX - x0; x0 = null;
      if (Math.abs(dx) > 50) galerieAller(gal.k + (dx < 0 ? 1 : -1));
    });
    galerieAfficher();
  });

  el("bAnecdote").addEventListener("click", function () { ouvrir('<div class="grand">' + echapper(R[i].anecdote) + '</div>'); });
  el("bCopie").addEventListener("click", function () { ouvrir('<div class="grand ecrit">' + echapper(R[i].copie) + '</div>'); });
  el("bLien").addEventListener("click", function () { var r = R[i]; window.open(r.ecoute || r.lien, "_blank"); });
  el("bOuQuand").addEventListener("click", function () {
    var r = R[i], h = '<div class="ouquand">';
    if (r.la !== null && r.lo !== null) {
      var x = r.lo + 180, y = 90 - r.la;
      h += '<svg class="carte" viewBox="0 8 360 150" preserveAspectRatio="xMidYMid meet"><path class="terres" d="' + window.CARTE_TERRES + '"/>' +
        '<circle class="halo" cx="' + x + '" cy="' + y + '" r="3"/><circle class="point" cx="' + x + '" cy="' + y + '" r="2.6"/></svg>';
    }
    h += '<div class="lieu">' + echapper(r.l) + '</div><div class="frise">';
    var k = -1, pos = 0;
    if (r.n !== null) PERIODES.forEach(function (p, j) { if (r.n >= p.de && (r.n < p.a || j === PERIODES.length - 1)) { k = j; pos = (r.n - p.de) / (p.a - p.de); } });
    PERIODES.forEach(function (p, j) { h += '<div class="periode' + (j === k ? " active" : "") + '">' + p.nom + '</div>'; });
    if (k >= 0) h += '<div class="repere" style="left:' + ((k + Math.min(Math.max(pos, .06), .94)) * 20) + '%"><span>' + echapper(r.y) + '</span><i></i></div>';
    h += '</div></div>';
    ouvrir(h);
  });

  function aller(k) { galerieFermer(); i = Math.max(0, Math.min(R.length - 1, k)); afficher(); }
  el("precedent").addEventListener("click", function () { aller(i - 1); });
  el("suivant").addEventListener("click", function () { aller(i + 1); });
  el("aujourdhui").addEventListener("click", function () { aller(indexDuJour(iso(new Date()))); });
  document.addEventListener("keydown", function (e) {
    if (gal) { if (e.key === "ArrowLeft") galerieAller(gal.k - 1); if (e.key === "ArrowRight") galerieAller(gal.k + 1); if (e.key === "Escape") galerieFermer(); return; }
    if (e.key === "ArrowLeft") aller(i - 1);
    if (e.key === "ArrowRight") aller(i + 1);
    if (e.key === "Escape") el("voile").click();
  });

  var demande = (location.search.match(/date=(\d{4}-\d{2}-\d{2})/) || [])[1];
  aller(indexDuJour(demande || iso(new Date())));
  window.REVEIL = { aller: aller, index: function () { return i; }, indexDuJour: indexDuJour };
})();
</script>
</body>
</html>
